name: readiness-audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

jobs:
  readiness:
    name: saleable-readiness-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main

    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v2 --untracked-files=all)"

      - name: setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.19.0"
          cache: npm

      - name: verify package-manager toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"

      - name: install
        run: npm ci --legacy-peer-deps=false --install-links=false

      - name: collect KPI logs (URL or tail command)
        env:
          NOEMA_KPI_LOG_URL: ${{ vars.NOEMA_KPI_LOG_URL }}
          NOEMA_KPI_TAIL_COMMAND: ${{ vars.NOEMA_KPI_TAIL_COMMAND }}
          NOEMA_KPI_SOURCE_KIND: production
          NOEMA_KPI_SOURCE_ID: ${{ vars.NOEMA_KPI_SOURCE_ID }}
          NOEMA_KPI_PROVENANCE_PATH: exchange-30d.ndjson.provenance.json
        run: |
          if [ -n "${NOEMA_KPI_LOG_URL}" ]; then
            echo "Collecting KPI logs from NOEMA_KPI_LOG_URL."
            NOEMA_KPI_LOG_PATH=exchange-30d.ndjson \
            NOEMA_KPI_PROVENANCE_PATH="${NOEMA_KPI_PROVENANCE_PATH}" \
            NOEMA_KPI_LOG_URL="${NOEMA_KPI_LOG_URL}" \
            npm run kpi:collect
          elif [ -n "${NOEMA_KPI_TAIL_COMMAND}" ]; then
            echo "Collecting KPI logs from NOEMA_KPI_TAIL_COMMAND."
            NOEMA_KPI_LOG_PATH=exchange-30d.ndjson \
            NOEMA_KPI_PROVENANCE_PATH="${NOEMA_KPI_PROVENANCE_PATH}" \
            NOEMA_KPI_TAIL_COMMAND="${NOEMA_KPI_TAIL_COMMAND}" \
            npm run kpi:collect
          else
            echo "NOEMA_KPI_LOG_URL / NOEMA_KPI_TAIL_COMMAND not set. Skipping KPI pre-collect."
            exit 0
          fi

      - name: Mint repository-scoped private-reporting read token
        id: private_reporting_app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.NOEMA_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.NOEMA_GITHUB_APP_PRIVATE_KEY }}
          owner: ContextualWisdomLab
          repositories: noema
          permission-metadata: read

      - name: Collect exact-source private vulnerability reporting evidence
        env:
          NOEMA_AUDIT_REPOSITORY: ${{ github.repository }}
          NOEMA_AUDIT_SOURCE_SHA: ${{ github.sha }}
          DELEGATED_PRIVATE_REPORTING_TOKEN: ${{ steps.private_reporting_app.outputs.token }}
          NOEMA_PRIVATE_VULNERABILITY_REPORTING_AUDIT_PATH: ${{ runner.temp }}/private-vulnerability-reporting-audit.json
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          token_dir="$(mktemp -d "$RUNNER_TEMP/noema-private-reporting-token.XXXXXX")"
          trap 'rm -rf "$token_dir"' EXIT
          token_path="$token_dir/github-token"
          printf '%s' "$DELEGATED_PRIVATE_REPORTING_TOKEN" > "$token_path"
          chmod 0600 "$token_path"
          unset DELEGATED_PRIVATE_REPORTING_TOKEN
          export NOEMA_PRIVATE_VULNERABILITY_REPORTING_TOKEN_PATH="$token_path"
          npm run security:private-reporting-audit

      - name: run readiness audit
        env:
          NOEMA_AUDIT_REPORT_ONLY: ${{ github.event_name == 'schedule' && '1' || '0' }}
          NOEMA_KPI_LOG_PATH: exchange-30d.ndjson
          NOEMA_KPI_EVIDENCE_PATH: noema-kpi-evidence.json
          NOEMA_KPI_PROVENANCE_PATH: exchange-30d.ndjson.provenance.json
          NOEMA_EXCHANGE_URL: ${{ vars.NOEMA_EXCHANGE_URL }}
          NOEMA_SMOKE_EVIDENCE_PATH: noema-smoke-evidence.json
          NOEMA_PRIVATE_VULNERABILITY_REPORTING_RECEIPT_PATH: ${{ runner.temp }}/private-vulnerability-reporting-audit.json
          NOEMA_PRIVATE_VULNERABILITY_REPORTING_EXPECTED_SOURCE_SHA: ${{ github.sha }}
          NOEMA_PRIVATE_VULNERABILITY_REPORTING_MAX_AGE_MINUTES: "30"
        run: |
          set +e
          npm run readiness:audit
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::Readiness audit failed. Report-only mode only suppresses external evidence gaps; see failed-check details above."
          fi
          exit "$status"

      - name: upload readiness artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: saleable-readiness-audit
          path: |
            artifacts/saleable-readiness/**/goal-audit.json
            noema-kpi-evidence.json
            exchange-30d.ndjson.provenance.json
            noema-smoke-evidence.json
            ${{ runner.temp }}/private-vulnerability-reporting-audit.json
          if-no-files-found: error
