name: refresh package lock

on:
  push:
    branches:
      - fix/fail-closed-client-identity
    paths:
      - package.json
      - .github/workflows/refresh-package-lock.yml

permissions:
  contents: write

concurrency:
  group: refresh-package-lock
  cancel-in-progress: true

jobs:
  refresh:
    if: github.repository == 'ContextualWisdomLab/noema' && github.ref == 'refs/heads/fix/fail-closed-client-identity'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fail-closed-client-identity
          fetch-depth: 0
          persist-credentials: true

      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: refresh and verify lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          test "$(node -p "require('./package-lock.json').packages[''].engines.node")" = ">=22"
          test "$(node -p "require('./package-lock.json').packages['node_modules/undici'].version")" = "7.29.0"
          npm audit --audit-level=high

      - name: commit generated lockfile and remove bootstrap workflow
        run: |
          rm .github/workflows/refresh-package-lock.yml
          git config user.name 'noema-maintainer[bot]'
          git config user.email 'noema-maintainer[bot]@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/refresh-package-lock.yml
          git diff --cached --check
          git commit -m 'chore(runtime): synchronize supported Node.js engine lock'
          git push origin HEAD:fix/fail-closed-client-identity
