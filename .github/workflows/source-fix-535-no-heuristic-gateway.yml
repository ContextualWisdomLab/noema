name: Source fix PR535 no-heuristic gateway

on:
  push:
    branches:
      - fix/noema-orchestrator-free-routing-alias
    paths:
      - .github/source-fix-535-no-heuristic-gateway.trigger

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'ContextualWisdomLab/noema'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up exact Node toolchain
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Set up reviewer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install locked test dependencies
        run: |
          set -euo pipefail
          npm install --global npm@11.17.0
          npm ci --ignore-scripts
          python -m pip install --require-hashes --no-deps -r reviewer/requirements-ci-hashes.txt

      - name: Prove the no-heuristic regressions are RED before repair
        run: |
          set -euo pipefail
          set +e
          npx vitest run test/no-heuristic-gateway-workflow.test.ts
          ts_status=$?
          PYTHONPATH=reviewer python -m pytest -q reviewer/tests/test_no_heuristic_gateway_policy.py
          py_status=$?
          set -e
          if [ "$ts_status" -eq 0 ] || [ "$py_status" -eq 0 ]; then
            echo "::error::At least one no-heuristic regression was unexpectedly GREEN before production repair."
            exit 1
          fi
          echo "Both workflow and Python no-heuristic regressions reproduced the production defect."

      - name: Apply exact guarded owner repair
        run: python scripts/source_fix_535_no_heuristic_gateway.py

      - name: Verify focused exact-tree contracts
        run: |
          set -euo pipefail
          npx vitest run \
            test/no-heuristic-gateway-workflow.test.ts \
            test/hourly-product-development-workflow.test.ts \
            test/orchestrator-gateway-contract.test.ts \
            test/orchestrator-gateway-routing-alias.test.ts \
            test/orchestrator-gateway-secret-source.test.ts
          PYTHONPATH=reviewer python -m pytest -q \
            reviewer/tests/test_no_heuristic_gateway_policy.py \
            reviewer/tests/test_config.py \
            reviewer/tests/test_central_review_workflow.py \
            reviewer/tests/test_central_review_isolation.py
          git diff --check

      - name: Remove completed one-shot repair machinery
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/source-fix-535-no-heuristic-gateway.yml \
            .github/source-fix-535-no-heuristic-gateway.trigger \
            scripts/source_fix_535_no_heuristic_gateway.py
          git diff --check

      - name: Commit and push only the verified repair
        env:
          EXPECTED_TRIGGER_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin fix/noema-orchestrator-free-routing-alias
          remote_head="$(git rev-parse origin/fix/noema-orchestrator-free-routing-alias)"
          if [ "$remote_head" != "$EXPECTED_TRIGGER_HEAD" ]; then
            echo "::error::Repair branch moved concurrently; refusing to overwrite or guess a merge."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::error::Source fix produced no publishable delta."
            exit 1
          fi
          git commit -m "fix(noema): remove downstream inference heuristics"
          git push origin HEAD:fix/noema-orchestrator-free-routing-alias
