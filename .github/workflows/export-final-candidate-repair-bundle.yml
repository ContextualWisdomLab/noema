name: Export final candidate repair bundle

on:
  push:
    branches:
      - feat/hourly-nim-opencode-development
    paths:
      - .github/workflows/export-final-candidate-repair-bundle.yml

concurrency:
  group: export-final-candidate-repair-bundle-${{ github.repository }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  export_final_bundle:
    if: >-
      github.repository == 'ContextualWisdomLab/noema'
      && github.ref == 'refs/heads/feat/hourly-nim-opencode-development'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact trigger head without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact verified repair artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 8919044599
          run-id: 30978064579
          repository: ContextualWisdomLab/noema
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-repair

      - name: Verify, apply, and package final file contents
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id=8919044599
          source_run_id=30978064579
          artifact_name=noema-final-candidate-repair-v3-30978064579-1
          expected_artifact_digest=fe32daafed57c311516f5980cd5cc904e566e9f3b48fec2b0d698591425ef39d
          expected_patch_sha=7a1e661aeefd52b362866dd13c05cacc8d65299fff20b48ce7a954aa59160ecf

          mapfile -d '' patch_files < <(
            find "$RUNNER_TEMP/verified-repair" -type f -name repair.patch -print0
          )
          if [ "${#patch_files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one repair.patch."
            exit 1
          fi
          patch="${patch_files[0]}"
          case "$patch" in
            "$RUNNER_TEMP/verified-repair/$artifact_name/repair.patch") ;;
            *) echo "::error::repair.patch is outside the exact artifact directory."; exit 1 ;;
          esac
          if [ ! -f "$patch" ] || [ -L "$patch" ]; then
            echo "::error::repair.patch is not a regular non-symlink file."
            exit 1
          fi

          artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}")"
          jq -e \
            --argjson artifact_id "$artifact_id" \
            --arg artifact_name "$artifact_name" \
            --argjson run_id "$source_run_id" \
            '.id == $artifact_id
             and .name == $artifact_name
             and .expired == false
             and .workflow_run.id == $run_id' \
            <<<"$artifact_json" >/dev/null
          downloaded_digest="$(jq -r '.digest // empty' <<<"$artifact_json")"
          if [ "$downloaded_digest" != "sha256:$expected_artifact_digest" ]; then
            echo "::error::Artifact digest differs from verified upload evidence."
            exit 1
          fi
          printf '%s  %s\n' "$expected_patch_sha" "$patch" | sha256sum -c -

          apply_arguments=(
            --binary
            --exclude=.github/workflows/repair-final-candidate-cleanup.yml
            --exclude=.github/workflows/repair-final-candidate-cleanup-v2.yml
            --exclude=.github/workflows/repair-final-candidate-cleanup-v3.yml
          )
          git apply --check "${apply_arguments[@]}" "$patch"
          git apply --index "${apply_arguments[@]}" "$patch"
          git diff --cached --check

          grep -Fq 'read -r -a model_candidates <<<"$OPENCODE_MODEL_CANDIDATES"' \
            .github/workflows/hourly-product-development.yml
          grep -Fq 'for ((candidate_index = 0; candidate_index < candidate_count; candidate_index++)); do' \
            .github/workflows/hourly-product-development.yml
          grep -Fq 'if [ "$candidate_index" -eq $((candidate_count - 1)) ]; then' \
            .github/workflows/hourly-product-development.yml
          grep -Fq 'const interCandidateCleanupCount = Math.max(candidateCount - 1, 0);' \
            test/hourly-product-development-workflow.test.ts
          grep -Fq '3,230초' docs/operations/hourly-product-development.md

          bundle="$RUNNER_TEMP/final-candidate-repair-bundle"
          install -d -m 0700 \
            "$bundle/.github/workflows" \
            "$bundle/docs/doctoring" \
            "$bundle/docs/operations" \
            "$bundle/docs/superpowers/plans" \
            "$bundle/docs/superpowers/specs" \
            "$bundle/test"
          install -m 0600 .github/workflows/hourly-product-development.yml \
            "$bundle/.github/workflows/hourly-product-development.yml"
          install -m 0600 CHANGELOG.md "$bundle/CHANGELOG.md"
          install -m 0600 docs/doctoring/hourly-nim-opencode-development.md \
            "$bundle/docs/doctoring/hourly-nim-opencode-development.md"
          install -m 0600 docs/operations/hourly-product-development.md \
            "$bundle/docs/operations/hourly-product-development.md"
          install -m 0600 docs/superpowers/plans/2026-08-05-hourly-nim-opencode-development.md \
            "$bundle/docs/superpowers/plans/2026-08-05-hourly-nim-opencode-development.md"
          install -m 0600 docs/superpowers/specs/2026-08-05-hourly-nim-opencode-development-design.md \
            "$bundle/docs/superpowers/specs/2026-08-05-hourly-nim-opencode-development-design.md"
          install -m 0600 test/hourly-product-development-workflow.test.ts \
            "$bundle/test/hourly-product-development-workflow.test.ts"

          (
            cd "$bundle"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum \
              > BUNDLE-SHA256SUMS
          )

      - name: Upload final file bundle
        id: upload_bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-candidate-repair-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/final-candidate-repair-bundle
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
