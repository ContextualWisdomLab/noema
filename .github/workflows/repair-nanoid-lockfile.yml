name: repair-nanoid-lockfile
run-name: One-shot nanoid 3.3.18 lockfile remediation

on:
  push:
    branches:
      - fix/nanoid-cve-2026-67213-3-3-18

concurrency:
  group: repair-nanoid-lockfile
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/noema' &&
      github.ref == 'refs/heads/fix/nanoid-cve-2026-67213-3-3-18' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: checkout exact repair branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/nanoid-cve-2026-67213-3-3-18
          fetch-depth: 2
          persist-credentials: true

      - name: setup reviewed Node toolchain
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          cache: npm

      - name: verify reviewed package-manager identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"

      - name: regenerate only the vulnerable transitive lock node
        shell: bash
        run: |
          set -euo pipefail
          npm update nanoid \
            --package-lock-only \
            --ignore-scripts \
            --legacy-peer-deps=false \
            --install-links=false

      - name: prove the lockfile delta is limited to nanoid 3.3.18
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";

          const previous = JSON.parse(execFileSync("git", ["show", "HEAD^:package-lock.json"], { encoding: "utf8" }));
          const current = JSON.parse(readFileSync("package-lock.json", "utf8"));
          const packagePath = "node_modules/nanoid";
          const previousNode = previous.packages?.[packagePath];
          const currentNode = current.packages?.[packagePath];

          if (previousNode?.version !== "3.3.17") {
            throw new Error(`unexpected predecessor nanoid version: ${previousNode?.version ?? "missing"}`);
          }
          if (currentNode?.version !== "3.3.18") {
            throw new Error(`nanoid was not remediated to 3.3.18: ${currentNode?.version ?? "missing"}`);
          }
          if (currentNode.resolved !== "https://registry.npmjs.org/nanoid/-/nanoid-3.3.18.tgz") {
            throw new Error("nanoid resolved URL is not the registry-authenticated 3.3.18 artifact");
          }
          if (typeof currentNode.integrity !== "string" || !currentNode.integrity.startsWith("sha512-")) {
            throw new Error("nanoid 3.3.18 is missing registry integrity metadata");
          }

          const normalize = (lock) => {
            const clone = structuredClone(lock);
            const node = clone.packages?.[packagePath];
            if (!node) throw new Error("nanoid lock node is missing");
            delete node.version;
            delete node.resolved;
            delete node.integrity;
            return clone;
          };

          if (JSON.stringify(normalize(previous)) !== JSON.stringify(normalize(current))) {
            throw new Error("npm changed package metadata outside the reviewed nanoid identity fields");
          }
          NODE

      - name: correct the security changelog and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const path = "CHANGELOG.md";
          const original = readFileSync(path, "utf8");
          let updated = original.replace(
            "transitive `nanoid` lockfile resolution을 `3.3.16`에서 `3.3.17`로 최소 갱신",
            "transitive `nanoid` lockfile resolution을 `3.3.17`에서 `3.3.18`로 최소 갱신",
          );
          updated = updated.replace(
            "#76의 `nanoid@3.3.17` 보안 수정",
            "선행 `nanoid@3.3.18` 보안 수정",
          );
          if (updated === original) {
            throw new Error("expected nanoid changelog statements were not found");
          }
          if (updated.includes("#76의 `nanoid@3.3.17` 보안 수정")) {
            throw new Error("stale nanoid 3.3.17 remediation statement remains");
          }
          writeFileSync(path, updated, "utf8");
          NODE
          rm -- .github/workflows/repair-nanoid-lockfile.yml

      - name: verify frozen install and full release contract
        shell: bash
        run: |
          set -euo pipefail
          npm ci --legacy-peer-deps=false --install-links=false
          npm run release:verify

      - name: commit the verified minimal GREEN
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json
          mapfile -t changed_paths < <(git status --porcelain=v1 | sed -E 's/^.. //')
          printf '%s\n' "${changed_paths[@]}" | sort >"$RUNNER_TEMP/changed-paths.txt"
          printf '%s\n' \
            .github/workflows/repair-nanoid-lockfile.yml \
            CHANGELOG.md \
            package-lock.json | sort >"$RUNNER_TEMP/expected-paths.txt"
          diff -u "$RUNNER_TEMP/expected-paths.txt" "$RUNNER_TEMP/changed-paths.txt"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json CHANGELOG.md .github/workflows/repair-nanoid-lockfile.yml
          git commit -m "fix(deps): remediate nanoid 3.3.18"
          git push origin "HEAD:${GITHUB_REF_NAME}"
