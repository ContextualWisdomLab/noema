name: Repair PR 65 validation contracts

on:
  push:
    branches:
      - feat/quarantined-patch-validation
    paths:
      - reviewer/repair_pr65_validation_contracts.py
      - .github/workflows/repair-pr65-validation-contracts.yml

permissions:
  contents: read

concurrency:
  group: repair-pr65-validation-contracts
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/noema' &&
      github.actor == 'seonghobae' &&
      github.ref == 'refs/heads/feat/quarantined-patch-validation'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: reviewer
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install exact locked reviewer dependencies
        run: pip install --require-hashes --no-deps -r requirements-ci-hashes.txt

      - name: Compile and apply exact repair
        run: |
          python -m py_compile repair_pr65_validation_contracts.py
          python repair_pr65_validation_contracts.py
          git diff --check

      - name: Verify full reviewer contract
        run: |
          python -m pytest
          python -m interrogate -c pyproject.toml noema_reviewer
          python -m compileall -q noema_reviewer tests
          test ! -e repair_pr65_validation_contracts.py
          test ! -e ../.github/workflows/repair-pr65-validation-contracts.yml
          git diff --check

      - name: Publish verified production repair
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          SOURCE_BRANCH: feat/quarantined-patch-validation
          GH_TOKEN: ${{ github.token }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(sandbox): enforce exact patch and source contracts'
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease="refs/heads/${SOURCE_BRANCH}:${EXPECTED_HEAD}" \
            "$remote_url" "HEAD:refs/heads/${SOURCE_BRANCH}"
