name: One-shot PR 65 exact-commit source snapshot repair

on:
  push:
    branches: [feat/quarantined-patch-validation]
    paths:
      - .github/workflows/repair-pr65-source-snapshot-v2.yml

permissions:
  contents: read

concurrency:
  group: repair-pr65-source-snapshot-v2
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/noema' &&
      github.actor == 'seonghobae' &&
      github.ref == 'refs/heads/feat/quarantined-patch-validation'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install exact locked reviewer dependencies
        working-directory: reviewer
        run: pip install --require-hashes --no-deps -r requirements-ci-hashes.txt

      - name: Prove current source-integrity regression is red
        working-directory: reviewer
        shell: bash --noprofile --norc {0}
        run: |
          set +e
          python -m pytest -q \
            tests/test_patch_validation_source_integrity.py::test_runner_mounts_committed_snapshot_after_post_preflight_mutation
          status=$?
          set -e
          test "$status" -ne 0

      - name: Apply exact-commit source snapshot implementation and tests
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              source = target.read_text(encoding='utf-8')
              old_text = dedent(old)
              new_text = dedent(new)
              if source.count(old_text) != 1:
                  raise SystemExit(
                      f'{path}: expected exactly one replacement, found {source.count(old_text)}'
                  )
              target.write_text(source.replace(old_text, new_text, 1), encoding='utf-8')

          source_path = 'reviewer/noema_reviewer/patch_validation.py'
          replace_once(
              source_path,
              'import subprocess\nimport tempfile\nimport uuid\n',
              'import subprocess\nimport tarfile\nimport tempfile\nimport uuid\n',
          )
          replace_once(
              source_path,
              '''
              def _create_git_metadata_mask(
                  staging_root: Path,
                  metadata_kind: GitMetadataKind | None,
              ) -> Path | None:
              ''',
              '''
              def _materialize_committed_source(
                  source: Path,
                  head_sha: str,
                  staging_root: Path,
                  metadata_kind: GitMetadataKind,
              ) -> Path:
                  """Materialize one private exact-commit snapshot without Git credentials."""

                  archive_path = staging_root / "source.tar"
                  snapshot = staging_root / "source"
                  snapshot.mkdir(mode=0o700)
                  completed = subprocess.run(
                      [
                          TRUSTED_GIT_EXECUTABLE,
                          "-c",
                          "core.hooksPath=/dev/null",
                          "-c",
                          "core.fsmonitor=false",
                          "-C",
                          str(source),
                          "archive",
                          "--format=tar",
                          f"--output={archive_path}",
                          head_sha,
                      ],
                      text=True,
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                      check=False,
                      shell=False,
                      timeout=30,
                      env={
                          "PATH": str(Path(TRUSTED_GIT_EXECUTABLE).parent),
                          "GIT_CONFIG_NOSYSTEM": "1",
                          "GIT_CONFIG_GLOBAL": os.devnull,
                          "GIT_OPTIONAL_LOCKS": "0",
                      },
                  )
                  if completed.returncode != 0:
                      raise RuntimeError("source commit snapshot could not be materialized")
                  try:
                      with tarfile.open(archive_path, mode="r:*") as archive:
                          archive.extractall(snapshot, filter="data")
                  except (OSError, tarfile.TarError) as exc:
                      raise RuntimeError(
                          "source commit snapshot could not be materialized safely"
                      ) from exc
                  finally:
                      archive_path.unlink(missing_ok=True)

                  metadata_placeholder = snapshot / ".git"
                  if metadata_kind == "directory":
                      metadata_placeholder.mkdir(mode=0o700)
                  else:
                      metadata_placeholder.touch(mode=0o400)
                  return _validated_docker_mount_path(snapshot, "source snapshot")


              def _create_git_metadata_mask(
                  staging_root: Path,
                  metadata_kind: GitMetadataKind | None,
              ) -> Path | None:
              ''',
          )
          replace_once(
              source_path,
              '''
                      staging_root = _validated_docker_mount_path(Path(staging), "staging root")
                      staged_patch = _write_private_patch_copy(staging_root, patch_bytes)
                      git_metadata_mask = _create_git_metadata_mask(staging_root, metadata_kind)
              ''',
              '''
                      staging_root = _validated_docker_mount_path(Path(staging), "staging root")
                      source_mount = source
                      if metadata_kind is not None:
                          source_mount = _materialize_committed_source(
                              source,
                              request.head_sha,
                              staging_root,
                              metadata_kind,
                          )
                      staged_patch = _write_private_patch_copy(staging_root, patch_bytes)
                      git_metadata_mask = _create_git_metadata_mask(staging_root, metadata_kind)
              ''',
          )
          replace_once(
              source_path,
              'f"--mount=type=bind,src={source},dst=/input,readonly",\n',
              'f"--mount=type=bind,src={source_mount},dst=/input,readonly",\n',
          )

          test_path = Path('reviewer/tests/test_patch_validation_source_integrity.py')
          test_source = test_path.read_text(encoding='utf-8')
          addition = dedent(
              '''

              def test_snapshot_materialization_rejects_git_archive_failure(
                  tmp_path: Path,
                  monkeypatch: pytest.MonkeyPatch,
              ) -> None:
                  """A failed exact-commit archive cannot fall back to the mutable worktree."""

                  monkeypatch.setattr(
                      patch_validation.subprocess,
                      "run",
                      lambda *_args, **_kwargs: SimpleNamespace(returncode=1),
                  )
                  staging = tmp_path / "staging"
                  staging.mkdir()

                  with pytest.raises(RuntimeError, match="snapshot could not be materialized"):
                      patch_validation._materialize_committed_source(
                          tmp_path,
                          "2" * 40,
                          staging,
                          "directory",
                      )


              def test_snapshot_materialization_rejects_invalid_archive(
                  tmp_path: Path,
                  monkeypatch: pytest.MonkeyPatch,
              ) -> None:
                  """Malformed archive bytes fail closed and the transient archive is removed."""

                  def corrupt_archive(command, **_kwargs):
                      output = next(
                          argument.removeprefix("--output=")
                          for argument in command
                          if argument.startswith("--output=")
                      )
                      Path(output).write_bytes(b"not a tar archive")
                      return SimpleNamespace(returncode=0)

                  monkeypatch.setattr(patch_validation.subprocess, "run", corrupt_archive)
                  staging = tmp_path / "staging"
                  staging.mkdir()

                  with pytest.raises(RuntimeError, match="materialized safely"):
                      patch_validation._materialize_committed_source(
                          tmp_path,
                          "2" * 40,
                          staging,
                          "file",
                      )
                  assert not (staging / "source.tar").exists()
              '''
          )
          if 'test_snapshot_materialization_rejects_git_archive_failure' not in test_source:
              test_path.write_text(test_source + addition, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          changelog_text = changelog.read_text(encoding='utf-8')
          marker = '### Fixed\n\n'
          note = (
              '- Mount an exact committed source snapshot in quarantined patch validation so '
              'a post-preflight worktree mutation cannot alter untrusted validator input.\n'
          )
          if note not in changelog_text:
              changelog_text = changelog_text.replace(marker, marker + note, 1)
              changelog.write_text(changelog_text, encoding='utf-8')

          doctoring = Path('docs/doctoring/quarantined-patch-validation.md')
          doctoring_text = doctoring.read_text(encoding='utf-8')
          paragraph = (
              '\nThe runner now materializes the requested Git commit through a bounded, '
              'configuration-isolated `git archive` operation and Python safe-data extraction. '
              'The container mounts that private snapshot rather than the caller worktree, while '
              'an empty nested `.git` mount preserves the credential-isolation contract. This '
              'closes the interval between a clean-worktree preflight and Docker startup without '
              'granting the validator access to repository control metadata.\n'
          )
          if paragraph.strip() not in doctoring_text:
              doctoring.write_text(doctoring_text + paragraph, encoding='utf-8')
          PY
          git diff --check

      - name: Verify full reviewer quality contract
        working-directory: reviewer
        run: |
          python -m pytest
          python -m interrogate -c pyproject.toml noema_reviewer
          python -m compileall -q noema_reviewer tests

      - name: Publish verified repair and remove temporary workflow
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          BRANCH_NAME: feat/quarantined-patch-validation
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rm -f .github/workflows/repair-pr65-source-snapshot-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No repair generated' >&2; exit 1; }
          git commit -m 'fix(sandbox): mount exact committed source snapshot'
          git push \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${BRANCH_NAME}"
