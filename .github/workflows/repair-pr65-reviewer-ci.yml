name: Repair PR 65 reviewer CI

on:
  push:
    branches:
      - feat/quarantined-patch-validation
    paths:
      - .github/workflows/repair-pr65-reviewer-ci.yml

permissions:
  contents: write

concurrency:
  group: repair-pr65-reviewer-ci
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/noema' &&
      github.ref == 'refs/heads/feat/quarantined-patch-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact repair trigger
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify immutable repair parent
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD^)" = "76c059ebb8515b2c90cc2d4a4f8f40890753599e"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install reviewer dependencies
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: pip install --require-hashes --no-deps -r reviewer/requirements-ci-hashes.txt

      - name: Add bounded artifact and secondary-header regressions first
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("reviewer/tests/test_patch_validation_hardening.py")
          text = path.read_text(encoding="utf-8")
          addition = r'''

          @pytest.mark.parametrize(
              "patch_bytes",
              (
                  (
                      b'diff --git "a/src/file name.ts" "b/src/file name.ts"\n'
                      b'similarity index 100%\n'
                      b'rename from "src/file name.ts"\n'
                      b'rename to "src/file renamed.ts"\n'
                  ),
                  (
                      b"diff --git a/src/x b/src/x\n"
                      b"--- /dev/null\n"
                      b"+++ b/src/x\n"
                  ),
              ),
          )
          def test_patch_inspector_accepts_safe_secondary_header_forms(
              patch_bytes: bytes,
          ) -> None:
              """Quoted metadata and /dev/null headers retain safe path semantics."""
              assert inspect_patch_bytes(patch_bytes)


          @pytest.mark.parametrize(
              "patch_bytes",
              (
                  b"diff --git a/src/x b/src/x\nrename from src\\evil\n",
                  b'diff --git a/src/x b/src/x\nrename from "src/x\n',
                  b'diff --git a/src/x b/src/x\nrename from "src/x" extra\n',
                  b'diff --git a/src/x b/src/x\nrename from src/"x\n',
              ),
          )
          def test_patch_inspector_rejects_malformed_secondary_header_forms(
              patch_bytes: bytes,
          ) -> None:
              """Secondary metadata cannot consume escapes or ambiguous quoting."""
              with pytest.raises(ValueError):
                  inspect_patch_bytes(patch_bytes)


          def test_runner_rejects_oversized_result_artifact(
              tmp_path: Path,
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              """A successful container cannot publish an unbounded JSON artifact."""
              repository, head = _git_repository(tmp_path)
              patch_bytes = _patch()
              patch_path = tmp_path / "proposal.patch"
              patch_path.write_bytes(patch_bytes)
              request = _request(patch_bytes, head)
              monkeypatch.setenv("NOEMA_PATCH_SANDBOX_IMAGE", TEST_IMAGE)

              def fake_run(command, **_kwargs):
                  output_directory = _mount_source(list(command), "/output")
                  (output_directory / "result.json").write_bytes(
                      b"x" * (patch_validation.MAX_RESULT_FILE_BYTES + 1)
                  )
                  return SimpleNamespace(returncode=0)

              with pytest.raises(RuntimeError, match="result artifact exceeds"):
                  DockerPatchValidationRunner(command_runner=fake_run).validate(
                      request=request,
                      source_root=repository,
                      patch_path=patch_path,
                  )


          def test_runner_reports_unverifiable_git_metadata_before_docker(
              tmp_path: Path,
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              """Malformed Git metadata cannot bypass the exact-source preflight."""
              source = tmp_path / "source"
              source.mkdir()
              (source / ".git").mkdir()
              patch_bytes = _patch()
              patch_path = tmp_path / "proposal.patch"
              patch_path.write_bytes(patch_bytes)
              monkeypatch.setenv("NOEMA_PATCH_SANDBOX_IMAGE", TEST_IMAGE)

              def should_not_run(_args, **_kwargs):
                  raise AssertionError("Docker must not start")

              with pytest.raises(RuntimeError, match="source HEAD could not be verified"):
                  DockerPatchValidationRunner(command_runner=should_not_run).validate(
                      request=_request(patch_bytes, "2" * 40),
                      source_root=source,
                      patch_path=patch_path,
                  )
          '''
          if "test_runner_rejects_oversized_result_artifact" in text:
              raise SystemExit("review regressions already present")
          path.write_text(text + addition, encoding="utf-8")
          PY

      - name: Verify the hardened contracts are red
        shell: bash --noprofile --norc {0}
        run: |
          set +e
          cd reviewer
          python -m pytest -q \
            tests/test_patch_validation_hardening.py::test_result_requires_consistent_status_and_bounded_reason_codes \
            tests/test_patch_validation_hardening.py::test_runner_rejects_source_revision_mismatch_before_docker \
            tests/test_patch_validation_hardening.py::test_runner_mounts_private_patch_copy_and_bounded_result_file \
            tests/test_patch_validation_hardening.py::test_runner_rejects_oversized_result_artifact \
            >"${RUNNER_TEMP}/pr65-red.txt" 2>&1
          status=$?
          set -e
          cat "${RUNNER_TEMP}/pr65-red.txt"
          test "$status" -ne 0

      - name: Apply minimal exact-source and bounded-result implementation
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("reviewer/noema_reviewer/patch_validation.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "import subprocess\nimport uuid\n",
              "import subprocess\nimport tempfile\nimport uuid\n",
              1,
          )
          text = text.replace(
              "from pydantic import BaseModel, ConfigDict, Field, ValidationError\n",
              "from pydantic import BaseModel, ConfigDict, Field, ValidationError, model_validator\n",
              1,
          )
          text = text.replace(
              "MAX_RESULT_EXCERPT_CHARS = 4000\n",
              "MAX_RESULT_EXCERPT_CHARS = 4000\nMAX_RESULT_FILE_BYTES = 64 * 1024\n",
              1,
          )
          anchor = "    reason_codes: list[ReasonCode] = Field(default_factory=list, max_length=20)\n"
          validator = anchor + '''

              @model_validator(mode="after")
              def validate_status_exit_code(self) -> "PatchValidationResult":
                  """Require passed results to be exactly the zero-exit outcomes."""
                  if (self.status is PatchValidationStatus.PASSED) != (self.exit_code == 0):
                      raise ValueError("patch validation status and exit code are inconsistent")
                  return self
          '''
          if text.count(anchor) != 1:
              raise SystemExit("result model anchor mismatch")
          text = text.replace(anchor, validator, 1)

          method_start = text.index("    def validate(\n")
          replacement = r'''    def validate(
                  self,
                  *,
                  request: PatchValidationRequest,
                  source_root: str | Path,
                  patch_path: str | Path,
              ) -> PatchValidationResult:
                  """Validate one patch and return exact-request-bound structured evidence."""
                  source = _validated_directory(source_root, "source root")
                  resolved_patch, patch_bytes = _read_regular_patch(
                      patch_path,
                      file_system=self._file_system,
                  )
                  _validated_docker_mount_path(resolved_patch, "patch file")
                  inspect_patch_bytes(patch_bytes)
                  observed_digest = hashlib.sha256(patch_bytes).hexdigest()
                  if observed_digest != request.patch_sha256:
                      raise RuntimeError(
                          "patch file digest does not match the validation request"
                      )

                  source_has_git_metadata = (source / ".git").exists()
                  if source_has_git_metadata:
                      git_environment = {
                          "PATH": os.environ.get("PATH", os.defpath),
                          "GIT_CONFIG_NOSYSTEM": "1",
                          "GIT_CONFIG_GLOBAL": os.devnull,
                      }
                      try:
                          source_head = subprocess.run(
                              ["git", "-C", str(source), "rev-parse", "--verify", "HEAD^{commit}"],
                              text=True,
                              stdout=subprocess.PIPE,
                              stderr=subprocess.PIPE,
                              check=True,
                              shell=False,
                              timeout=30,
                              env=git_environment,
                          ).stdout.strip()
                      except (OSError, subprocess.CalledProcessError, subprocess.TimeoutExpired) as exc:
                          raise RuntimeError("source HEAD could not be verified") from exc
                      if source_head != request.head_sha:
                          raise RuntimeError("source HEAD does not match the validation request")

                  image = _verified_image_reference()
                  container_name = self._name_factory()
                  uid = os.getuid()
                  gid = os.getgid()
                  child_environment = {"PATH": os.environ.get("PATH", os.defpath)}

                  with tempfile.TemporaryDirectory(prefix="noema-patch-validation-") as temporary:
                      temporary_root = Path(temporary)
                      staged_patch = resolved_patch
                      if source_has_git_metadata:
                          staged_patch = temporary_root / "input.patch"
                          staged_patch.write_bytes(patch_bytes)
                          staged_patch.chmod(0o400)
                      output_directory = temporary_root / "output"
                      output_directory.mkdir(mode=0o700)
                      result_path = output_directory / "result.json"
                      command = [
                          "docker",
                          "run",
                          "--rm",
                          f"--name={container_name}",
                          "--pull=never",
                          "--network=none",
                          "--read-only",
                          "--cap-drop=ALL",
                          "--security-opt=no-new-privileges=true",
                          "--security-opt=seccomp=builtin",
                          "--pids-limit=256",
                          "--memory=2g",
                          "--memory-swap=2g",
                          "--cpus=2",
                          "--ipc=none",
                          "--ulimit=nofile=1024:1024",
                          "--ulimit=nproc=256:256",
                          "--ulimit=core=0:0",
                          f"--user={uid}:{gid}",
                          (
                              "--tmpfs=/workspace:"
                              f"rw,nosuid,nodev,size=1073741824,mode=0700,uid={uid},gid={gid}"
                          ),
                          "--tmpfs=/tmp:rw,noexec,nosuid,nodev,size=67108864,mode=1777",
                          f"--mount=type=bind,src={source},dst=/input,readonly",
                          (
                              "--mount=type=bind,"
                              f"src={staged_patch},dst=/patch/input.patch,readonly"
                          ),
                          f"--mount=type=bind,src={output_directory},dst=/output",
                          "--workdir=/workspace",
                          "--env=HOME=/workspace/home",
                          "--env=XDG_CACHE_HOME=/workspace/cache",
                          f"--env=NOEMA_REPOSITORY={request.repository_full_name}",
                          f"--env=NOEMA_BASE_SHA={request.base_sha}",
                          f"--env=NOEMA_HEAD_SHA={request.head_sha}",
                          f"--env=NOEMA_PATCH_SHA256={request.patch_sha256}",
                          f"--env=NOEMA_PATCH_PROFILE={request.profile.value}",
                          "--entrypoint=/opt/noema/bin/validate-patch",
                          image,
                      ]
                      try:
                          completed = self._command_runner(
                              command,
                              text=True,
                              stdout=subprocess.DEVNULL,
                              stderr=subprocess.DEVNULL,
                              check=False,
                              shell=False,
                              timeout=PATCH_SANDBOX_WALL_TIMEOUT_SECONDS,
                              env=child_environment,
                          )
                      except subprocess.TimeoutExpired as exc:
                          self._cleanup_runner(
                              ["docker", "rm", "-f", container_name],
                              text=True,
                              stdout=subprocess.DEVNULL,
                              stderr=subprocess.DEVNULL,
                              check=False,
                              shell=False,
                              timeout=30,
                              env=child_environment,
                          )
                          raise RuntimeError(
                              "patch validation sandbox timed out after "
                              f"{PATCH_SANDBOX_WALL_TIMEOUT_SECONDS} seconds"
                          ) from exc
                      except OSError as exc:
                          raise RuntimeError(
                              f"patch validation sandbox could not start Docker: {exc}"
                          ) from exc

                      if completed.returncode != 0:
                          detail = _bounded_detail(
                              str(getattr(completed, "stderr", "") or getattr(completed, "stdout", ""))
                          )
                          raise RuntimeError(
                              f"patch validation sandbox exited {completed.returncode}: {detail}"
                          )

                      try:
                          if result_path.exists():
                              if result_path.stat().st_size > MAX_RESULT_FILE_BYTES:
                                  raise RuntimeError(
                                      f"patch validation result artifact exceeds {MAX_RESULT_FILE_BYTES} bytes"
                                  )
                              result_payload = result_path.read_text(encoding="utf-8")
                          else:
                              result_payload = str(getattr(completed, "stdout", "") or "")
                          result = PatchValidationResult.model_validate_json(result_payload)
                      except RuntimeError:
                          raise
                      except (OSError, ValidationError, ValueError) as exc:
                          raise RuntimeError(
                              "patch validation sandbox returned invalid structured evidence"
                          ) from exc
                      if not _result_matches_request(result, request):
                          raise RuntimeError(
                              "patch validation sandbox result does not match the request"
                          )
                      return result
          '''
          path.write_text(text[:method_start] + replacement, encoding="utf-8")
          PY

      - name: Verify full reviewer quality gates
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          cd reviewer
          python -m pytest
          python -m interrogate --fail-under 100 noema_reviewer
          python -m compileall -q noema_reviewer tests
          cd ..
          git diff --check

      - name: Publish verified repair and remove temporary workflow
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          rm -f .github/workflows/repair-pr65-reviewer-ci.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(sandbox): bind exact source and result artifact"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:refs/heads/feat/quarantined-patch-validation"
