name: One-shot Noema mode metadata repair

on:
  push:
    branches:
      - feat/quarantined-patch-validation
    paths:
      - .github/workflows/one-shot-noema-mode-metadata-repair.yml

permissions:
  contents: read

concurrency:
  group: one-shot-noema-mode-metadata-repair
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/noema' &&
      github.actor == 'seonghobae' &&
      github.ref == 'refs/heads/feat/quarantined-patch-validation'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact trigger without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Apply the minimal strict mode-metadata fix
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("reviewer/noema_reviewer/patch_validation.py")
          source = path.read_text(encoding="utf-8")

          old_pattern = '''PATCH_MODE_PATTERN = re.compile(
              r"^(?:old mode|new mode|new file mode|deleted file mode) (120000|160000)$",
              re.MULTILINE,
          )
          INDEX_MODE_PATTERN = re.compile(
          '''
          new_pattern = '''PATCH_MODE_PATTERN = re.compile(
              r"^(?:old mode|new mode|new file mode|deleted file mode) (120000|160000)$",
              re.MULTILINE,
          )
          FILE_MODE_METADATA_PATTERN = re.compile(
              r"^(?:old mode|new mode|new file mode|deleted file mode) ([0-9]{6})$"
          )
          INDEX_MODE_PATTERN = re.compile(
          '''

          old_branch = '''        if line.startswith(("old mode ", "new mode ", "new file mode ", "deleted file mode ")):
                      if current_source_path is None or current_diff_has_hunk:
                          raise ValueError("patch contains misplaced mode metadata")
                      if not line.endswith((" 100644", " 100755")):
                          raise ValueError("patch contains an unsupported file mode")
                      continue
          '''
          new_branch = '''        if line.startswith(("old mode ", "new mode ", "new file mode ", "deleted file mode ")):
                      if current_source_path is None or current_diff_has_hunk:
                          raise ValueError("patch contains misplaced mode metadata")
                      match = FILE_MODE_METADATA_PATTERN.fullmatch(line)
                      if match is None:
                          raise ValueError("patch contains malformed mode metadata")
                      mode = match.group(1)
                      if mode in {"120000", "160000"}:
                          raise ValueError("patch contains a symlink or gitlink mode")
                      if mode not in {"100644", "100755"}:
                          raise ValueError("patch contains an unsupported file mode")
                      continue
          '''

          if source.count(old_pattern) != 1:
              raise SystemExit("mode pattern anchor is not unique")
          if source.count(old_branch) != 1:
              raise SystemExit("mode branch anchor is not unique")
          source = source.replace(old_pattern, new_pattern, 1)
          source = source.replace(old_branch, new_branch, 1)
          path.write_text(source, encoding="utf-8")
          PY
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install hash-pinned reviewer dependencies
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes --no-deps
          -r reviewer/requirements-ci-hashes.txt

      - name: Verify full reviewer suite, coverage, docstrings, and compilation
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          cd reviewer
          python -m pytest
          python -m interrogate --fail-under 100 noema_reviewer
          python -m compileall -q noema_reviewer tests
          cd ..
          git diff --check

      - name: Publish only the verified production fix
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          SOURCE_BRANCH: feat/quarantined-patch-validation
          PUSH_TOKEN: ${{ github.token }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote_head="$(git ls-remote origin "refs/heads/${SOURCE_BRANCH}" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviewer/noema_reviewer/patch_validation.py
          git diff --cached --check
          git diff --cached --quiet && { echo 'No production fix generated.' >&2; exit 1; }
          git commit -m "fix(sandbox): reject malformed file-mode metadata"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push --force-with-lease="refs/heads/${SOURCE_BRANCH}:${EXPECTED_HEAD}" \
            origin "HEAD:refs/heads/${SOURCE_BRANCH}"
