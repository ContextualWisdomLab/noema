name: central-review
run-name: >-
  Noema central review ${{ github.event.client_payload.target_repository }}#${{
  github.event.client_payload.pr_number }}@${{ github.event.client_payload.pr_head_sha }}

on:
  # repository_dispatch is evaluated only from the default branch. Keeping the
  # privileged entrypoint here prevents a caller from selecting branch workflow
  # code before the Noema App key and model credentials are bound.
  repository_dispatch:
    types: [noema-review]

concurrency:
  group: >-
    noema-central-review-${{ github.event.client_payload.target_repository }}-${{
    github.event.client_payload.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  collect_evidence:
    name: noema-evidence-collection
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      repository_name: ${{ steps.target.outputs.repository_name }}
      head_sha: ${{ steps.target.outputs.head_sha }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TARGET_REPOSITORY: ${{ github.event.client_payload.target_repository || '' }}
      PR_NUMBER: ${{ github.event.client_payload.pr_number || '' }}
      EXPECTED_HEAD_SHA: ${{ github.event.client_payload.pr_head_sha || '' }}
      NOEMA_CODEGRAPH_SANDBOX_SOURCE_IMAGE: gcr.io/distroless/nodejs24-debian13:nonroot
    steps:
      - name: Validate target repository identifier
        id: target
        run: |
          set -euo pipefail
          if ! [[ "$TARGET_REPOSITORY" =~ ^ContextualWisdomLab/[A-Za-z0-9_.-]+$ ]] ||
            ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] ||
            ! [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Noema dispatch requires a ContextualWisdomLab repository, positive PR number, and full expected head SHA."
            exit 1
          fi
          repository_name="${TARGET_REPOSITORY#*/}"
          printf 'repository_name=%s\nhead_sha=%s\n' "$repository_name" "$EXPECTED_HEAD_SHA" >>"$GITHUB_OUTPUT"

      - name: Mint read-only repository-scoped Noema App token
        id: noema_read_app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.NOEMA_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.NOEMA_GITHUB_APP_PRIVATE_KEY }}
          owner: ContextualWisdomLab
          repositories: ${{ steps.target.outputs.repository_name }}
          permission-actions: read
          permission-checks: read
          permission-contents: read
          permission-metadata: read
          permission-pull-requests: read
          permission-security-events: read
          permission-statuses: read
          permission-vulnerability-alerts: read

      - name: Bind dispatch to live organization PR head
        env:
          GH_TOKEN: ${{ steps.noema_read_app.outputs.token }}
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}")"
          state="$(jq -r '.state // empty' <<<"$pr_json")"
          live_head="$(jq -r '.head.sha // empty' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name // empty' <<<"$pr_json")"
          base_repo="$(jq -r '.base.repo.full_name // empty' <<<"$pr_json")"
          if [ "$state" != "open" ] ||
            [ "$live_head" != "$EXPECTED_HEAD_SHA" ] ||
            [ "$head_repo" != "$TARGET_REPOSITORY" ] ||
            [ "$base_repo" != "$TARGET_REPOSITORY" ]; then
            printf '::error::Noema dispatch metadata is stale or untrusted: state=%s expected_head=%s live_head=%s head_repo=%s base_repo=%s.\n' \
              "${state:-missing}" "$EXPECTED_HEAD_SHA" "${live_head:-missing}" \
              "${head_repo:-missing}" "$base_repo"
            exit 1
          fi
          printf 'Bound Noema evidence collection to %s#%s current head %s.\n' \
            "$TARGET_REPOSITORY" "$PR_NUMBER" "$live_head"

      - name: Checkout trusted Noema reviewer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Checkout exact target head without executing target code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ steps.target.outputs.head_sha }}
          token: ${{ steps.noema_read_app.outputs.token }}
          path: target-source
          persist-credentials: false
          fetch-depth: 1

      - name: Reject untrusted target symlinks
        run: |
          set -euo pipefail
          symlink="$(find target-source -type l -print -quit)"
          if [ -n "$symlink" ]; then
            printf '::error::Noema refuses target symlinks before CodeGraph indexing: %s\n' "$symlink"
            exit 1
          fi
          echo "Target source contains no symlinks."

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install hash-pinned reviewer dependencies
        run: pip install --require-hashes --no-deps -r reviewer/requirements-ci-hashes.txt

      - name: Install and harden lock-pinned CodeGraph
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: |
          set -euo pipefail
          npm ci --prefix .github/codegraph --ignore-scripts --omit=dev --no-audit --no-fund
          npm audit --prefix .github/codegraph --package-lock-only --omit=dev --audit-level=moderate
          trusted_root="$GITHUB_WORKSPACE/.github/codegraph"
          patched_picomatch="$trusted_root/node_modules/picomatch"
          if [ "$(jq -r '.version' "$patched_picomatch/package.json")" != "4.0.4" ]; then
            echo "::error::Noema CodeGraph requires lock-pinned picomatch 4.0.4."
            exit 1
          fi
          hardened=0
          while IFS= read -r platform; do
            [ -n "$platform" ] || continue
            bundled="$platform/lib/node_modules/picomatch"
            bundled_lock="$platform/lib/node_modules/.package-lock.json"
            [ -d "$bundled" ] || continue
            case "$(realpath "$bundled")" in
              "$trusted_root"/node_modules/@colbymchenry/codegraph-*/lib/node_modules/picomatch) ;;
              *) echo "::error::Refusing to harden CodeGraph outside the trusted package root."; exit 1 ;;
            esac
            test -f "$bundled_lock"
            rm -rf "$bundled"
            mkdir -p "$bundled"
            cp -R "$patched_picomatch"/. "$bundled"/
            patched_lock="$(mktemp)"
            jq --slurpfile trusted "$trusted_root/package-lock.json" \
              '.packages["node_modules/picomatch"] = $trusted[0].packages["node_modules/picomatch"]' \
              "$bundled_lock" >"$patched_lock"
            mv "$patched_lock" "$bundled_lock"
            test "$(jq -r '.version' "$bundled/package.json")" = "4.0.4"
            test "$(jq -r '.packages["node_modules/picomatch"].version' "$bundled_lock")" = "4.0.4"
            hardened=$((hardened + 1))
          done < <(
            find "$trusted_root/node_modules/@colbymchenry" \
              -mindepth 1 -maxdepth 1 -type d -name 'codegraph-*' -print
          )
          if [ "$hardened" -lt 1 ]; then
            echo "::error::No CodeGraph platform bundle was available to harden."
            exit 1
          fi
          codegraph_shim="$trusted_root/node_modules/@colbymchenry/codegraph/npm-shim.js"
          test -f "$codegraph_shim"
          printf 'Using lock-pinned CodeGraph package %s.\n' \
            "$(jq -r '.version' "$trusted_root/node_modules/@colbymchenry/codegraph/package.json")"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.73.0
          cache: true

      - name: Resolve, authenticate, and scan CodeGraph sandbox image
        run: |
          set -euo pipefail
          docker pull "$NOEMA_CODEGRAPH_SANDBOX_SOURCE_IMAGE"
          resolved="$(docker image inspect "$NOEMA_CODEGRAPH_SANDBOX_SOURCE_IMAGE" --format '{{index .RepoDigests 0}}')"
          case "$resolved" in
            gcr.io/distroless/nodejs24-debian13@sha256:????????????????????????????????????????????????????????????????) ;;
            *) printf '::error::Unexpected CodeGraph sandbox image identity: %s\n' "${resolved:-missing}"; exit 1 ;;
          esac
          cosign verify "$resolved" \
            --certificate-oidc-issuer=https://accounts.google.com \
            --certificate-identity=keyless@distroless.iam.gserviceaccount.com >/dev/null
          trivy image \
            --exit-code 1 \
            --ignore-unfixed \
            --severity MEDIUM,HIGH,CRITICAL \
            --scanners vuln \
            --no-progress \
            "$resolved"
          printf 'NOEMA_CODEGRAPH_SANDBOX_IMAGE=%s\n' "$resolved" >>"$GITHUB_ENV"
          printf 'Verified and scanned CodeGraph sandbox image %s.\n' "$resolved"

      - name: Wait for review-independent current-head checks
        env:
          GH_TOKEN: ${{ steps.noema_read_app.outputs.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            live="$(gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}" --jq '[.state, .head.sha] | join(" ")')"
            if [ "$live" != "open $EXPECTED_HEAD_SHA" ]; then
              printf '::error::Noema stopped before evidence collection because the PR head changed: expected open %s, observed %s.\n' \
                "$EXPECTED_HEAD_SHA" "$live"
              exit 1
            fi
            # These exact checks consume review evidence themselves. Waiting on
            # either one here creates a cycle: Noema waits for the governance
            # check while the governance check waits for Noema/OpenCode.
            pending="$(gh api --paginate --slurp \
              "repos/${TARGET_REPOSITORY}/commits/${EXPECTED_HEAD_SHA}/check-runs?per_page=100" \
              --jq '[.[].check_runs[] | select((.name != "opencode-review" and .name != "metadata-only gate evaluation") and .status != "completed") | .name] | unique | join(", ")')"
            if [ -z "$pending" ]; then
              echo "All review-independent current-head checks are complete."
              exit 0
            fi
            printf 'Noema current-head check wait %s/90: %s\n' "$attempt" "$pending"
            sleep 60
          done
          echo "::error::Noema waited 90 minutes but review-independent current-head checks are still incomplete."
          exit 1

      - name: Collect bounded current-head review manifest
        env:
          GH_TOKEN: ${{ steps.noema_read_app.outputs.token }}
          PYTHONPATH: ${{ github.workspace }}/reviewer
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          from noema_reviewer.github_io import fetch_manifest
          from noema_reviewer.sandbox import DockerCodeGraphRunner

          repository = os.environ["TARGET_REPOSITORY"]
          pr_number = int(os.environ["PR_NUMBER"])
          source_root = str(Path(os.environ["GITHUB_WORKSPACE"]) / "target-source")
          manifest = fetch_manifest(
              repository,
              pr_number,
              source_root=source_root,
              codegraph_runner=DockerCodeGraphRunner(),
          )
          output = Path(os.environ["RUNNER_TEMP"]) / "noema-manifest.json"
          output.write_text(manifest.model_dump_json(indent=2), encoding="utf-8")
          print(
              f"Collected bounded manifest for {manifest.repo}#{manifest.pr_number} "
              f"head={manifest.head_sha} checks={len(manifest.check_conclusions)} "
              f"comments={len(manifest.review_comments)}"
          )
          PY
          cd "$RUNNER_TEMP"
          sha256sum noema-manifest.json >noema-manifest.sha256

      - name: Upload short-lived bounded review manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: noema-manifest-${{ steps.target.outputs.head_sha }}
          path: |
            ${{ runner.temp }}/noema-manifest.json
            ${{ runner.temp }}/noema-manifest.sha256
          if-no-files-found: error
          retention-days: 1

  attest_evidence:
    name: noema-evidence-attestation
    needs: collect_evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TARGET_REPOSITORY: ${{ github.event.client_payload.target_repository || '' }}
      PR_NUMBER: ${{ github.event.client_payload.pr_number || '' }}
      EXPECTED_HEAD_SHA: ${{ github.event.client_payload.pr_head_sha || '' }}
    steps:
      - name: Download bounded review manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: noema-manifest-${{ needs.collect_evidence.outputs.head_sha }}
          path: ${{ runner.temp }}/noema-attestation-input

      - name: Verify bounded manifest before attestation
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/noema-attestation-input"
          sha256sum --check noema-manifest.sha256
          jq -e \
            --arg repo "$TARGET_REPOSITORY" \
            --argjson pr "$PR_NUMBER" \
            --arg head "$EXPECTED_HEAD_SHA" \
            '.repo == $repo and .pr_number == $pr and .head_sha == $head' \
            noema-manifest.json >/dev/null
          printf 'Bound manifest attestation input to %s#%s head=%s.\n' \
            "$TARGET_REPOSITORY" "$PR_NUMBER" "$EXPECTED_HEAD_SHA"

      - name: Attest bounded manifest provenance
        id: attest
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: ${{ runner.temp }}/noema-attestation-input/noema-manifest.json
          create-storage-record: false
          show-summary: false

      - name: Stage signed manifest attestation
        env:
          ATTESTATION_BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -f "$ATTESTATION_BUNDLE_PATH"
          install -m 0600 "$ATTESTATION_BUNDLE_PATH" \
            "$RUNNER_TEMP/noema-manifest-attestation.json"

      - name: Upload short-lived signed manifest attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: noema-manifest-attestation-${{ needs.collect_evidence.outputs.head_sha }}
          path: ${{ runner.temp }}/noema-manifest-attestation.json
          if-no-files-found: error
          retention-days: 1

  publish_review:
    name: noema-review-publication
    needs: [collect_evidence, attest_evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TARGET_REPOSITORY: ${{ github.event.client_payload.target_repository || '' }}
      PR_NUMBER: ${{ github.event.client_payload.pr_number || '' }}
      EXPECTED_HEAD_SHA: ${{ github.event.client_payload.pr_head_sha || '' }}
    steps:
      - name: Checkout trusted Noema reviewer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Mint review-publication Noema App token
        id: noema_write_app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.NOEMA_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.NOEMA_GITHUB_APP_PRIVATE_KEY }}
          owner: ContextualWisdomLab
          repositories: ${{ needs.collect_evidence.outputs.repository_name }}
          permission-actions: read
          permission-checks: read
          permission-contents: read
          permission-metadata: read
          permission-pull-requests: write
          permission-security-events: read
          permission-statuses: read
          permission-vulnerability-alerts: read

      - name: Download bounded review manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: noema-manifest-${{ needs.collect_evidence.outputs.head_sha }}
          path: ${{ runner.temp }}/noema-evidence

      - name: Download signed manifest attestation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: noema-manifest-attestation-${{ needs.collect_evidence.outputs.head_sha }}
          path: ${{ runner.temp }}/noema-attestation

      - name: Verify manifest provenance and current-head binding
        env:
          GH_TOKEN: ${{ steps.noema_write_app.outputs.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/noema-evidence"
          install -m 0600 \
            "$RUNNER_TEMP/noema-attestation/noema-manifest-attestation.json" \
            noema-manifest-attestation.json
          gh attestation verify noema-manifest.json \
            --bundle noema-manifest-attestation.json \
            --repo ContextualWisdomLab/noema \
            --signer-workflow ContextualWisdomLab/noema/.github/workflows/central-review.yml \
            --signer-digest "$GITHUB_SHA" \
            --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --deny-self-hosted-runners
          sha256sum --check noema-manifest.sha256
          live_json="$(gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}")"
          state="$(jq -r '.state // empty' <<<"$live_json")"
          live_head="$(jq -r '.head.sha // empty' <<<"$live_json")"
          head_repo="$(jq -r '.head.repo.full_name // empty' <<<"$live_json")"
          base_repo="$(jq -r '.base.repo.full_name // empty' <<<"$live_json")"
          manifest_head="$(jq -r '.head_sha // empty' noema-manifest.json)"
          manifest_repo="$(jq -r '.repo // empty' noema-manifest.json)"
          manifest_pr="$(jq -r '.pr_number // empty' noema-manifest.json)"
          if [ "$state" != "open" ] ||
            [ "$live_head" != "$EXPECTED_HEAD_SHA" ] ||
            [ "$head_repo" != "$TARGET_REPOSITORY" ] ||
            [ "$base_repo" != "$TARGET_REPOSITORY" ] ||
            [ "$manifest_head" != "$EXPECTED_HEAD_SHA" ] ||
            [ "$manifest_repo" != "$TARGET_REPOSITORY" ] ||
            [ "$manifest_pr" != "$PR_NUMBER" ]; then
            echo "::error::Noema refused stale or mismatched manifest evidence before publication."
            exit 1
          fi
          printf 'Verified manifest provenance and binding for %s#%s head=%s.\n' \
            "$manifest_repo" "$manifest_pr" "$manifest_head"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install hash-pinned reviewer dependencies
        run: pip install --require-hashes --no-deps -r reviewer/requirements-ci-hashes.txt

      - name: Run independent PydanticAI review and publish current-head verdict
        env:
          GH_TOKEN: ${{ steps.noema_write_app.outputs.token }}
          PYTHONPATH: ${{ github.workspace }}/reviewer
          NOEMA_REVIEW_TOKEN_SOURCE: noema-github-app
          NOEMA_LLM_API_URL: ${{ vars.NOEMA_LLM_API_URL }}
          NOEMA_LLM_MODEL: ${{ vars.NOEMA_LLM_MODEL }}
          # Dedicated inference token for contextual-orchestrator. Upstream
          # provider credentials stay inside the orchestrator credential KV.
          NOEMA_LLM_API_KEY: ${{ secrets.NOEMA_LLM_API_KEY }}
          NOEMA_LLM_REQUEST_TIMEOUT_SECONDS: ${{ vars.NOEMA_LLM_REQUEST_TIMEOUT_SECONDS || '5400' }}
          # One retry preserves transient recovery while keeping the request
          # path inside the bounded publication job.
          NOEMA_LLM_MAX_RETRIES: ${{ vars.NOEMA_LLM_MAX_RETRIES || '1' }}
        run: |
          set -euo pipefail
          node scripts/verify-orchestrator-gateway.mjs
          printf 'Noema provider contract: gateway=contextual-orchestrator primary=%s timeout=%ss retries=%s.\n' \
            "${NOEMA_LLM_MODEL:-missing}" "${NOEMA_LLM_REQUEST_TIMEOUT_SECONDS:-missing}" \
            "${NOEMA_LLM_MAX_RETRIES:-missing}"
          set +e
          python -m noema_reviewer \
            --manifest-file "$RUNNER_TEMP/noema-evidence/noema-manifest.json" \
            --strict \
            --publish \
            --token-source "$NOEMA_REVIEW_TOKEN_SOURCE" \
            --output "$RUNNER_TEMP/noema-verdict.json"
          reviewer_status=$?
          set -e
          if [ -s "$RUNNER_TEMP/noema-verdict.json" ]; then
            jq '{verdict,summary,findings,blocked_reasons,confidence}' \
              "$RUNNER_TEMP/noema-verdict.json"
          fi
          case "$reviewer_status" in
            0) echo "Noema published a completed current-head verdict." ;;
            2) echo "::error::Noema published REQUEST_CHANGES for concrete current-head evidence."; exit 1 ;;
            *) printf '::error::Noema reviewer failed before a valid verdict; exit=%s.\n' "$reviewer_status"; exit "$reviewer_status" ;;
          esac
