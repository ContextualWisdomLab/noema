name: Repair final candidate cleanup v3

on:
  push:
    branches:
      - feat/hourly-nim-opencode-development
    paths:
      - .github/workflows/repair-final-candidate-cleanup-v3.yml

concurrency:
  group: repair-final-candidate-cleanup-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repair_and_verify:
    if: >-
      github.repository == 'ContextualWisdomLab/noema'
      && github.ref == 'refs/heads/feat/hourly-nim-opencode-development'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.upload_repair.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload_repair.outputs.artifact-digest }}
      patch_sha256: ${{ steps.package_repair.outputs.patch_sha256 }}
    steps:
      - name: Check out exact repair trigger head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Apply the structural control-flow repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected exactly one {label} anchor")
              file_path.write_text(text.replace(old, new), encoding="utf-8")

          test_path = "test/hourly-product-development-workflow.test.ts"
          replace_once(
              test_path,
              '''    expect(
                candidateCount * (
                  candidateSeconds
                  + candidateGraceSeconds
                  + reinstallSeconds
                  + reinstallGraceSeconds
                ) + boundedSetupAndDiagnosticReserve,
              ).toBeLessThanOrEqual(jobSeconds);''',
              '''    const interCandidateCleanupCount = Math.max(candidateCount - 1, 0);

              expect(interCandidateCleanupCount).toBe(2);
              expect(
                candidateCount * (candidateSeconds + candidateGraceSeconds)
                + interCandidateCleanupCount * (
                  reinstallSeconds + reinstallGraceSeconds
                )
                + boundedSetupAndDiagnosticReserve,
              ).toBeLessThanOrEqual(jobSeconds);''',
              "budget arithmetic",
          )
          replace_once(
              test_path,
              '''    expect(workflow).toContain(
                "cleanup dependency reinstall failed or timed out",
              );
              expect(workflow).toContain("Every NVIDIA NIM candidate failed");''',
              '''    expect(workflow).toContain(
                "cleanup dependency reinstall failed or timed out",
              );
              expect(workflow).toContain("Every NVIDIA NIM candidate failed");

              const fallbackStart = proposer.indexOf(
                "- name: Run bounded NVIDIA NIM model fallback",
              );
              const fallback = proposer.slice(fallbackStart);
              const candidateListIndex = fallback.indexOf(
                'read -r -a model_candidates <<<"$OPENCODE_MODEL_CANDIDATES"',
              );
              const candidateLoopIndex = fallback.indexOf(
                "for ((candidate_index = 0; candidate_index < candidate_count; candidate_index++)); do",
              );
              const finalCandidateGuardIndex = fallback.indexOf(
                'if [ "$candidate_index" -eq $((candidate_count - 1)) ]; then',
              );
              const resetIndex = fallback.indexOf(
                'git -C "$GITHUB_WORKSPACE" reset --hard HEAD',
              );
              const reinstallIndex = fallback.indexOf(
                'timeout --kill-after="${DEPENDENCY_REINSTALL_KILL_GRACE_SECONDS}s" "${DEPENDENCY_REINSTALL_TIMEOUT_SECONDS}s" npm ci --ignore-scripts',
              );

              expect(fallbackStart).toBeGreaterThan(-1);
              expect(
                candidateListIndex,
                "fallback must materialize indexed model candidates",
              ).toBeGreaterThan(-1);
              expect(candidateLoopIndex).toBeGreaterThan(candidateListIndex);
              expect(finalCandidateGuardIndex).toBeGreaterThan(candidateLoopIndex);
              expect(finalCandidateGuardIndex).toBeLessThan(resetIndex);
              expect(resetIndex).toBeLessThan(reinstallIndex);''',
              "final-candidate assertions",
          )

          workflow_path = Path(".github/workflows/hourly-product-development.yml")
          lines = workflow_path.read_text(encoding="utf-8").splitlines()

          def unique_index(predicate, label: str, start: int = 0) -> int:
              matches = [index for index, line in enumerate(lines[start:], start) if predicate(line)]
              if len(matches) != 1:
                  raise SystemExit(f"workflow: expected exactly one {label}, found {len(matches)}")
              return matches[0]

          comment_index = unique_index(
              lambda line: line.strip() == "# Three bounded candidates, termination grace, cleanup reinstalls, setup, and diagnostics fit in 55 minutes.",
              "budget comment",
          )
          comment_indent = lines[comment_index][:-len(lines[comment_index].lstrip())]
          lines[comment_index] = comment_indent + "# Three candidate budgets and two inter-candidate cleanup reinstalls fit in 55 minutes."

          cleanup_index = unique_index(lambda line: line.strip() == "cleanup_failed=false", "cleanup state")
          loop_index = unique_index(
              lambda line: line.strip() == "for model in $OPENCODE_MODEL_CANDIDATES; do",
              "legacy candidate loop",
              cleanup_index + 1,
          )
          loop_indent = lines[cleanup_index][:-len(lines[cleanup_index].lstrip())]
          lines[cleanup_index:loop_index + 1] = [
              loop_indent + "cleanup_failed=false",
              loop_indent + 'read -r -a model_candidates <<<"$OPENCODE_MODEL_CANDIDATES"',
              loop_indent + 'candidate_count=${#model_candidates[@]}',
              "",
              loop_indent + "for ((candidate_index = 0; candidate_index < candidate_count; candidate_index++)); do",
              loop_indent + '  model="${model_candidates[$candidate_index]}"',
          ]

          warning_index = unique_index(
              lambda line: line.strip() == 'echo "::warning::Candidate $model failed; discarding its partial working tree."',
              "legacy cleanup warning",
          )
          endgroup_index = warning_index - 1
          if lines[endgroup_index].strip() != 'echo "::endgroup::"':
              raise SystemExit("workflow: cleanup warning is not preceded by endgroup")
          timeout_index = unique_index(
              lambda line: line.strip().startswith(
                  'if ! timeout --kill-after="${DEPENDENCY_REINSTALL_KILL_GRACE_SECONDS}s" '
                  '"${DEPENDENCY_REINSTALL_TIMEOUT_SECONDS}s" npm ci --ignore-scripts; then'
              ),
              "cleanup reinstall timeout",
              warning_index + 1,
          )
          cleanup_indent = lines[warning_index][:-len(lines[warning_index].lstrip())]
          lines[endgroup_index:timeout_index + 1] = [
              cleanup_indent + 'echo "::endgroup::"',
              cleanup_indent + 'if [ "$candidate_index" -eq $((candidate_count - 1)) ]; then',
              cleanup_indent + "  break",
              cleanup_indent + "fi",
              "",
              cleanup_indent + 'echo "::warning::Candidate $model failed; discarding its partial working tree before the next candidate."',
              cleanup_indent + 'git -C "$GITHUB_WORKSPACE" reset --hard HEAD',
              cleanup_indent + 'git -C "$GITHUB_WORKSPACE" clean -fdx',
              cleanup_indent + 'if ! timeout --kill-after="${DEPENDENCY_REINSTALL_KILL_GRACE_SECONDS}s" "${DEPENDENCY_REINSTALL_TIMEOUT_SECONDS}s" npm ci --ignore-scripts; then',
          ]

          workflow_text = "\n".join(lines) + "\n"
          required_fragments = (
              'read -r -a model_candidates <<<"$OPENCODE_MODEL_CANDIDATES"',
              "for ((candidate_index = 0; candidate_index < candidate_count; candidate_index++)); do",
              'if [ "$candidate_index" -eq $((candidate_count - 1)) ]; then',
          )
          for fragment in required_fragments:
              if workflow_text.count(fragment) != 1:
                  raise SystemExit(f"workflow: invalid final count for {fragment!r}")
          if "for model in $OPENCODE_MODEL_CANDIDATES; do" in workflow_text:
              raise SystemExit("workflow: legacy candidate loop remains")
          workflow_path.write_text(workflow_text, encoding="utf-8")

          replace_once(
              "docs/operations/hourly-product-development.md",
              "**후보별 900초**와 강제 종료 유예 30초를 적용합니다. 각 실패 후보의 의존성 재설치는 60초와 강제 종료 유예 10초로 별도 제한합니다. 최악의 경우 세 후보에 대해 `3 × (900 + 30 + 60 + 10) = 3,000초`를 사용하고, 최초 설정과 최종 진단에 300초를 남겨 총 3,300초가 55분 제안 job에 정확히 들어갑니다.",
              "**후보별 900초**와 강제 종료 유예 30초를 적용합니다. 다음 후보가 남아 있을 때만 의존성 재설치를 60초와 강제 종료 유예 10초로 별도 제한합니다. 최악의 경우 세 후보 실행·종료에 `3 × (900 + 30) = 2,790초`, 후보 사이 두 번의 재설치에 `2 × (60 + 10) = 140초`를 사용합니다. 최초 설정과 최종 진단에 300초를 예약하면 총 3,230초이며, 3,300초인 55분 제안 job 예산 안에 70초의 명시적 여유를 남깁니다.",
              "operations budget",
          )
          replace_once(
              "docs/operations/hourly-product-development.md",
              "후보 실패 시 `git reset --hard HEAD`, `git clean -fdx`를 실행하고 `npm ci --ignore-scripts`를 명시적 60초 제한 안에서 재실행한 뒤에만 다음 후보로 폴백합니다. 재설치가 실패하거나 제한 시간을 넘기면 의존성 트리가 완전하다고 증명할 수 없으므로 즉시 실패 폐쇄하고 이후 모델 후보를 실행하지 않습니다. 이전 후보의 부분 변경이나 생성 파일이 다음 후보의 입력을 오염시키지 않도록 하며, 폴백은 가용성 제어일 뿐 품질 증거가 아닙니다. 성공한 제안도 독립 검증과 리뷰를 통과해야 합니다.",
              "다음 후보가 남아 있는 상태에서 후보가 실패하면 `git reset --hard HEAD`, `git clean -fdx`를 실행하고 `npm ci --ignore-scripts`를 명시적 60초 제한 안에서 재실행한 뒤에만 폴백합니다. 마지막 후보 실패에는 다음 후보가 없으므로 reset·clean·재설치를 실행하지 않고 곧바로 안정적인 전체 후보 실패 진단으로 종료합니다. 후보 사이 재설치가 실패하거나 제한 시간을 넘기면 의존성 트리가 완전하다고 증명할 수 없으므로 즉시 실패 폐쇄하고 이후 모델 후보를 실행하지 않습니다. 이전 후보의 부분 변경이나 생성 파일이 다음 후보의 입력을 오염시키지 않도록 하며, 폴백은 가용성 제어일 뿐 품질 증거가 아닙니다. 성공한 제안도 독립 검증과 리뷰를 통과해야 합니다.",
              "operations control flow",
          )
          replace_once(
              "docs/superpowers/plans/2026-08-05-hourly-nim-opencode-development.md",
              "- [x] Run ordered NIM fallback with a 900-second candidate timeout, 30-second candidate kill grace, hard reset, ignored/untracked cleanup, and a separately bounded 60-second clean reinstall with 10-second kill grace after each failed candidate. Fail closed and stop the fallback chain when reinstall fails or times out, so no later candidate runs with an incomplete dependency tree.",
              "- [x] Run ordered NIM fallback with a 900-second candidate timeout and 30-second candidate kill grace. Only between failed candidates, hard reset, remove ignored/untracked files, and run a separately bounded 60-second clean reinstall with 10-second kill grace. Skip cleanup after the final candidate so its failure reaches the stable all-candidates-failed diagnostic; fail closed and stop the chain when an inter-candidate reinstall fails or times out.",
              "plan control flow",
          )
          replace_once(
              "docs/superpowers/specs/2026-08-05-hourly-nim-opencode-development-design.md",
              "Each candidate has a 900-second execution timeout and a separate 30-second forced-termination grace period. Candidate failure causes hard reset and ignored/untracked cleanup, followed by a dependency reinstall with its own 60-second timeout and 10-second kill grace. The fallback proceeds only after that reinstall succeeds. A failed or timed-out reinstall fails closed immediately, prevents every later candidate from running with an incomplete dependency tree, and creates no artifact, branch, or PR. The conservative proposer budget is `3 × (900 + 30 + 60 + 10) + 300 = 3,300 seconds`, matching the 55-minute job limit.",
              "Each candidate has a 900-second execution timeout and a separate 30-second forced-termination grace period. When another candidate remains, failure causes hard reset and ignored/untracked cleanup, followed by a dependency reinstall with its own 60-second timeout and 10-second kill grace. The fallback proceeds only after that inter-candidate reinstall succeeds. A failed or timed-out reinstall fails closed immediately and prevents later candidates from running with an incomplete dependency tree. After the final candidate fails, the workflow skips reset, cleanup, and reinstall and emits the stable all-candidates-failed diagnostic. The conservative proposer budget is `3 × (900 + 30) + 2 × (60 + 10) + 300 = 3,230 seconds`, which fits inside the 3,300-second job limit with 70 seconds of explicit slack.",
              "design control flow",
          )
          replace_once(
              "docs/doctoring/hourly-nim-opencode-development.md",
              "Each model candidate has a timeout of 900 seconds plus a 30-second forced-termination grace period. Three complete candidate budgets, cleanup, dependency reinstall, and the final all-candidates-failed diagnostic fit inside the 55-minute proposal-job limit. Failure triggers hard reset, ignored/untracked cleanup, and dependency reinstall before the next candidate. Partial output from one model cannot contaminate fallback input. Fallback improves availability; it is not quality evidence.",
              "Each model candidate has a timeout of 900 seconds plus a 30-second forced-termination grace period. Cleanup and dependency reinstall occur only between candidates, so three candidate budgets and two bounded reinstalls use `3 × (900 + 30) + 2 × (60 + 10) = 2,930 seconds`. Reserving 300 seconds for setup and the final diagnostic yields 3,230 seconds inside the 3,300-second proposal-job limit, leaving 70 seconds of explicit slack. After the final candidate fails, no later candidate can be protected by cleanup, so the workflow skips reset, clean, and reinstall and emits the stable all-candidates-failed diagnostic directly. Partial output from one model cannot contaminate a later candidate. Fallback improves availability; it is not quality evidence.",
              "doctoring control flow",
          )
          replace_once(
              "CHANGELOG.md",
              "세 후보의 실행·종료·재설치와 300초 setup/diagnostic reserve를 합친 3,300초가 55분 job budget에 정확히 결합된다.",
              "세 후보의 실행·종료 2,790초, 두 번의 후보 간 재설치 140초, 300초 setup/diagnostic reserve를 합친 3,230초가 55분(3,300초) job budget에 들어가며 70초 여유를 남긴다. 마지막 후보가 실패하면 불필요한 reset·clean·재설치를 생략하고 안정적인 전체 후보 실패 진단으로 곧바로 종료한다.",
              "changelog budget",
          )
          PY

      - name: Verify focused and complete release gates
        shell: bash
        run: |
          set -euo pipefail
          npx vitest run test/hourly-product-development-workflow.test.ts
          npm run release:verify
          git diff --check

      - name: Package exact verified repair and remove one-shot workflows
        id: package_repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-final-candidate-cleanup.yml
          rm .github/workflows/repair-final-candidate-cleanup-v2.yml
          rm .github/workflows/repair-final-candidate-cleanup-v3.yml

          expected_paths="$RUNNER_TEMP/expected-paths.txt"
          actual_paths="$RUNNER_TEMP/actual-paths.txt"
          cat >"$expected_paths" <<'PATHS'
          .github/workflows/hourly-product-development.yml
          .github/workflows/repair-final-candidate-cleanup-v2.yml
          .github/workflows/repair-final-candidate-cleanup-v3.yml
          .github/workflows/repair-final-candidate-cleanup.yml
          CHANGELOG.md
          docs/doctoring/hourly-nim-opencode-development.md
          docs/operations/hourly-product-development.md
          docs/superpowers/plans/2026-08-05-hourly-nim-opencode-development.md
          docs/superpowers/specs/2026-08-05-hourly-nim-opencode-development-design.md
          test/hourly-product-development-workflow.test.ts
          PATHS
          git diff --name-only | LC_ALL=C sort >"$actual_paths"
          LC_ALL=C sort -o "$expected_paths" "$expected_paths"
          diff -u "$expected_paths" "$actual_paths"

          patch="$RUNNER_TEMP/repair.patch"
          git diff --binary --full-index >"$patch"
          git diff --check
          patch_sha256="$(sha256sum "$patch" | awk '{print $1}')"
          printf '%s  %s\n' "$patch_sha256" "$patch" | sha256sum -c -
          echo "patch_sha256=$patch_sha256" >>"$GITHUB_OUTPUT"

      - name: Upload immutable verified repair
        id: upload_repair
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: noema-final-candidate-repair-v3-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repair.patch
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false

  publish_repair:
    if: >-
      github.repository == 'ContextualWisdomLab/noema'
      && github.ref == 'refs/heads/feat/hourly-nim-opencode-development'
    needs: repair_and_verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out exact repair trigger head without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download repair by immutable artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.repair_and_verify.outputs.artifact_id }}
          path: ${{ runner.temp }}/final-candidate-repair

      - name: Verify artifact and apply repair without execution
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/final-candidate-repair/repair.patch"
          artifact_id="${{ needs.repair_and_verify.outputs.artifact_id }}"
          expected_artifact_digest="${{ needs.repair_and_verify.outputs.artifact_digest }}"
          expected_patch_sha="${{ needs.repair_and_verify.outputs.patch_sha256 }}"
          artifact_name="noema-final-candidate-repair-v3-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          test -f "$patch"
          test ! -L "$patch"
          artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}")"
          jq -e \
            --argjson artifact_id "$artifact_id" \
            --arg artifact_name "$artifact_name" \
            --argjson run_id "$GITHUB_RUN_ID" \
            '.id == $artifact_id
             and .name == $artifact_name
             and .expired == false
             and .workflow_run.id == $run_id' \
            <<<"$artifact_json" >/dev/null
          test "$(jq -r '.digest' <<<"$artifact_json")" = "$expected_artifact_digest"
          printf '%s  %s\n' "$expected_patch_sha" "$patch" | sha256sum -c -
          git apply --check --binary "$patch"
          git apply --index --binary "$patch"
          git diff --cached --check

          if git diff --cached --raw | awk '
            /^:/ {
              old_mode = substr($1, 2)
              new_mode = $2
              if (old_mode ~ /^(120000|160000)$/ || new_mode ~ /^(120000|160000)$/) found = 1
            }
            END { exit(found ? 0 : 1) }
          '; then
            echo "::error::The repair contains a symlink or gitlink."
            exit 1
          fi
          test ! -e .github/workflows/repair-final-candidate-cleanup.yml
          test ! -e .github/workflows/repair-final-candidate-cleanup-v2.yml
          test ! -e .github/workflows/repair-final-candidate-cleanup-v3.yml

      - name: Mint repository-scoped Maintainer App token after verification
        id: maintainer_app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.NOEMA_MAINTAINER_APP_CLIENT_ID }}
          private-key: ${{ secrets.NOEMA_MAINTAINER_APP_PRIVATE_KEY }}
          owner: ContextualWisdomLab
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-metadata: read

      - name: Commit and push the verified exact repair
        shell: bash
        env:
          APP_TOKEN: ${{ steps.maintainer_app.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(automation): skip cleanup after final candidate"
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          trap 'git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"' EXIT
          remote_sha="$(git ls-remote origin "$GITHUB_REF" | awk '{print $1}')"
          test "$remote_sha" = "$GITHUB_SHA"
          git push origin "HEAD:${GITHUB_REF}"
