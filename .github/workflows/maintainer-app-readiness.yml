name: maintainer-app-readiness
run-name: Noema Maintainer App pre-activation audit

on:
  # repository_dispatch is evaluated only from the default branch. A caller
  # cannot select unreviewed workflow code for these privileged token mints.
  repository_dispatch:
    types: [maintainer-app-readiness]

concurrency:
  group: noema-maintainer-app-readiness
  cancel-in-progress: true

# GITHUB_TOKEN is used only by the trusted checkout. Audit API calls use the
# repository-scoped Maintainer token; the Reviewer token is never exposed to a
# script and supplies only authenticated App slug/installation identity output.
permissions:
  contents: read

jobs:
  preflight:
    name: maintainer-app-pre-activation-audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: checkout event-bound default-branch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # For repository_dispatch, github.sha is the default-branch commit
          # bound when the event was created. Do not re-resolve a moving branch.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: mint repository-scoped Maintainer App token
        id: maintainer_app
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.NOEMA_MAINTAINER_APP_CLIENT_ID }}
          private-key: ${{ secrets.NOEMA_MAINTAINER_APP_PRIVATE_KEY }}
          owner: ContextualWisdomLab
          repositories: noema
          permission-actions: read
          permission-checks: read
          permission-contents: write
          permission-metadata: read
          permission-pull-requests: write
          permission-statuses: read

      - name: mint repository-scoped Reviewer App identity token
        id: reviewer_app
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.NOEMA_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.NOEMA_GITHUB_APP_PRIVATE_KEY }}
          owner: ContextualWisdomLab
          repositories: noema
          permission-metadata: read

      - name: setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: audit active main governance
        id: governance
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.maintainer_app.outputs.token }}
          NOEMA_GOVERNANCE_AUDIT_PATH: artifacts/governance/main-governance-audit.json
        run: node scripts/main-governance-audit.mjs

      - name: audit effective Maintainer App identity and access
        id: readiness
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.maintainer_app.outputs.token }}
          NOEMA_MAINTAINER_APP_SLUG: ${{ steps.maintainer_app.outputs.app-slug }}
          NOEMA_MAINTAINER_INSTALLATION_ID: ${{ steps.maintainer_app.outputs.installation-id }}
          NOEMA_REVIEWER_APP_SLUG: ${{ steps.reviewer_app.outputs.app-slug }}
          NOEMA_REVIEWER_INSTALLATION_ID: ${{ steps.reviewer_app.outputs.installation-id }}
          NOEMA_REVIEWER_LOGIN: ${{ vars.NOEMA_REVIEWER_LOGIN }}
          NOEMA_MAINTENANCE_ENABLED: ${{ vars.NOEMA_MAINTENANCE_ENABLED }}
          NOEMA_GOVERNANCE_AUDIT_PATH: artifacts/governance/main-governance-audit.json
          NOEMA_MAINTAINER_READINESS_PATH: artifacts/operations/maintainer-app-readiness.json
        run: node scripts/maintainer-app-readiness.mjs

      - name: inspect commercial-readiness loop without writes
        id: dry_run
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.maintainer_app.outputs.token }}
          NOEMA_REVIEWER_LOGIN: ${{ vars.NOEMA_REVIEWER_LOGIN }}
          MAINTAINER_APP_OUTCOME: ${{ steps.maintainer_app.outcome }}
        run: |
          set -euo pipefail
          report_path="artifacts/operations/commercial-readiness-loop-dry-run.json"
          write_failure_report() {
            local reasonCode="$1"
            local reasonDetail="$2"
            FAILURE_CODE="$reasonCode" FAILURE_DETAIL="$reasonDetail" REPORT_PATH="$report_path" \
              node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from "node:fs";
          import { dirname } from "node:path";

          const reportPath = process.env.REPORT_PATH;
          const reasonCode = process.env.FAILURE_CODE;
          const reasonDetail = process.env.FAILURE_DETAIL;
          const report = {
            schemaVersion: 1,
            repository: process.env.GITHUB_REPOSITORY || "ContextualWisdomLab/noema",
            generatedAt: new Date().toISOString(),
            apply: false,
            openPullRequestCount: null,
            remainingOpenPullRequestCount: null,
            results: [
              {
                number: null,
                result: "operational_error",
                reasons: [{ code: reasonCode, detail: reasonDetail }],
              },
            ],
          };
          mkdirSync(dirname(reportPath), { recursive: true });
          writeFileSync(reportPath, `${JSON.stringify(report, null, 2)}\n`, "utf8");
          NODE
          }

          if [ "$MAINTAINER_APP_OUTCOME" != "success" ]; then
            reasonCode="maintainer_token_unavailable"
            write_failure_report \
              "$reasonCode" \
              "Maintainer App token mint did not succeed; no GitHub API requests were attempted."
            exit 1
          fi

          set +e
          node scripts/hourly-commercial-readiness.mjs --report "$report_path"
          loop_status=$?
          set -e
          if [ "$loop_status" -ne 0 ] && [ ! -s "$report_path" ]; then
            reasonCode="commercial_loop_failed"
            write_failure_report \
              "$reasonCode" \
              "Commercial-readiness dry run failed before it could retain its bounded report."
          fi
          exit "$loop_status"

      - name: normalize bounded commercial-loop evidence
        id: dry_run_evidence
        if: always()
        continue-on-error: true
        env:
          REPORT_PATH: artifacts/operations/commercial-readiness-loop-dry-run.json
          EXPECTED_REPOSITORY: ContextualWisdomLab/noema
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {
            lstatSync,
            mkdirSync,
            readFileSync,
            renameSync,
            writeFileSync,
          } from "node:fs";
          import { dirname, resolve } from "node:path";

          const MAX_REPORT_BYTES = 1_048_576;
          const MAX_RESULTS = 100;
          const MAX_REASONS = 50;
          const MAX_DETAIL_CHARS = 1_000;
          const EXPECTED_REPOSITORY = process.env.EXPECTED_REPOSITORY;
          const REPORT_PATH = resolve(process.env.REPORT_PATH || "");
          const CODE_PATTERN = /^[a-z0-9_]{1,64}$/;
          const SHA_PATTERN = /^[0-9a-f]{40}$/i;

          function boundText(value, limit = MAX_DETAIL_CHARS) {
            const text = String(value ?? "")
              .replace(/[\u0000-\u001f\u007f]/g, "")
              .trim();
            return text.length <= limit ? text : `${text.slice(0, limit)}…`;
          }

          function normalizeCount(value, label) {
            if (value === null) return null;
            if (!Number.isSafeInteger(value) || value < 0) {
              throw new TypeError(`${label} must be a non-negative integer or null.`);
            }
            return value;
          }

          function normalizeCode(value, label) {
            const code = String(value ?? "").trim();
            if (!CODE_PATTERN.test(code)) {
              throw new TypeError(`${label} must be a lowercase bounded code.`);
            }
            return code;
          }

          function normalizeReason(reason, resultIndex, reasonIndex) {
            if (!reason || typeof reason !== "object" || Array.isArray(reason)) {
              throw new TypeError(
                `results[${resultIndex}].reasons[${reasonIndex}] must be an object.`,
              );
            }
            return {
              code: normalizeCode(
                reason.code,
                `results[${resultIndex}].reasons[${reasonIndex}].code`,
              ),
              detail: boundText(reason.detail),
            };
          }

          function normalizeResult(result, index) {
            if (!result || typeof result !== "object" || Array.isArray(result)) {
              throw new TypeError(`results[${index}] must be an object.`);
            }
            if (
              result.number !== null
              && (!Number.isSafeInteger(result.number) || result.number <= 0)
            ) {
              throw new TypeError(`results[${index}].number must be positive or null.`);
            }
            if (!Array.isArray(result.reasons) || result.reasons.length > MAX_REASONS) {
              throw new TypeError(
                `results[${index}].reasons must be an array with at most ${MAX_REASONS} items.`,
              );
            }

            const normalized = {
              number: result.number,
              result: normalizeCode(result.result, `results[${index}].result`),
              reasons: result.reasons.map((reason, reasonIndex) => (
                normalizeReason(reason, index, reasonIndex)
              )),
            };
            if (result.headSha !== undefined) {
              const headSha = String(result.headSha ?? "");
              if (!SHA_PATTERN.test(headSha)) {
                throw new TypeError(`results[${index}].headSha must be a full SHA.`);
              }
              normalized.headSha = headSha.toLowerCase();
            }
            if (result.decision !== undefined) {
              normalized.decision = normalizeCode(
                result.decision,
                `results[${index}].decision`,
              );
            }
            if (result.detail !== undefined) {
              normalized.detail = boundText(result.detail);
            }
            return normalized;
          }

          function invalidReport(detail) {
            return {
              schemaVersion: 1,
              repository: EXPECTED_REPOSITORY,
              generatedAt: new Date().toISOString(),
              apply: false,
              openPullRequestCount: null,
              remainingOpenPullRequestCount: null,
              results: [
                {
                  number: null,
                  result: "operational_error",
                  reasons: [
                    {
                      code: "dry_run_report_invalid",
                      detail: boundText(detail),
                    },
                  ],
                },
              ],
            };
          }

          function writeCanonicalReport(report) {
            mkdirSync(dirname(REPORT_PATH), { recursive: true });
            const temporaryPath = `${REPORT_PATH}.tmp`;
            writeFileSync(temporaryPath, `${JSON.stringify(report, null, 2)}\n`, {
              encoding: "utf8",
              mode: 0o600,
            });
            renameSync(temporaryPath, REPORT_PATH);
          }

          try {
            if (!EXPECTED_REPOSITORY || !REPORT_PATH) {
              throw new Error("Normalizer configuration is incomplete.");
            }
            const metadata = lstatSync(REPORT_PATH);
            if (!metadata.isFile() || metadata.isSymbolicLink()) {
              throw new Error("Dry-run evidence must be a regular non-symlink file.");
            }
            if (metadata.size <= 0 || metadata.size > MAX_REPORT_BYTES) {
              throw new Error(
                `Dry-run evidence must contain 1..${MAX_REPORT_BYTES} bytes.`,
              );
            }

            const raw = readFileSync(REPORT_PATH, "utf8");
            const report = JSON.parse(raw);
            if (!report || typeof report !== "object" || Array.isArray(report)) {
              throw new TypeError("Dry-run evidence root must be an object.");
            }
            if (report.schemaVersion !== 1) {
              throw new TypeError("Dry-run evidence schemaVersion must equal 1.");
            }
            if (report.repository !== EXPECTED_REPOSITORY) {
              throw new TypeError("Dry-run evidence repository binding is invalid.");
            }
            if (report.apply !== false) {
              throw new TypeError("Dry-run evidence must prove apply=false.");
            }
            if (!Array.isArray(report.results) || report.results.length > MAX_RESULTS) {
              throw new TypeError(
                `Dry-run evidence results must contain at most ${MAX_RESULTS} items.`,
              );
            }

            const generatedAt = new Date(report.generatedAt);
            if (!Number.isFinite(generatedAt.getTime())) {
              throw new TypeError("Dry-run evidence generatedAt must be an ISO timestamp.");
            }
            const normalized = {
              schemaVersion: 1,
              repository: EXPECTED_REPOSITORY,
              generatedAt: generatedAt.toISOString(),
              apply: false,
              openPullRequestCount: normalizeCount(
                report.openPullRequestCount,
                "openPullRequestCount",
              ),
              remainingOpenPullRequestCount: normalizeCount(
                report.remainingOpenPullRequestCount,
                "remainingOpenPullRequestCount",
              ),
              results: report.results.map(normalizeResult),
            };
            writeCanonicalReport(normalized);
            console.log(
              `Normalized bounded no-write evidence for ${EXPECTED_REPOSITORY}: ${normalized.results.length} result(s).`,
            );
          } catch (error) {
            const detail = error instanceof Error ? error.message : String(error);
            writeCanonicalReport(invalidReport(detail));
            console.error(`Dry-run evidence normalization failed: ${boundText(detail)}`);
            process.exitCode = 1;
          }
          NODE

      - name: upload main governance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: main-governance-audit
          path: artifacts/governance/main-governance-audit.json
          if-no-files-found: error
          retention-days: 90

      - name: upload Maintainer App readiness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maintainer-app-readiness
          path: artifacts/operations/maintainer-app-readiness.json
          if-no-files-found: error
          retention-days: 90

      - name: upload no-write commercial loop evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: commercial-readiness-loop-dry-run
          path: artifacts/operations/commercial-readiness-loop-dry-run.json
          if-no-files-found: error
          retention-days: 90

      - name: enforce pre-activation gates
        if: always()
        env:
          MAINTAINER_APP_OUTCOME: ${{ steps.maintainer_app.outcome }}
          REVIEWER_APP_OUTCOME: ${{ steps.reviewer_app.outcome }}
          GOVERNANCE_OUTCOME: ${{ steps.governance.outcome }}
          READINESS_OUTCOME: ${{ steps.readiness.outcome }}
          DRY_RUN_OUTCOME: ${{ steps.dry_run.outcome }}
          DRY_RUN_EVIDENCE_OUTCOME: ${{ steps.dry_run_evidence.outcome }}
        run: |
          set -euo pipefail
          failed=0
          for gate in MAINTAINER_APP_OUTCOME REVIEWER_APP_OUTCOME GOVERNANCE_OUTCOME READINESS_OUTCOME DRY_RUN_OUTCOME DRY_RUN_EVIDENCE_OUTCOME; do
            value="${!gate}"
            if [ "$value" != "success" ]; then
              printf '::error::%s was %s, not success.\n' "$gate" "$value"
              failed=1
            fi
          done
          exit "$failed"
