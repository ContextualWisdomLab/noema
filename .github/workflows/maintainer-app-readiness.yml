name: maintainer-app-readiness
run-name: Noema Maintainer App pre-activation audit

on:
  # repository_dispatch is evaluated from the default branch, preventing a
  # caller from selecting unreviewed workflow code for this privileged token.
  repository_dispatch:
    types: [maintainer-app-readiness]

concurrency:
  group: noema-maintainer-app-readiness
  cancel-in-progress: true

# GITHUB_TOKEN only checks out reviewed default-branch code. Every API probe
# uses the separately minted, repository-scoped Maintainer App token.
permissions:
  contents: read

jobs:
  preflight:
    name: maintainer-app-pre-activation-audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: checkout trusted default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: mint production-scoped Maintainer App token
        id: maintainer_app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.NOEMA_MAINTAINER_APP_CLIENT_ID }}
          private-key: ${{ secrets.NOEMA_MAINTAINER_APP_PRIVATE_KEY }}
          owner: ContextualWisdomLab
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-checks: read
          permission-contents: write
          permission-metadata: read
          permission-pull-requests: write
          permission-statuses: read

      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm

      - name: install lockfile dependencies
        run: npm ci

      - name: audit active main governance
        id: governance
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.maintainer_app.outputs.token }}
          NOEMA_GOVERNANCE_AUDIT_PATH: artifacts/governance/main-governance-audit.json
        run: npm run governance:audit

      - name: audit effective Maintainer App identity and access
        id: readiness
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.maintainer_app.outputs.token }}
          NOEMA_MAINTAINER_APP_SLUG: ${{ steps.maintainer_app.outputs.app-slug }}
          NOEMA_MAINTAINER_INSTALLATION_ID: ${{ steps.maintainer_app.outputs.installation-id }}
          NOEMA_REVIEWER_LOGIN: ${{ vars.NOEMA_REVIEWER_LOGIN }}
          NOEMA_MAINTENANCE_ENABLED: ${{ vars.NOEMA_MAINTENANCE_ENABLED }}
          NOEMA_GOVERNANCE_AUDIT_PATH: artifacts/governance/main-governance-audit.json
          NOEMA_MAINTAINER_READINESS_PATH: artifacts/operations/maintainer-app-readiness.json
        run: npm run operations:preflight

      - name: execute commercial-readiness inspection without writes
        id: dry_run
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.maintainer_app.outputs.token }}
          NOEMA_REVIEWER_LOGIN: ${{ vars.NOEMA_REVIEWER_LOGIN }}
        run: >-
          node scripts/hourly-commercial-readiness.mjs
          --report artifacts/operations/commercial-readiness-loop-dry-run.json

      - name: upload main governance audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: main-governance-audit
          path: artifacts/governance/main-governance-audit.json
          if-no-files-found: warn
          retention-days: 90

      - name: upload Maintainer App readiness audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maintainer-app-readiness
          path: artifacts/operations/maintainer-app-readiness.json
          if-no-files-found: warn
          retention-days: 90

      - name: upload commercial-readiness loop dry run
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: commercial-readiness-loop-dry-run
          path: artifacts/operations/commercial-readiness-loop-dry-run.json
          if-no-files-found: warn
          retention-days: 90

      - name: enforce pre-activation gates
        if: always()
        env:
          GOVERNANCE_OUTCOME: ${{ steps.governance.outcome }}
          READINESS_OUTCOME: ${{ steps.readiness.outcome }}
          DRY_RUN_OUTCOME: ${{ steps.dry_run.outcome }}
        run: |
          set -euo pipefail
          failed=0
          for gate in GOVERNANCE_OUTCOME READINESS_OUTCOME DRY_RUN_OUTCOME; do
            value="${!gate}"
            if [ "$value" != "success" ]; then
              printf '::error::%s was %s, not success.\n' "$gate" "$value"
              failed=1
            fi
          done
          exit "$failed"
