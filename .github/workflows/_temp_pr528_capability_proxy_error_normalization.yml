name: Temporary PR528 Capability Proxy Repair

on:
  push:
    branches:
      - chatgpt/runtime-bounded-context-fitness-v1
    paths:
      - .github/workflows/_temp_pr528_capability_proxy_error_normalization.yml

permissions:
  contents: write

concurrency:
  group: temp-pr528-capability-proxy-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup exact Node toolchain
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Install repository dependencies
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"
          npm ci --legacy-peer-deps=false --install-links=false

      - name: Materialize RED external-review regression
        env:
          TEST_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$TEST_B64" | base64 --decode > test/context-contract-release-capability-proxy-errors.test.ts
          if npx vitest run test/context-contract-release-capability-proxy-errors.test.ts; then
            echo '::error::Expected hostile capability-container regression to be RED before the production repair.'
            exit 1
          fi

      - name: Apply smallest causal production repair
        env:
          OLD_B64: ICBjb25zdCByYXdDYXBhYmlsaXRpZXMgPSByYXcuY2FwYWJpbGl0aWVzOwogIGlmICghQXJyYXkuaXNBcnJheShyYXdDYXBhYmlsaXRpZXMpKSByZWplY3QoImNhcGFiaWxpdGllcyBtdXN0IGJlIGFuIGFycmF5Iik7CiAgY29uc3QgY2FwYWJpbGl0eUNvdW50ID0gcmF3Q2FwYWJpbGl0aWVzLmxlbmd0aDsKICBjb25zdCBjYXBhYmlsaXRpZXM6IHN0cmluZ1tdID0gW107Cg==
          NEW_B64: 
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path('src/context-fabric/context-contract-release-admission.ts')
          source = path.read_text(encoding='utf-8')
          old = base64.b64decode(os.environ['OLD_B64']).decode()
          new = base64.b64decode(os.environ['NEW_B64']).decode()
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'capability metadata boundary drifted: expected 1 exact block, found {count}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          note = '- Context Fabric release-evidence validation은 revoked capability-array Proxy 및 hostile `length` trap도 `ContextContractReleaseAdmissionError`로 정규화해, malformed external metadata가 bounded-context error contract 밖의 임의 JavaScript 예외를 누출하지 못하게 한다.\n'
          marker = '## Unreleased\n'
          if note not in changelog:
              if changelog.count(marker) != 1:
                  raise SystemExit('CHANGELOG Unreleased marker drifted')
              changelog = changelog.replace(marker, marker + note, 1)
              changelog_path.write_text(changelog, encoding='utf-8')
          PY

      - name: Verify focused GREEN and type contract
        run: |
          set -euo pipefail
          npx vitest run \
            test/context-contract-release-capability-proxy-errors.test.ts \
            test/context-contract-release-admission-boundaries.test.ts \
            test/context-contract-release-admission.test.ts
          npm run typecheck
          git diff --check

      - name: Verify broader repository suite
        run: |
          set -euo pipefail
          npm run test
          git diff --check

      - name: Publish only from unchanged exact writer head
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin chatgpt/runtime-bounded-context-fitness-v1
          live_head="$(git rev-parse origin/chatgpt/runtime-bounded-context-fitness-v1)"
          if [ "$live_head" != "$EXPECTED_HEAD" ]; then
            echo "::error::Writer branch advanced to $live_head; refusing stale publication."
            exit 1
          fi
          git config user.name "ContextualWisdomLab automation"
          git config user.email "automation@users.noreply.github.com"
          git add src/context-fabric/context-contract-release-admission.ts \
            test/context-contract-release-capability-proxy-errors.test.ts \
            CHANGELOG.md
          git diff --cached --check
          git commit -m "fix(context-fabric): normalize capability proxy failures"
          git push origin HEAD:chatgpt/runtime-bounded-context-fitness-v1
