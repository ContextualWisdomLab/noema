name: patch-validator-image

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: noema-patch-validator-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PR_NUMBER: ${{ github.event.pull_request.number || '' }}
  IMAGE_TAG: noema-patch-validator:${{ github.event.pull_request.head.sha || github.sha }}
  SYFT_VERSION: 1.50.0
  SYFT_CHECKSUMS_SHA256: bb8824a06c27c625fc103db5d7e9d7131ba2cc6e7c7a79318ee71686ede3c3f0
  GRYPE_VERSION: 0.116.1
  GRYPE_CHECKSUMS_SHA256: 38ffeb0fbdf1955e46ebfb3cb7369b78888168954a77df02985c0c06505f85e9

jobs:
  verify_image:
    name: verify-patch-validator-image
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Check out exact pull-request head without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Refuse stale pull-request head before verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          test "$checked_out" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v2 --untracked-files=all --ignored=matching)"
          if [ -n "$PR_NUMBER" ]; then
            resolve_live_head_sha() {
              local output=""
              for attempt in 1 2 3; do
                if output="$(
                  gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq ".head.sha" \
                    2>&1
                )"; then
                  printf '%s\n' "$output"
                  return 0
                fi
                if printf '%s\n' "$output" | grep -Eq '\(HTTP (502|503|504)\)$' && [ "$attempt" -lt 3 ]; then
                  sleep "$attempt"
                  continue
                fi
                printf '::error::Live pull-request head resolution failed after attempt %s.\n' "$attempt" >&2
                return 1
              done
              return 1
            }
            live_head="$(resolve_live_head_sha)"
            test "$live_head" = "$SOURCE_SHA"
          fi

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.73.0
          cache: true

      - name: Install checksum-pinned Syft and Grype
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$RUNNER_TEMP/noema-binary-scanners"
          mkdir -p "$scanner_dir"

          download_scanner_asset() {
            destination="$1"
            url="$2"
            timeout --signal=TERM --kill-after=30s 5m \
              curl --proto '=https' --proto-redir '=https' --tlsv1.2 --location --fail --silent --show-error \
                --retry 3 \
                --retry-all-errors \
                --retry-delay 2 \
                --retry-max-time 90 \
                --connect-timeout 20 \
                --max-time 180 \
                --output "$destination" "$url"
          }

          install_scanner() {
            scanner="$1"
            version="$2"
            checksums_sha256="$3"
            archive="${scanner}_${version}_linux_amd64.tar.gz"
            checksums="${scanner}_${version}_checksums.txt"
            release_base="https://github.com/anchore/${scanner}/releases/download/v${version}"

            download_scanner_asset "$scanner_dir/$checksums" "$release_base/$checksums"
            printf '%s  %s\n' "$checksums_sha256" "$scanner_dir/$checksums" | sha256sum --check --strict

            download_scanner_asset "$scanner_dir/$archive" "$release_base/$archive"
            (
              cd "$scanner_dir"
              grep -E "^[0-9a-f]{64}  ${archive}$" "$checksums" | sha256sum --check --strict
            )
            tar -xzf "$scanner_dir/$archive" -C "$scanner_dir" "$scanner"
            test -x "$scanner_dir/$scanner"
          }

          install_scanner syft "$SYFT_VERSION" "$SYFT_CHECKSUMS_SHA256"
          install_scanner grype "$GRYPE_VERSION" "$GRYPE_CHECKSUMS_SHA256"
          "$scanner_dir/syft" version | grep -Fq "$SYFT_VERSION"
          "$scanner_dir/grype" version | grep -Fq "$GRYPE_VERSION"
          printf 'SCANNER_BIN_DIR=%s\n' "$scanner_dir" >>"$GITHUB_ENV"

      - name: Set up exact dependency materialization toolchain
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Materialize exact patch-validator dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"

          deps_dir="$RUNNER_TEMP/patch-validator-deps"
          rm -rf "$deps_dir"
          mkdir -p "$deps_dir"
          cp package.json package-lock.json "$deps_dir/"
          source_lock_sha="$(sha256sum package-lock.json | cut -d' ' -f1)"
          copied_lock_sha="$(sha256sum "$deps_dir/package-lock.json" | cut -d' ' -f1)"
          test "$copied_lock_sha" = "$source_lock_sha"

          (
            cd "$deps_dir"
            timeout --signal=TERM --kill-after=30s 10m env \
              npm_config_os=wasip1-threads \
              npm_config_cpu=wasm32 \
              npm ci --include=optional --ignore-scripts --no-audit --no-fund
            npm pkg delete devDependencies.@cloudflare/workers-types devDependencies.wrangler
            timeout --signal=TERM --kill-after=30s 5m env \
              npm_config_os=wasip1-threads \
              npm_config_cpu=wasm32 \
              npm prune --include=optional --ignore-scripts --no-audit --no-fund
            test -f node_modules/typescript/bin/tsc
            test -f node_modules/vitest/vitest.mjs
            test -f node_modules/@vitest/coverage-v8/package.json
            test -f node_modules/@rolldown/binding-wasm32-wasi/package.json
            test -z "$(find node_modules -type f -name '*.node' -print -quit)"
            test ! -e node_modules/@cloudflare/workers-types
            test ! -e node_modules/wrangler
            test ! -e node_modules/workerd
            test ! -e node_modules/miniflare
          )

          printf 'VALIDATOR_DEPS_CONTEXT=%s\n' "$deps_dir" >>"$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build exact-head patch-validator image
        shell: bash
        run: |
          set -euo pipefail
          test -d "$VALIDATOR_DEPS_CONTEXT/node_modules"
          timeout --signal=TERM --kill-after=30s 150m docker buildx build \
            --load \
            --cache-from=type=gha,scope=noema-patch-validator-image \
            --cache-to=type=gha,mode=max,scope=noema-patch-validator-image \
            --build-context "validator_deps=${VALIDATOR_DEPS_CONTEXT}" \
            --platform=linux/amd64 \
            --file=Dockerfile.patch-validator \
            --build-arg=SOURCE_REVISION=${SOURCE_SHA} \
            --tag="$IMAGE_TAG" \
            .
          image_digest="$(docker image inspect "$IMAGE_TAG" --format '{{.Id}}')"
          case "$image_digest" in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) printf '::error::Unexpected local image identity: %s\n' "$image_digest"; exit 1 ;;
          esac
          printf 'VALIDATOR_IMAGE_DIGEST=%s\n' "$image_digest" >>"$GITHUB_ENV"

      - name: Verify static Node runtime identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker run --rm --pull=never --entrypoint=/nodejs/bin/node "$IMAGE_TAG" --version)" = "v24.19.0"

      - name: Inspect exact image metadata and exclude dynamic runtime payloads
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/patch-validator-evidence"
          image_inspect="$evidence_dir/image-inspect.json"
          image_archive="$RUNNER_TEMP/patch-validator-image.tar"
          node_binary="$RUNNER_TEMP/patch-validator-node"
          node_license="$evidence_dir/node-runtime-license.txt"
          container_name="noema-image-inspect-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            rm -f "$node_binary"
            docker rm -f "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          mkdir -p "$evidence_dir"

          docker image inspect "$IMAGE_TAG" >"$image_inspect"
          docker create --name "$container_name" "$IMAGE_TAG" >/dev/null
          docker export "$container_name" --output "$image_archive"
          if tar -tf "$image_archive" | sed 's#^\./##' | grep -Eq \
            '^(bin/(sh|bash)|usr/bin/(apt|apt-get|apk|dpkg|npm|npx)|usr/local/bin/(npm|npx))$'; then
            echo "::error::The final patch-validator image contains a shell or package manager."
            exit 1
          fi
          if tar -tf "$image_archive" | sed 's#^\./##' | grep -Eq '\.(node|so)(\.|$)'; then
            echo "::error::The final patch-validator image contains a native addon or shared library."
            exit 1
          fi
          tar -xOf "$image_archive" licenses/node/LICENSE >"$node_license"
          node_license_bytes="$(wc -c <"$node_license")"
          test "$node_license_bytes" -gt 0
          test "$node_license_bytes" -le 1048576
          grep -Fq "Copyright Node.js contributors." "$node_license"
          grep -Fq "The above copyright notice and this permission notice shall be included" "$node_license"
          tar -xOf "$image_archive" nodejs/bin/node >"$node_binary"
          test -s "$node_binary"
          if readelf -l "$node_binary" | grep -q 'Requesting program interpreter'; then
            echo "::error::The final Node runtime requests a dynamic program interpreter."
            exit 1
          fi
          if readelf -d "$node_binary" | grep -q '(NEEDED)'; then
            echo "::error::The final Node runtime declares a dynamic shared-library dependency."
            exit 1
          fi

          SOURCE_SHA="$SOURCE_SHA" \
          VALIDATOR_IMAGE_DIGEST="$VALIDATOR_IMAGE_DIGEST" \
          IMAGE_INSPECT_PATH="$image_inspect" \
          IMAGE_METADATA_PATH="$evidence_dir/image-metadata.json" \
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const [image] = JSON.parse(readFileSync(process.env.IMAGE_INSPECT_PATH, "utf8"));
          const metadata = {
            schema_version: "noema.patch-validator-image-metadata.v1",
            source_revision: process.env.SOURCE_SHA,
            validator_image_digest: process.env.VALIDATOR_IMAGE_DIGEST,
            os: image.Os,
            architecture: image.Architecture,
            user: image.Config.User,
            entrypoint: image.Config.Entrypoint,
            labels: image.Config.Labels ?? {},
          };
          writeFileSync(
            process.env.IMAGE_METADATA_PATH,
            `${JSON.stringify(metadata, null, 2)}\n`,
            { mode: 0o600 },
          );
          NODE

      - name: Prepare realistic exact-head smoke fixture
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/patch-validator-source"
          patch_dir="$RUNNER_TEMP/patch-validator-patch"
          evidence_dir="$RUNNER_TEMP/patch-validator-evidence"
          mkdir -p "$source_dir/src" "$source_dir/test" "$patch_dir" "$evidence_dir"

          cat >"$source_dir/package.json" <<'JSON'
          {
            "name": "noema-patch-validator-smoke",
            "private": true,
            "type": "module"
          }
          JSON
          printf '{}\n' >"$source_dir/package-lock.json"
          printf 'SOURCE_TSCONFIG_MUST_NOT_BE_PARSED\n' >"$source_dir/tsconfig.json"
          cat >"$source_dir/vitest.config.ts" <<'TS'
          throw new Error("source Vitest config must not execute");
          TS
          printf 'export const validatedValue = "old";\n' >"$source_dir/src/value.ts"
          cat >"$source_dir/test/value.test.ts" <<'TS'
          import { describe, expect, it } from "vitest";
          import { validatedValue } from "../src/value.js";

          describe("patch-validator image", () => {
            it("executes the exact patched source", () => {
              expect(validatedValue).toBe("new");
            });
          });
          TS
          cat >"$patch_dir/input.patch" <<'PATCH'
          diff --git a/src/value.ts b/src/value.ts
          index 1111111..2222222 100644
          --- a/src/value.ts
          +++ b/src/value.ts
          @@ -1 +1 @@
          -export const validatedValue = "old";
          +export const validatedValue = "new";
          PATCH
          patch_sha256="$(sha256sum "$patch_dir/input.patch" | cut -d' ' -f1)"
          printf 'SMOKE_SOURCE_DIR=%s\n' "$source_dir" >>"$GITHUB_ENV"
          printf 'SMOKE_PATCH_PATH=%s\n' "$patch_dir/input.patch" >>"$GITHUB_ENV"
          printf 'SMOKE_RESULT_PATH=%s\n' "$evidence_dir/smoke-result.json" >>"$GITHUB_ENV"
          printf 'SMOKE_PATCH_SHA256=%s\n' "$patch_sha256" >>"$GITHUB_ENV"

      - name: Run real no-network, read-only, non-root smoke validation
        shell: bash
        run: |
          set -euo pipefail
          uid="$(id -u)"
          gid="$(id -g)"
          test "$uid" -gt 0
          test "$gid" -gt 0
          docker run --rm \
            --network=none \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --user="$uid:$gid" \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
            --mount "type=bind,src=$SMOKE_SOURCE_DIR,dst=/workspace/source,readonly" \
            --mount "type=bind,src=$(dirname "$SMOKE_PATCH_PATH"),dst=/workspace/patch,readonly" \
            --mount "type=bind,src=$(dirname "$SMOKE_RESULT_PATH"),dst=/workspace/result" \
            -e NOEMA_PATCH_VALIDATOR_SOURCE=/workspace/source \
            -e NOEMA_PATCH_VALIDATOR_PATCH=/workspace/patch/$(basename "$SMOKE_PATCH_PATH") \
            -e NOEMA_PATCH_VALIDATOR_RESULT=/workspace/result/$(basename "$SMOKE_RESULT_PATH") \
            -e NOEMA_PATCH_VALIDATOR_SOURCE_SHA="$SOURCE_SHA" \
            -e NOEMA_PATCH_VALIDATOR_PATCH_SHA256="$SMOKE_PATCH_SHA256" \
            "$IMAGE_TAG"
          test -f "$SMOKE_RESULT_PATH"

      - name: Generate CycloneDX SBOM and vulnerability receipt
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/patch-validator-evidence"
          "$SCANNER_BIN_DIR/syft" "$IMAGE_TAG" -o cyclonedx-json >"$evidence_dir/sbom.cdx.json"
          "$SCANNER_BIN_DIR/grype" "$IMAGE_TAG" -o json >"$evidence_dir/grype-image.json"
          trivy image --format json --severity MEDIUM,HIGH,CRITICAL --ignore-unfixed=false "$IMAGE_TAG" >"$evidence_dir/trivy-image.json"

      - name: Generate static-runtime binary inventory and vulnerability receipt
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/patch-validator-evidence"
          node_binary="$RUNNER_TEMP/patch-validator-node"
          "$SCANNER_BIN_DIR/syft" "file:$node_binary" -o cyclonedx-json >"$evidence_dir/node-runtime-sbom.cdx.json"
          "$SCANNER_BIN_DIR/grype" "sbom:$evidence_dir/node-runtime-sbom.cdx.json" -o json >"$evidence_dir/node-runtime-grype.json"

      - name: Generate embedded static-runtime dependency inventory and vulnerability receipt
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/patch-validator-evidence"
          node_binary="$RUNNER_TEMP/patch-validator-node"
          node --input-type=module scripts/patch-validator-static-runtime-evidence.mjs \
            --binary "$node_binary" \
            --output "$evidence_dir/node-runtime-components.json"
          "$SCANNER_BIN_DIR/grype" "sbom:$evidence_dir/node-runtime-components.json" -o json \
            >"$evidence_dir/node-runtime-components-grype.json"

      - name: Verify exact-source, exact-image, smoke, SBOM, and vulnerability receipts
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module scripts/verify-patch-validator-image-evidence.mjs \
            --source-sha "$SOURCE_SHA" \
            --image-digest "$VALIDATOR_IMAGE_DIGEST" \
            --image-metadata "$RUNNER_TEMP/patch-validator-evidence/image-metadata.json" \
            --smoke-result "$SMOKE_RESULT_PATH" \
            --sbom "$RUNNER_TEMP/patch-validator-evidence/sbom.cdx.json" \
            --grype-image "$RUNNER_TEMP/patch-validator-evidence/grype-image.json" \
            --trivy-image "$RUNNER_TEMP/patch-validator-evidence/trivy-image.json" \
            --node-runtime-sbom "$RUNNER_TEMP/patch-validator-evidence/node-runtime-sbom.cdx.json" \
            --node-runtime-grype "$RUNNER_TEMP/patch-validator-evidence/node-runtime-grype.json" \
            --node-runtime-components "$RUNNER_TEMP/patch-validator-evidence/node-runtime-components.json" \
            --node-runtime-components-grype "$RUNNER_TEMP/patch-validator-evidence/node-runtime-components-grype.json"

      - name: Refuse stale pull-request head after verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          test "$checked_out" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v2 --untracked-files=all --ignored=matching)"
          if [ -n "$PR_NUMBER" ]; then
            live_head="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq ".head.sha")"
            test "$live_head" = "$SOURCE_SHA"
          fi

      - name: Upload bounded verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: patch-validator-image-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/patch-validator-evidence
          if-no-files-found: error
          retention-days: 30
