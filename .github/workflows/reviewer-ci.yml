name: reviewer-ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  reviewer:
    name: reviewer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NOEMA_CODEGRAPH_SANDBOX_SOURCE_IMAGE: gcr.io/distroless/nodejs24-debian13:nonroot
    defaults:
      run:
        working-directory: reviewer
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: setup python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: install (hash-pinned dependencies)
        run: pip install --require-hashes --no-deps -r requirements-ci-hashes.txt

      - name: test (100% line+branch coverage gate)
        run: python -m pytest

      - name: docstring coverage (100% gate)
        run: python -m interrogate -c pyproject.toml noema_reviewer

      - name: install lock-pinned CodeGraph tooling for sandbox smoke test
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: npm ci --prefix ../.github/codegraph --ignore-scripts --omit=dev --no-audit --no-fund

      - name: install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.73.0
          cache: true

      - name: resolve, authenticate, and scan the distroless sandbox image
        run: |
          set -euo pipefail
          docker pull "$NOEMA_CODEGRAPH_SANDBOX_SOURCE_IMAGE"
          resolved="$(docker image inspect "$NOEMA_CODEGRAPH_SANDBOX_SOURCE_IMAGE" --format '{{index .RepoDigests 0}}')"
          case "$resolved" in
            gcr.io/distroless/nodejs24-debian13@sha256:????????????????????????????????????????????????????????????????) ;;
            *) printf '::error::Unexpected CodeGraph sandbox image identity: %s\n' "${resolved:-missing}"; exit 1 ;;
          esac
          cosign verify "$resolved" \
            --certificate-oidc-issuer=https://accounts.google.com \
            --certificate-identity=keyless@distroless.iam.gserviceaccount.com >/dev/null
          trivy image \
            --exit-code 1 \
            --ignore-unfixed \
            --severity MEDIUM,HIGH,CRITICAL \
            --scanners vuln \
            --no-progress \
            "$resolved"
          printf 'NOEMA_CODEGRAPH_SANDBOX_IMAGE=%s\n' "$resolved" >>"$GITHUB_ENV"
          printf 'Verified and scanned CodeGraph sandbox image %s.\n' "$resolved"

      - name: smoke-test the real no-network CodeGraph sandbox
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/noema-codegraph-smoke"
          mkdir -p "$source_root"
          printf 'export const commercialReadiness = true;\n' >"$source_root/example.ts"
          PYTHONPATH=. python - <<'PY'
          import os
          from noema_reviewer.sandbox import DockerCodeGraphRunner

          runner = DockerCodeGraphRunner()
          source_root = os.path.join(os.environ["RUNNER_TEMP"], "noema-codegraph-smoke")
          assert runner(["codegraph", "init", "-i"], source_root) == ""
          assert runner(["codegraph", "sync"], source_root) == ""
          assert runner(["codegraph", "status"], source_root) == ""
          output = runner(
              [
                  "codegraph",
                  "explore",
                  "Review blast radius and focused tests for example.ts",
              ],
              source_root,
          )
          if "Sandbox copied 1 files" not in output or "## codegraph explore" not in output:
              raise SystemExit("CodeGraph sandbox smoke output was incomplete")
          print(output[:2000])
          PY
