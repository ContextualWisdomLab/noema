name: Hourly NVIDIA NIM Product Development

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Evaluate the gate and task contract without running OpenCode
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "47 * * * *"

concurrency:
  group: hourly-nim-product-development-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  propose-product-increment:
    if: github.repository == 'ContextualWisdomLab/noema'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
      pull-requests: write
    env:
      DEFAULT_BRANCH: main
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      OPENCODE_VERSION: "1.17.13"
      OPENCODE_SHA256: 157afa289d1a8d9372de0ce19ac726119b937a1f6b201808d46f06e4e59bb348
      OPENCODE_MODEL_CANDIDATES: >-
        nvidia-nim/nvidia/llama-3.3-nemotron-super-49b-v1.5
        nvidia-nim/nvidia/nemotron-3-super-120b-a12b
        nvidia-nim/deepseek-ai/deepseek-v4-pro
      OPENCODE_RUN_TIMEOUT_SECONDS: "2400"
      MAX_CHANGED_FILES: "40"
      MAX_DIFF_BYTES: "500000"
    steps:
      - name: Enforce zero-open-PR single-flight gate
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NIM_CONFIGURED: ${{ secrets.NVIDIA_NIM_API_KEY != '' }}
        run: |
          set -euo pipefail

          if ! open_prs="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --limit 1 \
              --json number,url
          )"; then
            {
              echo "dispatch=false"
              echo "reason=pull_request_inventory_unavailable"
            } >>"$GITHUB_OUTPUT"
            echo "Pull-request inventory was unavailable; development failed closed." \
              >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$(jq 'length' <<<"$open_prs")" -gt 0 ]; then
            {
              echo "dispatch=false"
              echo "reason=open_pull_request"
            } >>"$GITHUB_OUTPUT"
            echo "An open pull request exists; exact-head PR governance owns this hour." \
              >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$NIM_CONFIGURED" != "true" ] && [ "$DRY_RUN" != "true" ]; then
            {
              echo "dispatch=false"
              echo "reason=nim_api_key_unavailable"
            } >>"$GITHUB_OUTPUT"
            echo "Autonomous development is disabled because the dedicated NVIDIA NIM secret is unavailable." \
              >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "dispatch=true"
            if [ "$NIM_CONFIGURED" = "true" ]; then
              echo "reason=ready"
            else
              echo "reason=ready_dry_run_without_nim"
            fi
          } >>"$GITHUB_OUTPUT"

      - name: Prepare bounded commercial-quality task
        if: steps.gate.outputs.dispatch == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat >"$RUNNER_TEMP/noema-agent-prompt.md" <<'PROMPT'
          Continue commercial-quality product development for ContextualWisdomLab/noema.

          Begin by reading AGENTS.md, README.md, CHANGELOG.md, package.json,
          the architecture, threat model, operations and doctoring documents, open issues,
          recent merged pull requests, current source, tests, workflows, release evidence,
          and buyer due-diligence material. Select the single highest-value buyer-visible
          product, reliability, interoperability, security, evaluation, accessibility,
          supportability, or operations gap that can be completed as exactly one bounded
          pull request. Do not create another repository.

          Keep Noema independently deployable and preserve its modular MSA role with
          ContextualWisdomLab/.github, naruon, contextual-orchestrator, and other CWL
          services. Keep interfaces explicit and replaceable. Use or improve
          contextual-orchestrator for every new product-runtime LLM path. Do not alter
          the existing reviewer-agent credential names, trust boundary, or provider route.

          Work test-first: add one realistic executable regression or product contract,
          run it, and record the expected failure before implementation. Then make the
          smallest coherent change that closes the selected gap. Tests must exercise
          realistic Noema traffic, operational, security, provenance, or buyer workflows,
          including adversarial and failure cases where applicable. Maintain 100% production
          statement and branch coverage plus 100% production function coverage. When reviewer
          Python changes, maintain 100% line and branch coverage and 100% docstring coverage.
          Public modules, classes, functions, methods, properties, inputs, outputs, errors,
          and trust boundaries must be understandable to a beginner without reverse-engineering.

          Where behavior is ambiguous, use current authoritative international standards,
          primary official documentation, or peer-reviewed research. Record sources and
          rationale in docs/doctoring with APA 7 references, and distinguish measured facts,
          source-supported claims, project decisions, assumptions, and inference. Use Figma
          or Product Design only when a real user-facing visual flow materially benefits.

          Preserve standalone use and modular MSA integration. If a database boundary is
          introduced, every new object must use a descriptive two-word-or-longer snake_case
          name. Do not add skipped, ignored, quarantined, or weakened release-gate tests.
          Run focused tests and npm run release:verify. Update CHANGELOG.md and all affected
          product, architecture, security, operations, API, support, and buyer documentation.

          Follow Semantic Versioning. Change the package version only when the integrated
          repository is genuinely release-ready and all immutable release, deployment,
          production KPI, and governance requirements can be satisfied. Otherwise leave the
          version unchanged and explain why in the pull request.

          Do not merge. Do not publish. Do not release. Do not deploy. Do not fabricate
          production KPI, customer, paid-pilot, revenue, transfer, attestation, or acquisition
          evidence. Do not weaken branch protection, independent review, exact-head Checks,
          security scanning, coverage, docstring, sandbox, credential, or fail-closed gates.
          Do not make unrelated refactors.

          Leave the working tree with one bounded increment and write PR_MESSAGE.md at the
          repository root. Put the pull-request title on the first line, then a body containing
          the product gap, design, RED-to-GREEN evidence, complete verification commands and
          results, APA 7 sources where applicable, version decision, and explicit residual risk.
          A separate trusted step will verify and package the working tree. The existing
          review → repair → exact-head Checks → merge loop retains every final decision.
          PROMPT

      - name: Record dry-run task contract
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN == 'true'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Dry run: the zero-open-PR gate permits one bounded OpenCode proposal."
            echo
            cat "$RUNNER_TEMP/noema-agent-prompt.md"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Check out trusted default-branch source without persisted credentials
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false

      - name: Install repository dependencies
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        shell: bash
        run: npm ci

      - name: Install checksum-pinned OpenCode CLI
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/opencode-linux-x64.tar.gz"
          install_dir="${HOME}/.opencode/bin"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location \
            --proto '=https' \
            --connect-timeout 10 \
            --max-time 120 \
            --output "$archive" \
            "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"
          printf '%s  %s\n' "$OPENCODE_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          install -m 0755 "${RUNNER_TEMP}/opencode" "${install_dir}/opencode"
          "${install_dir}/opencode" --version
          echo "$install_dir" >>"$GITHUB_PATH"

      - name: Configure OpenCode for NVIDIA NIM only
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat >"$GITHUB_WORKSPACE/opencode.json" <<'CONFIG'
          {
            "$schema": "https://opencode.ai/config.json",
            "share": "disabled",
            "autoupdate": false,
            "lsp": false,
            "mcp": {},
            "enabled_providers": ["nvidia-nim"],
            "model": "nvidia-nim/nvidia/llama-3.3-nemotron-super-49b-v1.5",
            "small_model": "nvidia-nim/meta/llama-3.3-70b-instruct",
            "permission": {
              "*": "allow",
              "external_directory": "deny",
              "task": "deny",
              "question": "deny",
              "webfetch": "deny",
              "websearch": "deny",
              "bash": {
                "*": "allow",
                "curl *": "deny",
                "wget *": "deny",
                "ssh *": "deny",
                "scp *": "deny",
                "nc *": "deny",
                "ncat *": "deny",
                "socat *": "deny",
                "git clone *": "deny",
                "git fetch *": "deny",
                "git pull *": "deny",
                "git commit *": "deny",
                "git push *": "deny",
                "git tag *": "deny",
                "git remote *": "deny",
                "gh *": "deny"
              }
            },
            "provider": {
              "nvidia-nim": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "NVIDIA NIM",
                "options": {
                  "baseURL": "https://integrate.api.nvidia.com/v1",
                  "apiKey": "{env:NVIDIA_API_KEY}"
                },
                "models": {
                  "nvidia/llama-3.3-nemotron-super-49b-v1.5": {
                    "name": "NVIDIA Llama 3.3 Nemotron Super 49B v1.5",
                    "tool_call": true,
                    "limit": {"context": 131072, "output": 8192}
                  },
                  "nvidia/nemotron-3-super-120b-a12b": {
                    "name": "NVIDIA Nemotron 3 Super 120B",
                    "tool_call": true,
                    "limit": {"context": 131072, "output": 8192}
                  },
                  "deepseek-ai/deepseek-v4-pro": {
                    "name": "DeepSeek V4 Pro through NVIDIA NIM",
                    "tool_call": true,
                    "limit": {"context": 131072, "output": 8192}
                  },
                  "meta/llama-3.3-70b-instruct": {
                    "name": "Meta Llama 3.3 70B Instruct through NVIDIA NIM",
                    "tool_call": true,
                    "limit": {"context": 131072, "output": 8192}
                  }
                }
              }
            }
          }
          CONFIG
          echo "/opencode.json" >>"$GITHUB_WORKSPACE/.git/info/exclude"

      - name: Run bounded NVIDIA NIM model fallback
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          OPENCODE_DISABLE_AUTOUPDATE: "true"
          OPENCODE_CONFIG: ${{ github.workspace }}/opencode.json
          XDG_CONFIG_HOME: ${{ runner.temp }}/opencode-config
          XDG_CACHE_HOME: ${{ runner.temp }}/opencode-cache
        run: |
          set -euo pipefail
          prompt="$(cat "$RUNNER_TEMP/noema-agent-prompt.md")"
          status=1

          for model in $OPENCODE_MODEL_CANDIDATES; do
            echo "::group::OpenCode candidate $model"
            if timeout --kill-after=30s "${OPENCODE_RUN_TIMEOUT_SECONDS}s" \
              env -u GH_TOKEN -u GITHUB_TOKEN \
              -u REPOSITORY_TOKEN \
              -u ACTIONS_ID_TOKEN_REQUEST_TOKEN \
              -u ACTIONS_ID_TOKEN_REQUEST_URL \
              opencode run "$prompt" --agent build --model "$model"; then
              status=0
              echo "::endgroup::"
              echo "OpenCode completed one proposal with \`$model\`." \
                >>"$GITHUB_STEP_SUMMARY"
              break
            fi

            echo "::endgroup::"
            echo "::warning::Candidate $model failed; discarding its partial working tree."
            git -C "$GITHUB_WORKSPACE" reset --hard HEAD
            git -C "$GITHUB_WORKSPACE" clean -fd
          done

          if [ "$status" -ne 0 ]; then
            echo "::error::Every NVIDIA NIM candidate failed; no branch or pull request was created."
            exit 1
          fi

      - name: Verify and bound the proposed increment without GitHub credentials
        id: proposal
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -f opencode.json

          if [ -z "$(git status --porcelain)" ]; then
            echo "has_changes=false" >>"$GITHUB_OUTPUT"
            echo "OpenCode produced no working-tree change; this hour is a no-op." \
              >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          npm run release:verify
          git add -A
          git diff --cached --check

          if git diff --cached --summary | grep -q 'mode 120000'; then
            echo "::error::A proposed symlink (mode 120000) is outside the bounded agent contract."
            exit 1
          fi

          changed_files="$(git diff --cached --name-only -z | node -e '
            const chunks = [];
            process.stdin.on("data", (chunk) => chunks.push(chunk));
            process.stdin.on("end", () => {
              const names = Buffer.concat(chunks).toString("utf8").split("\\0").filter(Boolean);
              process.stdout.write(String(names.length));
            });
          ')"
          diff_bytes="$(git diff --cached --binary | wc -c | tr -d '[:space:]')"

          if [ "$changed_files" -gt "$MAX_CHANGED_FILES" ]; then
            echo "::error::Proposal changes $changed_files files; limit is $MAX_CHANGED_FILES."
            exit 1
          fi
          if [ "$diff_bytes" -gt "$MAX_DIFF_BYTES" ]; then
            echo "::error::Proposal diff is $diff_bytes bytes; limit is $MAX_DIFF_BYTES."
            exit 1
          fi

          {
            echo "has_changes=true"
            echo "changed_files=$changed_files"
            echo "diff_bytes=$diff_bytes"
          } >>"$GITHUB_OUTPUT"

      - name: Package exactly one pull request in a trusted step
        if: steps.proposal.outputs.has_changes == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          title="Noema autonomous commercial increment"
          body_file="$RUNNER_TEMP/pr-body.md"
          if [ -f PR_MESSAGE.md ]; then
            candidate_title="$(head -n 1 PR_MESSAGE.md | sed 's/^#\+ *//')"
            if [ -n "$candidate_title" ]; then
              title="$candidate_title"
            fi
            tail -n +2 PR_MESSAGE.md >"$body_file"
            rm -f PR_MESSAGE.md
          else
            cat >"$body_file" <<'BODY'
          OpenCode produced one bounded NVIDIA NIM increment. Review the diff,
          CHANGELOG.md, doctoring, and exact-head verification before merge.
          BODY
          fi

          git add -A
          git diff --cached --check
          branch="nim-agent/product-dev-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "$title"
          gh auth setup-git
          git push origin "HEAD:refs/heads/${branch}"

          pr_url="$(
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$DEFAULT_BRANCH" \
              --head "$branch" \
              --title "$title" \
              --body-file "$body_file"
          )"
          {
            echo "Opened bounded pull request: $pr_url"
            echo "hourly-commercial-readiness owns review, repair, exact-head revalidation, and merge."
          } >>"$GITHUB_STEP_SUMMARY"
