name: Apply final candidate cleanup repair

on:
  push:
    branches:
      - feat/hourly-nim-opencode-development
    paths:
      - .github/workflows/apply-final-candidate-cleanup.yml

concurrency:
  group: apply-final-candidate-cleanup-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repair_and_verify:
    if: >-
      github.repository == 'ContextualWisdomLab/noema'
      && github.ref == 'refs/heads/feat/hourly-nim-opencode-development'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload_repair.outputs.artifact-id }}
      patch_sha256: ${{ steps.package_repair.outputs.patch_sha256 }}
    steps:
      - name: Check out exact repair trigger head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Apply inter-candidate cleanup control flow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected exactly one {label} anchor, found {count}"
                  )
              file_path.write_text(text.replace(old, new), encoding="utf-8")

          workflow_path = ".github/workflows/hourly-product-development.yml"
          replace_once(
              workflow_path,
              "# Three bounded candidates, termination grace, cleanup reinstalls, setup, and diagnostics fit in 55 minutes.",
              "# Three candidate budgets and two inter-candidate cleanup reinstalls fit in 55 minutes.",
              "budget comment",
          )
          replace_once(
              workflow_path,
              '''          status=1
          cleanup_failed=false

          for model in $OPENCODE_MODEL_CANDIDATES; do
            echo "::group::OpenCode candidate $model"''',
              '''          status=1
          cleanup_failed=false
          read -r -a model_candidates <<<"$OPENCODE_MODEL_CANDIDATES"
          candidate_count=${#model_candidates[@]}

          for ((candidate_index = 0; candidate_index < candidate_count; candidate_index++)); do
            model="${model_candidates[$candidate_index]}"
            echo "::group::OpenCode candidate $model"''',
              "candidate loop",
          )
          replace_once(
              workflow_path,
              '''            echo "::endgroup::"
            echo "::warning::Candidate $model failed; discarding its partial working tree."
            git -C "$GITHUB_WORKSPACE" reset --hard HEAD''',
              '''            echo "::endgroup::"
            if [ "$candidate_index" -eq $((candidate_count - 1)) ]; then
              break
            fi

            echo "::warning::Candidate $model failed; discarding its partial working tree before the next candidate."
            git -C "$GITHUB_WORKSPACE" reset --hard HEAD''',
              "final candidate guard",
          )

          test_path = "test/hourly-product-development-workflow.test.ts"
          replace_once(
              test_path,
              '''    expect(
      candidateCount * (
        candidateSeconds
        + candidateGraceSeconds
        + reinstallSeconds
        + reinstallGraceSeconds
      ) + boundedSetupAndDiagnosticReserve,
    ).toBeLessThanOrEqual(jobSeconds);''',
              '''    const interCandidateCleanupCount = Math.max(candidateCount - 1, 0);

    expect(interCandidateCleanupCount).toBe(2);
    expect(
      candidateCount * (candidateSeconds + candidateGraceSeconds)
      + interCandidateCleanupCount * (
        reinstallSeconds + reinstallGraceSeconds
      )
      + boundedSetupAndDiagnosticReserve,
    ).toBeLessThanOrEqual(jobSeconds);''',
              "budget arithmetic",
          )

          operations_path = "docs/operations/hourly-product-development.md"
          replace_once(
              operations_path,
              "**후보별 900초**와 강제 종료 유예 30초를 적용합니다. 각 실패 후보의 의존성 재설치는 60초와 강제 종료 유예 10초로 별도 제한합니다. 최악의 경우 세 후보에 대해 `3 × (900 + 30 + 60 + 10) = 3,000초`를 사용하고, 최초 설정과 최종 진단에 300초를 남겨 총 3,300초가 55분 제안 job에 정확히 들어갑니다.",
              "**후보별 900초**와 강제 종료 유예 30초를 적용합니다. 다음 후보가 남아 있을 때만 의존성 재설치를 60초와 강제 종료 유예 10초로 별도 제한합니다. 최악의 경우 세 후보 실행·종료에 `3 × (900 + 30) = 2,790초`, 후보 사이 두 번의 재설치에 `2 × (60 + 10) = 140초`를 사용합니다. 최초 설정과 최종 진단에 300초를 예약하면 총 3,230초이며, 3,300초인 55분 제안 job 예산 안에 70초의 명시적 여유를 남깁니다.",
              "operations budget",
          )
          replace_once(
              operations_path,
              "후보 실패 시 `git reset --hard HEAD`, `git clean -fdx`를 실행하고 `npm ci --ignore-scripts`를 명시적 60초 제한 안에서 재실행한 뒤에만 다음 후보로 폴백합니다. 재설치가 실패하거나 제한 시간을 넘기면 의존성 트리가 완전하다고 증명할 수 없으므로 즉시 실패 폐쇄하고 이후 모델 후보를 실행하지 않습니다. 이전 후보의 부분 변경이나 생성 파일이 다음 후보의 입력을 오염시키지 않도록 하며, 폴백은 가용성 제어일 뿐 품질 증거가 아닙니다. 성공한 제안도 독립 검증과 리뷰를 통과해야 합니다.",
              "다음 후보가 남아 있는 상태에서 후보가 실패하면 `git reset --hard HEAD`, `git clean -fdx`를 실행하고 `npm ci --ignore-scripts`를 명시적 60초 제한 안에서 재실행한 뒤에만 폴백합니다. 마지막 후보 실패에는 다음 후보가 없으므로 reset·clean·재설치를 실행하지 않고 곧바로 안정적인 전체 후보 실패 진단으로 종료합니다. 후보 사이 재설치가 실패하거나 제한 시간을 넘기면 의존성 트리가 완전하다고 증명할 수 없으므로 즉시 실패 폐쇄하고 이후 모델 후보를 실행하지 않습니다. 이전 후보의 부분 변경이나 생성 파일이 다음 후보의 입력을 오염시키지 않도록 하며, 폴백은 가용성 제어일 뿐 품질 증거가 아닙니다. 성공한 제안도 독립 검증과 리뷰를 통과해야 합니다.",
              "operations control flow",
          )

          plan_path = "docs/superpowers/plans/2026-08-05-hourly-nim-opencode-development.md"
          replace_once(
              plan_path,
              "- [x] Run ordered NIM fallback with a 900-second candidate timeout, 30-second candidate kill grace, hard reset, ignored/untracked cleanup, and a separately bounded 60-second clean reinstall with 10-second kill grace after each failed candidate. Fail closed and stop the fallback chain when reinstall fails or times out, so no later candidate runs with an incomplete dependency tree.",
              "- [x] Run ordered NIM fallback with a 900-second candidate timeout and 30-second candidate kill grace. Only between failed candidates, hard reset, remove ignored/untracked files, and run a separately bounded 60-second clean reinstall with 10-second kill grace. Skip cleanup after the final candidate so its failure reaches the stable all-candidates-failed diagnostic; fail closed and stop the chain when an inter-candidate reinstall fails or times out.",
              "plan control flow",
          )

          design_path = "docs/superpowers/specs/2026-08-05-hourly-nim-opencode-development-design.md"
          replace_once(
              design_path,
              "Each candidate has a 900-second execution timeout and a separate 30-second forced-termination grace period. Candidate failure causes hard reset and ignored/untracked cleanup, followed by a dependency reinstall with its own 60-second timeout and 10-second kill grace. The fallback proceeds only after that reinstall succeeds. A failed or timed-out reinstall fails closed immediately, prevents every later candidate from running with an incomplete dependency tree, and creates no artifact, branch, or PR. The conservative proposer budget is `3 × (900 + 30 + 60 + 10) + 300 = 3,300 seconds`, matching the 55-minute job limit.",
              "Each candidate has a 900-second execution timeout and a separate 30-second forced-termination grace period. When another candidate remains, failure causes hard reset and ignored/untracked cleanup, followed by a dependency reinstall with its own 60-second timeout and 10-second kill grace. The fallback proceeds only after that inter-candidate reinstall succeeds. Final-candidate failure skips cleanup and reaches the stable all-candidates-failed diagnostic because no later candidate can consume the tree. A failed or timed-out inter-candidate reinstall fails closed immediately, prevents every later candidate from running with an incomplete dependency tree, and creates no artifact, branch, or PR. The conservative proposer budget is `3 × (900 + 30) + 2 × (60 + 10) + 300 = 3,230 seconds`, leaving 70 seconds inside the 55-minute job limit.",
              "design control flow",
          )
          PY
          rm -f .github/workflows/apply-final-candidate-cleanup.yml

      - name: Verify complete release gate
        run: npm run release:verify

      - name: Package verified repair patch
        id: package_repair
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          patch="$RUNNER_TEMP/final-candidate-cleanup.patch"
          git diff --cached --binary --full-index >"$patch"
          patch_sha256="$(sha256sum "$patch" | awk '{print $1}')"
          echo "patch_sha256=$patch_sha256" >>"$GITHUB_OUTPUT"

      - name: Upload verified repair patch
        id: upload_repair
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-candidate-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/final-candidate-cleanup.patch
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish_repair:
    needs: repair_and_verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out exact repair trigger head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm

      - name: Download exact repair artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.repair_and_verify.outputs.artifact_id }}
          path: ${{ runner.temp }}/repair

      - name: Verify, apply, and re-run release gate
        shell: bash
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/repair/final-candidate-cleanup.patch"
          expected_sha="${{ needs.repair_and_verify.outputs.patch_sha256 }}"
          printf '%s  %s\n' "$expected_sha" "$patch" | sha256sum -c -
          git apply --check --binary "$patch"
          git apply --index --binary "$patch"
          git diff --cached --check
          npm ci
          npm run release:verify

      - name: Mint repository-scoped Maintainer App token
        id: maintainer_app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.NOEMA_MAINTAINER_APP_CLIENT_ID }}
          private-key: ${{ secrets.NOEMA_MAINTAINER_APP_PRIVATE_KEY }}
          owner: ContextualWisdomLab
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-metadata: read
          permission-pull-requests: write

      - name: Commit and push exact repair
        shell: bash
        env:
          GH_TOKEN: ${{ steps.maintainer_app.outputs.token }}
        run: |
          set -euo pipefail
          live_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/feat/hourly-nim-opencode-development" --jq '.object.sha')"
          if [ "$live_head" != "$GITHUB_SHA" ]; then
            echo "::error::Repair branch advanced after verification."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -c core.hooksPath=/dev/null commit -m "fix(automation): skip cleanup after final candidate"
          gh auth setup-git
          git push origin "HEAD:refs/heads/feat/hourly-nim-opencode-development"
