name: Repair PR 65 exact source snapshot

on:
  push:
    branches:
      - feat/quarantined-patch-validation
    paths:
      - .github/workflows/repair-pr65-source-snapshot.yml

permissions:
  contents: read

concurrency:
  group: repair-pr65-exact-source-snapshot
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair-and-verify:
    if: >-
      github.repository == 'ContextualWisdomLab/noema' &&
      github.actor == 'seonghobae' &&
      github.ref == 'refs/heads/feat/quarantined-patch-validation'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact repair trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: reviewer/requirements-ci-hashes.txt

      - name: Install exact reviewer dependencies
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --no-deps -r reviewer/requirements-ci-hashes.txt

      - name: Prove the post-preflight mutation regression is red
        shell: bash --noprofile --norc {0}
        run: |
          set +e
          (
            cd reviewer
            python -m pytest -q \
              tests/test_patch_validation_source_integrity.py::test_runner_mounts_committed_snapshot_after_post_preflight_mutation
          )
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::The source-mutation regression unexpectedly passed before repair."
            exit 1
          fi
          printf 'Observed expected pre-repair failure (exit %s).\n' "$status"

      - name: Apply exact-commit snapshot repair
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: python reviewer/scripts/repair_pr65_source_snapshot.py

      - name: Verify complete reviewer contract
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          cd reviewer
          python -m pytest
          python -m interrogate -c pyproject.toml noema_reviewer
          python -m compileall -q noema_reviewer tests

      - name: Remove one-shot repair assets
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          rm -f .github/workflows/repair-pr65-source-snapshot.yml
          rm -f reviewer/scripts/repair_pr65_source_snapshot.py
          test ! -e .github/workflows/repair-pr65-source-snapshot.yml
          test ! -e reviewer/scripts/repair_pr65_source_snapshot.py

      - name: Commit verified repair
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          git status --short
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo '::error::Repair produced no verified changes.'
            exit 1
          fi
          git commit -m 'fix(sandbox): materialize exact source commit before validation'
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${GITHUB_REF_NAME}"
