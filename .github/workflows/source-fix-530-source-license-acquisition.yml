name: One-shot PR 530 source-license acquisition repair

on:
  push:
    branches:
      - docs/readme-product-refresh-20260901
    paths:
      - .github/workflows/source-fix-530-source-license-acquisition.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Repair source-only licensing gate and README transport contract
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: docs/readme-product-refresh-20260901
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git clone --filter=blob:none "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm ci

          python3 - <<'PY'
          from pathlib import Path

          path = Path("test/acquisition-transfer-rights.test.ts")
          text = path.read_text(encoding="utf-8")
          marker = '\n  it("accepts an OCI license annotation that exactly matches the approved SPDX expression", () => {'
          tests = r'''

            it("accepts source-only SPDX rights without npm package metadata when package publication is disabled", () => {
              const root = mkdtempSync(join(tmpdir(), "noema-transfer-rights-source-only-"));
              temporaryRoots.push(root);
              writeRequiredAcquisitionDocs(root);
              const licensingIp = validSpdxLicensingIp(root);
              writeFixture(
                root,
                "package.json",
                `${JSON.stringify({ name: "noema", private: true }, null, 2)}\n`,
              );
              delete licensingIp.package_metadata;
              const transferEvidencePath = writeTransferEvidence(root, licensingIp);

              const { result, transferCheck } = runReportOnlyAudit(root, transferEvidencePath);

              expect(result.status, result.stderr || result.stdout).toBe(0);
              expect(transferCheck).toBeDefined();
              expect(transferCheck.pass).toBe(true);
              expect(transferCheck.details.licensingIpFailures).toEqual([]);
            });

            it("still requires exact package license metadata when npm package publication is enabled", () => {
              const root = mkdtempSync(join(tmpdir(), "noema-transfer-rights-package-distribution-"));
              temporaryRoots.push(root);
              writeRequiredAcquisitionDocs(root);
              const licensingIp = validSpdxLicensingIp(root);
              writeFixture(
                root,
                "package.json",
                `${JSON.stringify({ name: "noema", private: false }, null, 2)}\n`,
              );
              delete licensingIp.package_metadata;
              const transferEvidencePath = writeTransferEvidence(root, licensingIp);

              const { result, transferCheck } = runReportOnlyAudit(root, transferEvidencePath);

              expect(result.status, result.stderr || result.stdout).toBe(0);
              expect(transferCheck).toBeDefined();
              expect(transferCheck.pass).toBe(false);
              expect(transferCheck.details.licensingIpFailures).toEqual(
                expect.arrayContaining([
                  "package.json license field required for distributed package",
                  "licensing_ip.package_metadata.license required for distributed package",
                ]),
              );
            });
          '''
          if text.count(marker) != 1:
              raise SystemExit("acquisition transfer-rights insertion marker changed unexpectedly")
          path.write_text(text.replace(marker, tests + marker, 1), encoding="utf-8")
          PY

          set +e
          npx vitest run test/acquisition-transfer-rights.test.ts > /tmp/red.log 2>&1
          red_status=$?
          set -e
          cat /tmp/red.log
          if [ "$red_status" -eq 0 ]; then
            echo "expected source-only package-metadata regression to fail before repair" >&2
            exit 1
          fi
          grep -q "accepts source-only SPDX rights without npm package metadata" /tmp/red.log

          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/acquisition-readiness-audit.mjs")
          text = path.read_text(encoding="utf-8")
          old = '''  const packageJson = readJson("package.json");
            const packageLicense = packageJson.ok && isNonEmptyString(packageJson.value?.license)
              ? packageJson.value.license.trim()
              : "";
            const declaredPackageLicense = isNonEmptyString(licensing.package_metadata?.license)
              ? licensing.package_metadata.license.trim()
              : "";
            if (!packageLicense) failures.push("package.json license field required");
            if (!declaredPackageLicense) {
              failures.push("licensing_ip.package_metadata.license required");
            } else if (packageLicense && declaredPackageLicense !== packageLicense) {
              failures.push("package_metadata.license must match package.json license exactly");
            }

            if (decision && typeof decision === "object" && !Array.isArray(decision)) {
              if (
                decision.type === "spdx"
                && isNonEmptyString(decision.license_expression)
                && packageLicense
                && packageLicense !== decision.license_expression.trim()
              ) {
                failures.push("package.json license must match the owner-approved SPDX expression");
              }
              if (
                decision.type === "custom"
                && rights
                && allowedRightsPaths.has(rights.path)
                && packageLicense
                && packageLicense !== `SEE LICENSE IN ${rights.path}`
              ) {
                failures.push("custom rights decision requires package.json SEE LICENSE IN metadata");
              }
              if (decision.type === "unlicensed" && packageLicense && packageLicense !== "UNLICENSED") {
                failures.push("unlicensed decision requires package.json license=UNLICENSED");
              }
            }
          '''
          new = '''  const packageJson = readJson("package.json");
            if (!packageJson.ok) {
              failures.push("package.json must be readable to determine package distribution boundary");
            }
            const packageDistributionEnabled = packageJson.ok && packageJson.value?.private !== true;
            const packageLicense = packageJson.ok && isNonEmptyString(packageJson.value?.license)
              ? packageJson.value.license.trim()
              : "";
            const declaredPackageLicense = isNonEmptyString(licensing.package_metadata?.license)
              ? licensing.package_metadata.license.trim()
              : "";

            if (packageDistributionEnabled) {
              if (!packageLicense) failures.push("package.json license field required for distributed package");
              if (!declaredPackageLicense) {
                failures.push("licensing_ip.package_metadata.license required for distributed package");
              } else if (packageLicense && declaredPackageLicense !== packageLicense) {
                failures.push("package_metadata.license must match package.json license exactly");
              }

              if (decision && typeof decision === "object" && !Array.isArray(decision)) {
                if (
                  decision.type === "spdx"
                  && isNonEmptyString(decision.license_expression)
                  && packageLicense
                  && packageLicense !== decision.license_expression.trim()
                ) {
                  failures.push("package.json license must match the owner-approved SPDX expression");
                }
                if (
                  decision.type === "custom"
                  && rights
                  && allowedRightsPaths.has(rights.path)
                  && packageLicense
                  && packageLicense !== `SEE LICENSE IN ${rights.path}`
                ) {
                  failures.push("custom rights decision requires package.json SEE LICENSE IN metadata");
                }
                if (decision.type === "unlicensed" && packageLicense && packageLicense !== "UNLICENSED") {
                  failures.push("unlicensed decision requires package.json license=UNLICENSED");
                }
              }
            }
          '''
          if text.count(old) != 1:
              raise SystemExit("licensing package-metadata gate changed unexpectedly")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = Path("test/acquisition-transfer-rights.test.ts")
          text = path.read_text(encoding="utf-8")
          helper_old = '      private: true,\n      license: "SEE LICENSE IN RIGHTS.md",'
          helper_new = '      private: false,\n      license: "SEE LICENSE IN RIGHTS.md",'
          if text.count(helper_old) != 1:
              raise SystemExit("custom package-distribution fixture changed unexpectedly")
          text = text.replace(helper_old, helper_new, 1)
          helper_old = '      private: true,\n      license: "Apache-2.0",'
          helper_new = '      private: false,\n      license: "Apache-2.0",'
          if text.count(helper_old) != 1:
              raise SystemExit("SPDX package-distribution fixture changed unexpectedly")
          text = text.replace(helper_old, helper_new, 1)
          mismatch_old = '        private: true,\n        license: "UNLICENSED",'
          mismatch_new = '        private: false,\n        license: "UNLICENSED",'
          if text.count(mismatch_old) != 1:
              raise SystemExit("package-mismatch fixture changed unexpectedly")
          path.write_text(text.replace(mismatch_old, mismatch_new, 1), encoding="utf-8")

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          old = "After deployment, configure `NOEMA_EXCHANGE_URL` in the trusted central workflow or consuming deployment to point at the Worker `/exchange` endpoint."
          new = "After deployment, configure `NOEMA_EXCHANGE_URL` in the trusted central workflow or consuming deployment to an `https://` Worker `/exchange` endpoint. Plain `http://` is permitted only for loopback testing (`127.0.0.1`, `[::1]`, or `localhost`); never send production credentials over cleartext transport."
          if text.count(old) != 1:
              raise SystemExit("README exchange transport guidance changed unexpectedly")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = Path("docs/LICENSING_AND_IP_TRANSFER.md")
          text = path.read_text(encoding="utf-8")
          old = 'For current Noema, `"private": true` plus absence of an npm distribution channel means root `LICENSE` is the controlling source grant. `private` itself is still only a publication safeguard; it neither grants nor narrows Apache-2.0 source rights.'
          new = old + ' The executable acquisition gate follows the same boundary: an explicitly private package may omit `licensing_ip.package_metadata`, while any package not explicitly marked private is treated as distributable and must provide package and evidence metadata that exactly match the approved rights posture.'
          if text.count(old) != 1:
              raise SystemExit("licensing package boundary paragraph changed unexpectedly")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = Path("docs/product-technical-gap-baseline.md")
          text = path.read_text(encoding="utf-8")
          old = '| npm package boundary | `package.json` remains `private` and the npm package is not a product distribution channel; no package-publication license field is introduced | root `LICENSE` controls source rights without forcing unrelated lockfile metadata churn |'
          new = '| npm package boundary | `package.json` remains explicitly `private` and the npm package is not a product distribution channel; no package-publication license field is introduced | root `LICENSE` controls source rights without forcing unrelated lockfile metadata churn, and acquisition readiness requires package license metadata only when the manifest does not explicitly disable package distribution |'
          if text.count(old) != 1:
              raise SystemExit("product baseline npm boundary row changed unexpectedly")
          text = text.replace(old, new, 1)
          old = '| Source licensing | Noema-owned source uses one explicit commercial-friendly outbound grant; package publication and dependencies retain independent terms | PR #530 `LICENSE`, root `README.md`, `docs/LICENSING_AND_IP_TRANSFER.md`; private `package.json` remains non-distribution metadata | exact-head repository/doc/test consistency | protected integration plus third-party/tooling policy resolution | Apache-2.0 candidate truth on #530; not yet protected truth |'
          new = '| Source licensing | Noema-owned source uses one explicit commercial-friendly outbound grant; package publication and dependencies retain independent terms | PR #530 `LICENSE`, root `README.md`, `docs/LICENSING_AND_IP_TRANSFER.md`; private `package.json` remains non-distribution metadata | exact-head repository/doc consistency plus acquisition transfer-rights regressions for source-only and distributed-package boundaries | protected integration plus third-party/tooling policy resolution | Apache-2.0 candidate truth on #530; not yet protected truth |'
          if text.count(old) != 1:
              raise SystemExit("product baseline source licensing row changed unexpectedly")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          marker = "## Unreleased\n"
          entry = "- acquisition licensing validation now separates source rights from npm package publication: explicit `private: true` source-only packages may omit npm license metadata, while distributable packages still require exact manifest/evidence alignment; README deployment guidance now states the existing HTTPS-only non-loopback exchange transport boundary.\n"
          if text.count(marker) != 1:
              raise SystemExit("Unreleased changelog marker changed unexpectedly")
          if entry not in text:
              text = text.replace(marker, marker + entry, 1)
          path.write_text(text, encoding="utf-8")
          PY

          npx vitest run test/acquisition-transfer-rights.test.ts
          npm run typecheck
          npm test
          git diff --check

          git rm .github/workflows/source-fix-530-source-license-acquisition.yml
          git add \
            scripts/acquisition-readiness-audit.mjs \
            test/acquisition-transfer-rights.test.ts \
            README.md \
            docs/LICENSING_AND_IP_TRANSFER.md \
            docs/product-technical-gap-baseline.md \
            CHANGELOG.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(acquisition): separate source and package license evidence"
          git push origin "HEAD:${TARGET_BRANCH}"