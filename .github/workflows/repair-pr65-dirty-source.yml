name: Repair PR 65 dirty source boundary

on:
  push:
    branches:
      - feat/quarantined-patch-validation
    paths:
      - .github/workflows/repair-pr65-dirty-source.yml

permissions:
  contents: write

concurrency:
  group: repair-pr65-dirty-source
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/noema' &&
      github.ref == 'refs/heads/feat/quarantined-patch-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact repair trigger
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify immutable repair parent
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD^)" = "b1b00fa2dc97335b5a7192e13f34fb46565bbd0a"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Apply minimal clean-worktree preflight
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("reviewer/noema_reviewer/patch_validation.py")
          text = path.read_text(encoding="utf-8")
          old = '''    observed_head_sha = completed.stdout.strip()
    if observed_head_sha != expected_head_sha:
        raise RuntimeError(
            "source HEAD does not match the exact validation request"
        )
'''
          new = '''    observed_head_sha = completed.stdout.strip()
    if observed_head_sha != expected_head_sha:
        raise RuntimeError(
            "source HEAD does not match the exact validation request"
        )
    worktree = subprocess.run(
        [
            TRUSTED_GIT_EXECUTABLE,
            "-C",
            str(source),
            "status",
            "--porcelain=v1",
            "--untracked-files=all",
            "-z",
        ],
        text=True,
        stdout=subprocess.PIPE,
        stderr=subprocess.DEVNULL,
        check=False,
        shell=False,
        timeout=30,
        env={
            "PATH": str(Path(TRUSTED_GIT_EXECUTABLE).parent),
            "GIT_CONFIG_NOSYSTEM": "1",
            "GIT_CONFIG_GLOBAL": os.devnull,
        },
    )
    if worktree.returncode != 0 or worktree.stdout:
        raise RuntimeError("source worktree is not clean")
'''
          if text.count(old) != 1:
              raise SystemExit("source preflight anchor mismatch")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Install reviewer dependencies
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: pip install --require-hashes --no-deps -r reviewer/requirements-ci-hashes.txt

      - name: Verify full reviewer quality gates
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          cd reviewer
          python -m pytest
          python -m interrogate --fail-under 100 noema_reviewer
          python -m compileall -q noema_reviewer tests
          cd ..
          git diff --check

      - name: Publish verified repair and remove temporary workflow
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          rm -f .github/workflows/repair-pr65-dirty-source.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(sandbox): reject dirty source worktrees"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:refs/heads/feat/quarantined-patch-validation"
