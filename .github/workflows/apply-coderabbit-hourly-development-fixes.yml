name: Apply CodeRabbit hourly development fixes

on:
  push:
    branches:
      - feat/hourly-nim-opencode-development

concurrency:
  group: apply-coderabbit-hourly-development-fixes
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out current feature head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/hourly-nim-opencode-development
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded exact replacements
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/apply_hourly_development_review_fixes.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/doctoring/hourly-nim-opencode-development.md")
          text = path.read_text(encoding="utf-8")
          old = "Each model candidate has a 900-second timeout plus a 30-second forced-termination grace period."
          new = "Each model candidate has a timeout of 900 seconds plus a 30-second forced-termination grace period."
          if text.count(old) != 1:
              raise SystemExit("could not bind exact timeout wording repair")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify release contract
        run: npm run release:verify

      - name: Verify patch formatting
        run: git diff --check

      - name: Commit and publish exact verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix(ci): close hourly development review gaps'
          git push origin HEAD:feat/hourly-nim-opencode-development
