name: Publish verified final-candidate repair

on:
  push:
    branches:
      - feat/hourly-nim-opencode-development
    paths:
      - .github/workflows/publish-verified-final-candidate-repair.yml

concurrency:
  group: publish-verified-final-candidate-repair-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish_verified_repair:
    if: >-
      github.repository == 'ContextualWisdomLab/noema'
      && github.ref == 'refs/heads/feat/hourly-nim-opencode-development'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out exact publisher trigger head without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download the already verified repair by immutable artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 8919044599
          run-id: 30978064579
          repository: ContextualWisdomLab/noema
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-repair

      - name: Verify and stage the repair without executing proposed code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          artifact_id=8919044599
          source_run_id=30978064579
          artifact_name=noema-final-candidate-repair-v3-30978064579-1
          expected_artifact_digest=fe32daafed57c311516f5980cd5cc904e566e9f3b48fec2b0d698591425ef39d
          expected_patch_sha=7a1e661aeefd52b362866dd13c05cacc8d65299fff20b48ce7a954aa59160ecf

          mapfile -d '' patch_files < <(
            find "$RUNNER_TEMP/verified-repair" \
              -type f \
              -name repair.patch \
              -print0
          )
          if [ "${#patch_files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one downloaded repair.patch."
            exit 1
          fi
          patch="${patch_files[0]}"
          if [ ! -f "$patch" ] || [ -L "$patch" ]; then
            echo "::error::Downloaded repair.patch is not a regular non-symlink file."
            exit 1
          fi
          case "$patch" in
            "$RUNNER_TEMP/verified-repair/$artifact_name/repair.patch") ;;
            *) echo "::error::Downloaded repair.patch is outside the exact artifact directory."; exit 1 ;;
          esac

          artifact_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          )"
          if ! jq -e \
            --argjson artifact_id "$artifact_id" \
            --arg artifact_name "$artifact_name" \
            --argjson run_id "$source_run_id" \
            '.id == $artifact_id
             and .name == $artifact_name
             and .expired == false
             and .workflow_run.id == $run_id' \
            <<<"$artifact_json" >/dev/null; then
            echo "::error::Repair artifact identity is not bound to the verified source run."
            exit 1
          fi
          downloaded_digest="$(jq -r '.digest // empty' <<<"$artifact_json")"
          if ! [[ "$downloaded_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Repair artifact digest evidence is malformed."
            exit 1
          fi
          if [ "${downloaded_digest#sha256:}" != "$expected_artifact_digest" ]; then
            echo "::error::Repair artifact digest differs from verified upload evidence."
            exit 1
          fi
          printf '%s  %s\n' "$expected_patch_sha" "$patch" | sha256sum -c -

          already_absent_paths=(
            .github/workflows/repair-final-candidate-cleanup.yml
            .github/workflows/repair-final-candidate-cleanup-v2.yml
            .github/workflows/repair-final-candidate-cleanup-v3.yml
          )
          for path in "${already_absent_paths[@]}"; do
            if [ -e "$path" ] || [ -L "$path" ]; then
              echo "::error::Expected superseded one-shot workflow to be absent: $path"
              exit 1
            fi
          done

          apply_arguments=(
            --binary
            --exclude=.github/workflows/repair-final-candidate-cleanup.yml
            --exclude=.github/workflows/repair-final-candidate-cleanup-v2.yml
            --exclude=.github/workflows/repair-final-candidate-cleanup-v3.yml
          )
          git apply --check "${apply_arguments[@]}" "$patch"
          git apply --index "${apply_arguments[@]}" "$patch"
          git diff --cached --check

          expected_artifact_paths="$RUNNER_TEMP/expected-artifact-paths.txt"
          actual_artifact_paths="$RUNNER_TEMP/actual-artifact-paths.txt"
          cat >"$expected_artifact_paths" <<'PATHS'
          .github/workflows/hourly-product-development.yml
          CHANGELOG.md
          docs/doctoring/hourly-nim-opencode-development.md
          docs/operations/hourly-product-development.md
          docs/superpowers/plans/2026-08-05-hourly-nim-opencode-development.md
          docs/superpowers/specs/2026-08-05-hourly-nim-opencode-development-design.md
          test/hourly-product-development-workflow.test.ts
          PATHS
          git diff --cached --name-only | LC_ALL=C sort >"$actual_artifact_paths"
          LC_ALL=C sort -o "$expected_artifact_paths" "$expected_artifact_paths"
          diff -u "$expected_artifact_paths" "$actual_artifact_paths"

          if git diff --cached --raw | awk '
            /^:/ {
              old_mode = substr($1, 2)
              new_mode = $2
              if (old_mode ~ /^(120000|160000)$/ || new_mode ~ /^(120000|160000)$/) {
                found = 1
              }
            }
            END { exit(found ? 0 : 1) }
          '; then
            echo "::error::Verified repair contains a symlink or gitlink."
            exit 1
          fi

          grep -Fq 'read -r -a model_candidates <<<"$OPENCODE_MODEL_CANDIDATES"' \
            .github/workflows/hourly-product-development.yml
          grep -Fq 'for ((candidate_index = 0; candidate_index < candidate_count; candidate_index++)); do' \
            .github/workflows/hourly-product-development.yml
          grep -Fq 'if [ "$candidate_index" -eq $((candidate_count - 1)) ]; then' \
            .github/workflows/hourly-product-development.yml
          if grep -Fq 'for model in $OPENCODE_MODEL_CANDIDATES; do' \
            .github/workflows/hourly-product-development.yml; then
            echo "::error::Legacy final-candidate cleanup flow remains."
            exit 1
          fi
          grep -Fq 'const interCandidateCleanupCount = Math.max(candidateCount - 1, 0);' \
            test/hourly-product-development-workflow.test.ts
          grep -Fq '3,230초' docs/operations/hourly-product-development.md
          grep -Fq '70초의 명시적 여유' docs/operations/hourly-product-development.md

          rm .github/workflows/publish-verified-final-candidate-repair.yml
          git add -A
          git diff --cached --check

          expected_final_paths="$RUNNER_TEMP/expected-final-paths.txt"
          actual_final_paths="$RUNNER_TEMP/actual-final-paths.txt"
          {
            cat "$expected_artifact_paths"
            echo .github/workflows/publish-verified-final-candidate-repair.yml
          } | LC_ALL=C sort >"$expected_final_paths"
          git diff --cached --name-only | LC_ALL=C sort >"$actual_final_paths"
          diff -u "$expected_final_paths" "$actual_final_paths"

      - name: Commit and push only the verified exact repair
        shell: bash
        env:
          PUBLISH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -c core.hooksPath=/dev/null commit \
            -m "fix(automation): skip cleanup after final candidate"

          git remote set-url origin \
            "https://x-access-token:${PUBLISH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          trap 'git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"' EXIT
          remote_sha="$(git ls-remote origin "$GITHUB_REF" | awk '{print $1}')"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Repair branch advanced after immutable verification."
            exit 1
          fi
          git push origin "HEAD:${GITHUB_REF}"
