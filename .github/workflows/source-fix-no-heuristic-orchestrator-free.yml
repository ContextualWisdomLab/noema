name: Source fix Noema no-heuristic orchestrator free

on:
  push:
    branches:
      - fix/no-heuristic-orchestrator-free-hourly
    paths:
      - .github/source-fix-no-heuristic-orchestrator-free.trigger

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'ContextualWisdomLab/noema'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up exact Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install locked test dependencies
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r reviewer/requirements-ci-hashes.txt

      - name: Prove both no-heuristics contracts are RED
        run: |
          set -euo pipefail
          set +e
          npx vitest run test/no-heuristic-orchestrator-free-workflows.test.ts
          node_status=$?
          PYTHONPATH=reviewer python -m pytest -q reviewer/tests/test_no_heuristic_review_contract.py
          python_status=$?
          set -e
          if [ "$node_status" -eq 0 ] || [ "$python_status" -eq 0 ]; then
            echo "::error::Expected both no-heuristics regression surfaces to fail before production repair."
            exit 1
          fi

      - name: Apply exact owner repair
        run: python scripts/source_fix_no_heuristic_orchestrator_free.py

      - name: Verify repaired no-heuristics contracts
        run: |
          set -euo pipefail
          npx vitest run \
            test/no-heuristic-orchestrator-free-workflows.test.ts \
            test/orchestrator-gateway-contract.test.ts \
            test/orchestrator-gateway-body-timeout.test.ts
          PYTHONPATH=reviewer python -m pytest -q reviewer/tests/test_no_heuristic_review_contract.py
          git diff --check

      - name: Remove completed one-shot machinery
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/source-fix-no-heuristic-orchestrator-free.yml \
            .github/source-fix-no-heuristic-orchestrator-free.trigger \
            scripts/source_fix_no_heuristic_orchestrator_free.py
          git diff --check

      - name: Commit verified repair without history rewrite
        env:
          EXPECTED_TRIGGER_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin fix/no-heuristic-orchestrator-free-hourly
          remote_head="$(git rev-parse origin/fix/no-heuristic-orchestrator-free-hourly)"
          if [ "$remote_head" != "$EXPECTED_TRIGGER_HEAD" ]; then
            echo "::error::Canonical branch moved; refusing to overwrite or synthesize a merge."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::error::Source fix produced no publishable delta."
            exit 1
          fi
          git commit -m "fix(ci): enforce no-heuristic orchestrator/free execution"
          git push origin HEAD:fix/no-heuristic-orchestrator-free-hourly
