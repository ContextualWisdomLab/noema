name: Temporary PR535 finish no-heuristic gateway repair

on:
  push:
    branches:
      - fix/noema-orchestrator-free-routing-alias
    paths:
      - .github/workflows/_temp_pr535_finish_no_heuristic_gateway.yml

permissions:
  contents: read

concurrency:
  group: temp-pr535-finish-no-heuristic-gateway
  cancel-in-progress: true

jobs:
  repair:
    if: github.repository == 'ContextualWisdomLab/noema'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact writer head without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install declared test toolchains
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          python -m pip install --require-hashes --no-deps -r reviewer/requirements-ci-hashes.txt

      - name: Revalidate exact remote head
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          local_head="$(git rev-parse HEAD)"
          if [ -z "$remote_head" ] || [ "$remote_head" != "$local_head" ]; then
            echo "::error::writer head moved: local=$local_head remote=$remote_head"
            exit 1
          fi

      - name: Prove existing workflow regression is RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npx vitest run test/no-heuristic-gateway-workflow.test.ts >"$RUNNER_TEMP/red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/red.log"
          if [ "$status" -eq 0 ]; then
            echo "::error::No-heuristic workflow regression was unexpectedly GREEN before the production repair."
            exit 1
          fi
          grep -q 'no-heuristic-gateway-workflow.test.ts' "$RUNNER_TEMP/red.log"
          grep -Eiq 'failed|AssertionError|expected' "$RUNNER_TEMP/red.log"
          echo "RED verified against the actual workflow contract test."

      - name: Apply smallest causal production and traceability repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact replacement, found {count}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          central = Path(".github/workflows/central-review.yml")
          text = central.read_text(encoding="utf-8")
          marker = "  publish_review:\n"
          if text.count(marker) != 1:
              raise SystemExit("central-review.yml: publish_review marker drifted")
          prefix, publication = text.split(marker, 1)
          publication = publication.replace("    timeout-minutes: 120\n", "", 1)
          if "    timeout-minutes: 120\n" in publication:
              raise SystemExit("central-review.yml: duplicate publication timeout remained")
          expected_model = "          NOEMA_LLM_MODEL: ${{ vars.NOEMA_LLM_MODEL }}\n"
          if publication.count(expected_model) != 1:
              raise SystemExit("central-review.yml: model authority line drifted")
          publication = publication.replace(expected_model, "          NOEMA_LLM_MODEL: orchestrator/free\n", 1)
          for fragment in (
              "          NOEMA_LLM_REQUEST_TIMEOUT_SECONDS: ${{ vars.NOEMA_LLM_REQUEST_TIMEOUT_SECONDS || '5400' }}\n",
              "          NOEMA_LLM_MAX_RETRIES: ${{ vars.NOEMA_LLM_MAX_RETRIES || '1' }}\n",
              "          # One retry preserves transient recovery while keeping the request\n",
              "          # path inside the bounded publication job.\n",
          ):
              if fragment not in publication:
                  raise SystemExit(f"central-review.yml: expected stale fragment missing: {fragment!r}")
              publication = publication.replace(fragment, "", 1)
          start = publication.find("          printf 'Noema provider contract:")
          end = publication.find("          set +e\n", start)
          if start < 0 or end < 0:
              raise SystemExit("central-review.yml: provider diagnostic block drifted")
          publication = (
              publication[:start]
              + "          printf 'Noema provider contract: gateway=contextual-orchestrator primary=%s.\\n' \\\n"
              + "            \"${NOEMA_LLM_MODEL:-missing}\"\n"
              + publication[end:]
          )
          central.write_text(prefix + marker + publication, encoding="utf-8")

          hourly = Path(".github/workflows/hourly-product-development.yml")
          text = hourly.read_text(encoding="utf-8")
          for fragment in (
              "  # One gateway-backed session plus setup/diagnostic reserve fits in 55 minutes.\n",
              "  OPENCODE_RUN_TIMEOUT_SECONDS: \"2700\"\n",
              "  OPENCODE_KILL_GRACE_SECONDS: \"30\"\n",
              "    timeout-minutes: 55\n",
          ):
              if text.count(fragment) != 1:
                  raise SystemExit(f"hourly workflow: expected one stale fragment, found {text.count(fragment)}: {fragment!r}")
              text = text.replace(fragment, "", 1)
          model_line = "          NOEMA_LLM_MODEL: ${{ vars.NOEMA_LLM_MODEL }}\n"
          if text.count(model_line) != 1:
              raise SystemExit("hourly workflow: model authority line drifted")
          text = text.replace(model_line, "          NOEMA_LLM_MODEL: orchestrator/free\n", 1)
          timeout_prefix = (
              "          if timeout --kill-after=\"${OPENCODE_KILL_GRACE_SECONDS}s\" \"${OPENCODE_RUN_TIMEOUT_SECONDS}s\" \\\n"
              "            env -u GH_TOKEN -u GITHUB_TOKEN \\\n"
          )
          if text.count(timeout_prefix) != 1:
              raise SystemExit("hourly workflow: OpenCode timeout wrapper drifted")
          text = text.replace(
              timeout_prefix,
              "          if env -u GH_TOKEN -u GITHUB_TOKEN \\\n",
              1,
          )
          hourly.write_text(text, encoding="utf-8")

          prereq = Path("docs/operations/hourly-product-development-prerequisites.md")
          text = prereq.read_text(encoding="utf-8")
          text = text.replace(
              "- `NOEMA_LLM_MODEL`: 정규 라우팅 별칭 `orchestrator/free`(실패-폐쇄 zero-cost pool, ZDR-first)\n",
              "- 모델 라우팅은 workflow source가 `orchestrator/free`로 고정하며 별도 Actions variable을 요구하지 않음\n",
              1,
          )
          text = text.replace(
              "4. 리뷰와 동일한 `NOEMA_LLM_API_URL`, `NOEMA_LLM_MODEL`, `NOEMA_LLM_API_KEY`를 설정합니다.\n",
              "4. 리뷰와 동일한 `NOEMA_LLM_API_URL`, `NOEMA_LLM_API_KEY`를 설정하고 모델은 source-pinned `orchestrator/free`인지 확인합니다.\n",
              1,
          )
          prereq.write_text(text, encoding="utf-8")

          baseline = Path("docs/product-technical-gap-baseline.md")
          text = baseline.read_text(encoding="utf-8")
          section = """## 2026-09-02 — Noema review compute authority hardening

A live PR-head audit found that the new free-pool validator and no-retry reviewer implementation coexisted with stale workflow-owned decision inputs: central review still sourced `NOEMA_LLM_MODEL` plus numeric timeout/retry knobs from Actions variables, and hourly OpenCode still imposed a repository-authored 2,700-second inference deadline. The executable `test/no-heuristic-gateway-workflow.test.ts` was RED against those production workflows, so the regression was treated as an instruction to complete GREEN rather than as a stopping point.

Central review and hourly OpenCode now source-pin `orchestrator/free`; operational variables can no longer widen that routing authority. Noema's reviewer keeps `AsyncOpenAI(timeout=None, max_retries=0)`, while contextual-orchestrator owns inference lifecycle and recovery. The hourly proposal session likewise no longer applies a downstream wall-clock kill to model execution. Setup and job orchestration remain subject to GitHub's platform limits, but Noema no longer invents a second model-compute policy.

The prior one-shot source-fix workflow, trigger, and helper were removed from the publishable tree. This repair uses a self-deleting exact-head workflow solely because the connected contents API cannot conveniently patch the two large workflow documents transactionally; its final push uses the repository-scoped Maintainer App token so successor-head checks are created.
"""
          if "## 2026-09-02 — Noema review compute authority hardening" not in text:
              baseline.write_text(text.rstrip() + "\n\n" + section, encoding="utf-8")
          PY

      - name: Verify focused GREEN contracts
        shell: bash
        run: |
          set -euo pipefail
          npx vitest run \
            test/no-heuristic-gateway-workflow.test.ts \
            test/orchestrator-gateway-contract.test.ts \
            test/orchestrator-gateway-routing-alias.test.ts \
            test/orchestrator-gateway-secret-source.test.ts
          PYTHONPATH=reviewer python -m pytest -q \
            reviewer/tests/test_no_heuristic_gateway_policy.py \
            reviewer/tests/test_config.py \
            reviewer/tests/test_central_review_workflow.py \
            reviewer/tests/test_central_review_isolation.py
          git diff --check

      - name: Verify broader repository contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm test -- --runInBand
          git diff --check

      - name: Mint short-lived repository-scoped Maintainer App token
        id: maintainer_app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.NOEMA_MAINTAINER_APP_CLIENT_ID }}
          private-key: ${{ secrets.NOEMA_MAINTAINER_APP_PRIVATE_KEY }}
          owner: ContextualWisdomLab
          repositories: noema
          permission-contents: write
          permission-metadata: read

      - name: Remove temporary repair identity
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_temp_pr535_finish_no_heuristic_gateway.yml
          if git ls-files | grep -F '_temp_pr535_finish_no_heuristic_gateway'; then
            echo "::error::temporary PR535 repair identity remains tracked"
            exit 1
          fi
          git diff --check

      - name: Commit verified production repair and trigger successor checks
        shell: bash
        env:
          MAINTAINER_TOKEN: ${{ steps.maintainer_app.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "${MAINTAINER_TOKEN:-}" ]; then
            echo "::error::Maintainer App token is unavailable; refusing github.token publication."
            exit 1
          fi
          git fetch origin "${GITHUB_REF_NAME}"
          remote_head="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          local_parent="$(git rev-parse HEAD)"
          if [ "$remote_head" != "$local_parent" ]; then
            echo "::error::writer branch moved before publish: local=$local_parent remote=$remote_head"
            exit 1
          fi
          git config user.name "noema-maintainer[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "::error::repair produced no publishable delta"
            exit 1
          fi
          git commit -m "fix(noema): finish no-heuristic review compute boundary"
          git remote set-url origin "https://x-access-token:${MAINTAINER_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${GITHUB_REF_NAME}"
