name: hourly-commercial-readiness
run-name: Noema hourly commercial-readiness loop

on:
  schedule:
    - cron: "17 * * * *"
  # repository_dispatch is always evaluated from the default branch. This keeps
  # the privileged manual entrypoint from running branch-selected workflow code.
  repository_dispatch:
    types: [commercial-readiness-loop]

concurrency:
  group: noema-hourly-commercial-readiness
  cancel-in-progress: true

# The workflow token only reads trusted default-branch state. All PR writes use
# the dedicated Maintainer App token so merge events can trigger downstream push
# workflows instead of being suppressed by GITHUB_TOKEN recursion rules.
permissions:
  contents: read

jobs:
  activation_preflight:
    name: scheduler-activation-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      write_ready: ${{ steps.activation.outputs.write_ready }}
      terminal_classification: ${{ steps.activation.outputs.terminal_classification }}
    env:
      MAINTENANCE_ENABLED: ${{ vars.NOEMA_MAINTENANCE_ENABLED == 'true' }}
      MAINTAINER_APP_CLIENT_ID_CONFIGURED: ${{ vars.NOEMA_MAINTAINER_APP_CLIENT_ID != '' }}
      MAINTAINER_APP_PRIVATE_KEY_CONFIGURED: ${{ secrets.NOEMA_MAINTAINER_APP_PRIVATE_KEY != '' }}
      REVIEWER_LOGIN_CONFIGURED: ${{ vars.NOEMA_REVIEWER_LOGIN != '' }}
      REPOSITORY_FULL_NAME: ${{ github.repository }}
      WORKFLOW_SOURCE_SHA: ${{ github.sha }}
      EVENT_NAME: ${{ github.event_name }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
      WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: classify activation feasibility without repository writes
        id: activation
        shell: bash
        run: |
          set -euo pipefail
          write_ready=false
          terminal_classification=EXTERNAL_GATE_REMAINS
          reason_code=activation_prerequisite_unavailable

          if [ "$REPOSITORY_FULL_NAME" != "ContextualWisdomLab/noema" ]; then
            terminal_classification=SAFETY_OR_POLICY_BLOCKER
            reason_code=unexpected_repository
          elif ! [[ "$WORKFLOW_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            terminal_classification=SAFETY_OR_POLICY_BLOCKER
            reason_code=invalid_workflow_source_sha
          elif [ "$MAINTENANCE_ENABLED" != "true" ] \
            || [ "$MAINTAINER_APP_CLIENT_ID_CONFIGURED" != "true" ] \
            || [ "$MAINTAINER_APP_PRIVATE_KEY_CONFIGURED" != "true" ] \
            || [ "$REVIEWER_LOGIN_CONFIGURED" != "true" ]; then
            terminal_classification=EXTERNAL_GATE_REMAINS
            reason_code=activation_prerequisite_unavailable
          else
            write_ready=true
            terminal_classification=NO_ACTION_NEEDED
            reason_code=write_lane_ready
          fi

          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          evidence_path="artifacts/operations/hourly-scheduler-activation.json"
          mkdir -p "$(dirname "$evidence_path")"
          jq -n \
            --argjson schema_version 1 \
            --arg repository_full_name "$REPOSITORY_FULL_NAME" \
            --arg workflow_source_sha "$WORKFLOW_SOURCE_SHA" \
            --arg event_name "$EVENT_NAME" \
            --arg workflow_run_id "$WORKFLOW_RUN_ID" \
            --arg workflow_run_attempt "$WORKFLOW_RUN_ATTEMPT" \
            --arg generated_at "$generated_at" \
            --arg terminal_classification "$terminal_classification" \
            --arg reason_code "$reason_code" \
            --argjson write_ready "$write_ready" \
            '{
              schema_version: $schema_version,
              repository_full_name: $repository_full_name,
              workflow_source_sha: $workflow_source_sha,
              event_name: $event_name,
              workflow_run_id: $workflow_run_id,
              workflow_run_attempt: $workflow_run_attempt,
              generated_at: $generated_at,
              terminal_classification: $terminal_classification,
              reason_code: $reason_code,
              write_ready: $write_ready
            }' >"$evidence_path"
          chmod 0600 "$evidence_path"

          {
            echo "write_ready=$write_ready"
            echo "terminal_classification=$terminal_classification"
          } >>"$GITHUB_OUTPUT"
          {
            echo "## Hourly scheduler activation"
            echo
            echo "- Classification: \`$terminal_classification\`"
            echo "- Reason: \`$reason_code\`"
            echo "- Credential-bearing write lane: \`$write_ready\`"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: upload scheduler activation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scheduler-activation-evidence
          path: artifacts/operations/hourly-scheduler-activation.json
          if-no-files-found: error
          retention-days: 90

  maintain:
    needs: activation_preflight
    if: needs.activation_preflight.outputs.write_ready == 'true'
    name: commercial-readiness-maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: checkout trusted default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.19.0"
          cache: npm

      - name: verify package-manager toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"

      - name: install lockfile dependencies
        run: npm ci --legacy-peer-deps=false --install-links=false

      - name: mint dedicated maintainer App token
        id: maintainer_app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.NOEMA_MAINTAINER_APP_CLIENT_ID }}
          private-key: ${{ secrets.NOEMA_MAINTAINER_APP_PRIVATE_KEY }}
          owner: ContextualWisdomLab
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-checks: read
          permission-contents: write
          permission-metadata: read
          permission-pull-requests: write
          permission-statuses: read

      - name: verify active main governance before any write
        id: governance
        env:
          GH_TOKEN: ${{ steps.maintainer_app.outputs.token }}
          NOEMA_GOVERNANCE_AUDIT_PATH: artifacts/governance/main-governance-audit.json
        run: npm run governance:audit

      - name: inspect, dispatch, and merge exact-head pull requests
        id: loop
        env:
          GH_TOKEN: ${{ steps.maintainer_app.outputs.token }}
          NOEMA_REVIEWER_LOGIN: ${{ vars.NOEMA_REVIEWER_LOGIN }}
        run: node scripts/hourly-commercial-readiness.mjs --apply

      - name: refresh saleable-readiness evidence when the queue is empty
        if: steps.loop.outputs.remaining_open_pull_request_count == '0'
        env:
          NOEMA_AUDIT_REPORT_ONLY: "1"
          NOEMA_KPI_LOG_PATH: exchange-30d.ndjson
          NOEMA_KPI_EVIDENCE_PATH: noema-kpi-evidence.json
          NOEMA_KPI_PROVENANCE_PATH: exchange-30d.ndjson.provenance.json
          NOEMA_EXCHANGE_URL: ${{ vars.NOEMA_EXCHANGE_URL }}
          NOEMA_SMOKE_EVIDENCE_PATH: noema-smoke-evidence.json
        run: npm run readiness:audit

      - name: refresh acquisition manifest when the queue is empty
        if: steps.loop.outputs.remaining_open_pull_request_count == '0'
        env:
          NOEMA_AUDIT_REPORT_ONLY: "1"
        run: npm run acquisition:manifest

      - name: refresh acquisition-readiness evidence when the queue is empty
        if: steps.loop.outputs.remaining_open_pull_request_count == '0'
        env:
          NOEMA_AUDIT_REPORT_ONLY: "1"
        run: npm run acquisition:audit

      - name: upload main governance audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: main-governance-audit
          path: artifacts/governance/main-governance-audit.json
          if-no-files-found: error
          retention-days: 90

      - name: upload loop report
        if: always() && steps.loop.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: commercial-readiness-loop-report
          path: artifacts/commercial-readiness/hourly-loop-report.json
          if-no-files-found: error
          retention-days: 90

      - name: upload no-PR commercial-readiness evidence
        if: always() && steps.loop.outputs.remaining_open_pull_request_count == '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: no-pr-commercial-readiness-evidence
          path: |
            artifacts/saleable-readiness/**/goal-audit.json
            artifacts/acquisition-readiness/**/data-room-manifest.json
            artifacts/acquisition-readiness/**/acquisition-audit.json
            noema-kpi-evidence.json
            exchange-30d.ndjson.provenance.json
            noema-smoke-evidence.json
          if-no-files-found: error
          retention-days: 90
