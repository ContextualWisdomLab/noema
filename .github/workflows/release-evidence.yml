name: release-evidence
run-name: Release evidence ${{ github.ref_name }}@${{ github.sha }}

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to attest; dispatch the workflow with --ref set to the same tag
        required: true
        type: string

concurrency:
  group: release-evidence-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  attest_release:
    name: signed-release-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      artifact_id: ${{ steps.release_bundle.outputs.artifact-id }}
      artifact_digest: ${{ steps.release_bundle.outputs.artifact-digest }}
      commit_sha: ${{ steps.identity.outputs.commit_sha }}
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      ref: ${{ steps.release.outputs.ref }}
    steps:
      - name: Bind run to an exact semantic-version tag
        id: release
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf '::error::Release tag must match vMAJOR.MINOR.PATCH; received %s.\n' "${REQUESTED_TAG:-missing}"
            exit 1
          fi
          expected_ref="refs/tags/${REQUESTED_TAG}"
          if [ "$GITHUB_REF" != "$expected_ref" ]; then
            printf '::error::Dispatch release-evidence with --ref %s so the signed source ref is the release tag; observed %s.\n' \
              "$REQUESTED_TAG" "$GITHUB_REF"
            exit 1
          fi
          printf 'tag=%s\nref=%s\n' "$REQUESTED_TAG" "$expected_ref" >>"$GITHUB_OUTPUT"

      - name: Checkout exact release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Verify package-manager toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"

      - name: Verify tag, commit, and package version binding
        id: identity
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          tagged_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          package_version="$(node --input-type=module -e "import packageJson from './package.json' with { type: 'json' }; process.stdout.write(packageJson.version)")"
          if [ "$commit_sha" != "$tagged_sha" ]; then
            printf '::error::Checked-out commit %s does not match tag commit %s.\n' "$commit_sha" "$tagged_sha"
            exit 1
          fi
          if [ "$RELEASE_TAG" != "v${package_version}" ]; then
            printf '::error::Tag %s does not match package version %s.\n' "$RELEASE_TAG" "$package_version"
            exit 1
          fi
          printf 'commit_sha=%s\nversion=%s\n' "$commit_sha" "$package_version" >>"$GITHUB_OUTPUT"

      - name: Install lockfile dependencies
        run: npm ci --legacy-peer-deps=false --install-links=false

      - name: Verify tracked release source unchanged after install
        shell: bash
        run: |
          set -euo pipefail
          tracked_drift="$(git status --porcelain=v1 --untracked-files=no)"
          if [ -n "$tracked_drift" ]; then
            printf '::error::Dependency installation changed tracked release source:\n%s\n' "$tracked_drift"
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "${{ steps.identity.outputs.commit_sha }}"

      - name: Verify release quality
        run: npm run release:verify

      - name: Build source archive, CycloneDX SBOM, and checksum manifest
        env:
          RELEASE_COMMIT_SHA: ${{ steps.identity.outputs.commit_sha }}
          RELEASE_REF: ${{ steps.release.outputs.ref }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          release_dir="$GITHUB_WORKSPACE/release"
          source_path="$release_dir/noema-${RELEASE_COMMIT_SHA}.tar.gz"
          sbom_path="$release_dir/noema.cdx.json"
          rm -rf "$release_dir"
          mkdir -p "$release_dir"
          git archive --format=tar.gz --prefix="noema-${RELEASE_VERSION}/" \
            --output="$source_path" "$RELEASE_COMMIT_SHA"
          npm sbom --package-lock-only --sbom-format=cyclonedx --sbom-type=application >"$sbom_path"
          NOEMA_RELEASE_COMMIT_SHA="$RELEASE_COMMIT_SHA" \
          NOEMA_RELEASE_REF="$RELEASE_REF" \
          NOEMA_RELEASE_VERSION="$RELEASE_VERSION" \
          NOEMA_RELEASE_GENERATED_AT="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')" \
            node scripts/release-evidence.mjs \
              --source "$source_path" \
              --sbom "$sbom_path" \
              --output-dir "$release_dir"
          cd "$release_dir"
          sha256sum --check SHA256SUMS

      - name: Attest source archive provenance
        id: provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: release/noema-${{ steps.identity.outputs.commit_sha }}.tar.gz
          create-storage-record: true
          show-summary: true

      - name: Attest source archive CycloneDX SBOM
        id: sbom_attestation
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: release/noema-${{ steps.identity.outputs.commit_sha }}.tar.gz
          sbom-path: release/noema.cdx.json
          create-storage-record: true
          show-summary: true

      - name: Verify provenance and SBOM attestations before staging evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT_SHA: ${{ steps.identity.outputs.commit_sha }}
          RELEASE_REF: ${{ steps.release.outputs.ref }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom_attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          source_path="release/noema-${RELEASE_COMMIT_SHA}.tar.gz"
          signer_workflow="$GITHUB_REPOSITORY/.github/workflows/release-evidence.yml"
          gh attestation verify "$source_path" \
            --bundle "$PROVENANCE_BUNDLE" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer_workflow" \
            --signer-digest "$RELEASE_COMMIT_SHA" \
            --source-digest "$RELEASE_COMMIT_SHA" \
            --source-ref "$RELEASE_REF" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --deny-self-hosted-runners
          gh attestation verify "$source_path" \
            --bundle "$SBOM_BUNDLE" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer_workflow" \
            --signer-digest "$RELEASE_COMMIT_SHA" \
            --source-digest "$RELEASE_COMMIT_SHA" \
            --source-ref "$RELEASE_REF" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --predicate-type https://cyclonedx.org/bom \
            --deny-self-hosted-runners
          mkdir -p release/attestations
          install -m 0644 "$PROVENANCE_BUNDLE" release/attestations/provenance.sigstore.json
          install -m 0644 "$SBOM_BUNDLE" release/attestations/cyclonedx-sbom.sigstore.json

      - name: Seal bounded publication handoff
        run: |
          set -euo pipefail
          test -f scripts/release-publication-receipt.mjs
          install -m 0555 scripts/release-publication-receipt.mjs release-publication-receipt.mjs
          if find release -type l -print -quit | grep -q .; then
            echo "::error::Release publication bundle must not contain symbolic links."
            exit 1
          fi
          sha256sum \
            release/SHA256SUMS \
            release/attestations/cyclonedx-sbom.sigstore.json \
            release/attestations/provenance.sigstore.json \
            release/noema.cdx.json \
            release/noema-${{ steps.identity.outputs.commit_sha }}.tar.gz \
            release/release-evidence.json \
            release-publication-receipt.mjs \
            >release-bundle.sha256

      - name: Upload bounded release publication bundle
        id: release_bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: noema-release-evidence-${{ steps.release.outputs.tag }}
          path: |
            release/
            release-bundle.sha256
            release-publication-receipt.mjs
          if-no-files-found: error
          retention-days: 90

  publish_release:
    name: immutable-release-publication
    needs: attest_release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: read
      # Required only to create the immutable Release and upload its fixed asset set.
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      RELEASE_ARTIFACT_DIGEST: ${{ needs.attest_release.outputs.artifact_digest }}
      RELEASE_ARTIFACT_ID: ${{ needs.attest_release.outputs.artifact_id }}
      RELEASE_COMMIT_SHA: ${{ needs.attest_release.outputs.commit_sha }}
      RELEASE_REF: ${{ needs.attest_release.outputs.ref }}
      RELEASE_TAG: ${{ needs.attest_release.outputs.tag }}
      RELEASE_VERSION: ${{ needs.attest_release.outputs.version }}
    steps:
      - name: Download verified bounded release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.attest_release.outputs.artifact_id }}
          path: ${{ runner.temp }}/release-publication-input

      - name: Verify exact publication handoff
        env:
          BUNDLE_DIR: ${{ runner.temp }}/release-publication-input
        run: |
          set -euo pipefail
          cd "$BUNDLE_DIR"
          test "$RELEASE_ARTIFACT_ID" != ""
          test "$RELEASE_ARTIFACT_DIGEST" != ""
          if find . -type l -print -quit | grep -q .; then
            echo "::error::Downloaded release publication bundle contains a symbolic link."
            exit 1
          fi
          sha256sum --check release-bundle.sha256
          expected="$(printf '%s\n' \
            SHA256SUMS \
            cyclonedx-sbom.sigstore.json \
            noema.cdx.json \
            "noema-${RELEASE_COMMIT_SHA}.tar.gz" \
            provenance.sigstore.json \
            release-evidence.json | sort)"
          actual="$(find release -type f -printf '%f\n' | sort)"
          if [ "$actual" != "$expected" ]; then
            printf '::error::Release asset set differs from the bounded contract.\nExpected:\n%s\nObserved:\n%s\n' \
              "$expected" "$actual"
            exit 1
          fi
          cd release
          sha256sum --check SHA256SUMS
          jq -e \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg ref "$RELEASE_REF" \
            --arg sha "$RELEASE_COMMIT_SHA" \
            --arg version "$RELEASE_VERSION" \
            '.schemaVersion == 1 and .source.repository == $repo and .source.ref == $ref and .source.commitSha == $sha and .source.version == $version' \
            release-evidence.json >/dev/null

      - name: Require immutable-release enforcement and absent prior release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          publication_dir="$RUNNER_TEMP/release-publication"
          rm -rf "$publication_dir"
          mkdir -p "$publication_dir"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/immutable-releases" \
            >"$publication_dir/immutable-release-policy.json"
          jq -e '.enabled == true and (.enforced_by_owner | type == "boolean")' \
            "$publication_dir/immutable-release-policy.json" >/dev/null
          remote_tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq '.sha')"
          if [ "$remote_tag_sha" != "$RELEASE_COMMIT_SHA" ]; then
            printf '::error::Remote tag %s resolves to %s, expected %s.\n' \
              "$RELEASE_TAG" "${remote_tag_sha:-missing}" "$RELEASE_COMMIT_SHA"
            exit 1
          fi
          set +e
          gh api --include \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            >"$publication_dir/existing-release.http" 2>&1
          existing_status=$?
          set -e
          http_status="$(awk 'toupper($1) ~ /^HTTP\// { code=$2 } END { print code }' \
            "$publication_dir/existing-release.http")"
          if [ "$existing_status" -eq 0 ]; then
            echo "::error::Release ${RELEASE_TAG} already exists; immutable publication never overwrites a release."
            exit 1
          fi
          if [ "$http_status" != "404" ]; then
            cat "$publication_dir/existing-release.http"
            printf '::error::Could not prove release absence; observed HTTP status %s.\n' "${http_status:-missing}"
            exit 1
          fi
          printf 'Immutable-release enforcement is active and release %s is absent.\n' "$RELEASE_TAG"

      - name: Publish the complete immutable buyer asset set
        env:
          BUNDLE_DIR: ${{ runner.temp }}/release-publication-input
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_dir="$BUNDLE_DIR/release"
          notes_file="$RUNNER_TEMP/release-publication/release-notes.md"
          cat >"$notes_file" <<EOF
          # Noema ${RELEASE_TAG}

          Immutable source release for commit \`${RELEASE_COMMIT_SHA}\`.

          The asset set includes the exact-tag source archive, CycloneDX SBOM, checksums,
          release evidence manifest, and GitHub/Sigstore provenance and SBOM bundles.
          This source release does not prove Cloudflare deployment or production operation.
          EOF
          # --target is deliberately omitted: GitHub ignores target_commitish when the
          # verified tag already exists. Exact identity is established by dereferencing
          # the tag immediately before and after publication.
          gh release create "$RELEASE_TAG" \
            "$release_dir/noema-${RELEASE_COMMIT_SHA}.tar.gz" \
            "$release_dir/noema.cdx.json" \
            "$release_dir/release-evidence.json" \
            "$release_dir/SHA256SUMS" \
            "$release_dir/attestations/provenance.sigstore.json" \
            "$release_dir/attestations/cyclonedx-sbom.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Noema ${RELEASE_TAG}" \
            --notes-file "$notes_file"

      - name: Verify immutable release identity and every published asset
        env:
          BUNDLE_DIR: ${{ runner.temp }}/release-publication-input
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_dir="$BUNDLE_DIR/release"
          publication_dir="$RUNNER_TEMP/release-publication"
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isImmutable,tagName,targetCommitish,assets,url \
            >"$publication_dir/release-view.json"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            >"$publication_dir/release-api.json"
          jq -e --arg tag "$RELEASE_TAG" \
            '.isImmutable == true and .tagName == $tag' \
            "$publication_dir/release-view.json" >/dev/null
          jq -e --arg tag "$RELEASE_TAG" \
            '.immutable == true and .tag_name == $tag' \
            "$publication_dir/release-api.json" >/dev/null
          published_tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq '.sha')"
          if [ "$published_tag_sha" != "$RELEASE_COMMIT_SHA" ]; then
            printf '::error::Published release tag %s resolves to %s, expected %s.\n' \
              "$RELEASE_TAG" "${published_tag_sha:-missing}" "$RELEASE_COMMIT_SHA"
            exit 1
          fi

          verify_retry() {
            local attempt
            for attempt in 1 2 3 4 5 6; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -lt 6 ]; then
                printf 'Release attestation verification attempt %s/6 failed; retrying.\n' "$attempt"
                sleep 10
              fi
            done
            return 1
          }

          verify_retry gh release verify "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --format json \
            >"$publication_dir/release-attestation-verification.json"

          assets=(
            "$release_dir/SHA256SUMS"
            "$release_dir/attestations/cyclonedx-sbom.sigstore.json"
            "$release_dir/noema.cdx.json"
            "$release_dir/noema-${RELEASE_COMMIT_SHA}.tar.gz"
            "$release_dir/attestations/provenance.sigstore.json"
            "$release_dir/release-evidence.json"
          )
          verified_names="$publication_dir/verified-assets.txt"
          : >"$verified_names"
          for asset in "${assets[@]}"; do
            asset_name="$(basename "$asset")"
            verify_retry gh release verify-asset "$RELEASE_TAG" "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --format json \
              >"$publication_dir/asset-${asset_name}.verification.json"
            printf '%s\n' "$asset_name" >>"$verified_names"
          done
          sort -o "$verified_names" "$verified_names"
          jq -Rn \
            --arg resolvedTagCommitSha "$published_tag_sha" \
            --arg verifiedAt "$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')" \
            --arg workflowRunUrl "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{releaseVerified: true, resolvedTagCommitSha: $resolvedTagCommitSha, verifiedAssets: [inputs], verifiedAt: $verifiedAt, workflowRunUrl: $workflowRunUrl}' \
            <"$verified_names" \
            >"$publication_dir/release-verification.json"

      - name: Write acquisition-ready publication receipt
        env:
          BUNDLE_DIR: ${{ runner.temp }}/release-publication-input
        run: |
          set -euo pipefail
          publication_dir="$RUNNER_TEMP/release-publication"
          GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
          NOEMA_RELEASE_TAG="$RELEASE_TAG" \
          NOEMA_RELEASE_COMMIT_SHA="$RELEASE_COMMIT_SHA" \
          NOEMA_RELEASE_VERSION="$RELEASE_VERSION" \
          NOEMA_RELEASE_GENERATED_AT="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')" \
            node "$BUNDLE_DIR/release-publication-receipt.mjs" \
              --policy "$publication_dir/immutable-release-policy.json" \
              --release-view "$publication_dir/release-view.json" \
              --release-api "$publication_dir/release-api.json" \
              --verification "$publication_dir/release-verification.json" \
              --release-evidence "$BUNDLE_DIR/release/release-evidence.json" \
              --asset-dir "$BUNDLE_DIR/release" \
              --output "$publication_dir/release-publication-receipt.json"

      - name: Upload durable publication receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: noema-release-publication-${{ needs.attest_release.outputs.tag }}
          path: ${{ runner.temp }}/release-publication/
          if-no-files-found: error
          retention-days: 365