name: lockfile-reproducibility

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: noema-lockfile-reproducibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: verify exact checkout
        shell: bash
        env:
          NOEMA_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$NOEMA_EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            printf '::error::Invalid expected head SHA.\n'
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$NOEMA_EXPECTED_HEAD_SHA"

      - name: setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.19.0"
          cache: npm

      - name: verify package-manager identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"

      - name: verify committed lockfile in disposable workspace
        shell: bash
        run: |
          set -euo pipefail
          verification_root="$RUNNER_TEMP/noema-lockfile-verification"
          receipt="$RUNNER_TEMP/noema-lockfile-reproducibility.txt"
          rm -rf "$verification_root"
          mkdir -p "$verification_root"
          cp package.json package-lock.json .npmrc "$verification_root/"
          (
            cd "$verification_root"
            npm ci \
              --ignore-scripts \
              --no-audit \
              --no-fund \
              --legacy-peer-deps=false \
              --install-links=false
          )
          {
            printf 'source_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'node_version=%s\n' "$(node --version)"
            printf 'npm_version=%s\n' "$(npm --version)"
            printf 'package_json_sha256=%s\n' "$(sha256sum package.json | cut -d' ' -f1)"
            printf 'package_lock_sha256=%s\n' "$(sha256sum package-lock.json | cut -d' ' -f1)"
            printf 'npm_ci=verified\n'
          } >"$receipt"

      - name: upload lockfile verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: noema-lockfile-reproducibility-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/noema-lockfile-reproducibility.txt
          if-no-files-found: error
          retention-days: 1
