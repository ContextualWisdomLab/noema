name: acquisition-readiness-audit

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

jobs:
  acquisition-readiness:
    name: acquisition-readiness-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.19.0"
          cache: npm

      - name: verify package-manager toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"

      - name: install
        run: npm ci --legacy-peer-deps=false --install-links=false

      - name: verify tracked acquisition source unchanged after install
        shell: bash
        run: |
          set -euo pipefail
          tracked_drift="$(git status --porcelain=v1 --untracked-files=no)"
          if [ -n "$tracked_drift" ]; then
            printf '::error::Dependency installation changed tracked acquisition source:\n%s\n' "$tracked_drift"
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: build data-room manifest
        run: npm run acquisition:manifest

      - name: run acquisition audit
        env:
          NOEMA_AUDIT_REPORT_ONLY: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: |
          set +e
          npm run acquisition:audit
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::Acquisition audit failed. Report-only mode only suppresses external evidence gaps; see failed-check details above."
          fi
          exit "$status"

      - name: upload acquisition artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acquisition-readiness-audit
          path: artifacts/acquisition-readiness/**/*
          if-no-files-found: warn
