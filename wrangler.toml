name = "noema"
main = "src/runtime-entrypoint.ts"
compatibility_date = "2026-06-30"

[[durable_objects.bindings]]
name = "NOEMA_RATE_LIMITER"
class_name = "NoemaRateLimiter"

[[durable_objects.bindings]]
name = "NOEMA_OIDC_REPLAY_GUARD"
class_name = "NoemaOidcReplayGuard"

[exports.NoemaRateLimiter]
type = "durable-object"
storage = "sqlite"

[exports.NoemaOidcReplayGuard]
type = "durable-object"
storage = "sqlite"

[vars]
ALLOWED_ISSUER = "https://token.actions.githubusercontent.com"
ALLOWED_AUDIENCE = "cwl-noema-review"
ALLOWED_REPOSITORY_OWNER = "ContextualWisdomLab"
ALLOWED_WORKFLOW_REPOSITORY = "ContextualWisdomLab/.github"
ALLOWED_WORKFLOW_REF_PREFIX = "ContextualWisdomLab/.github/.github/workflows/noema-review.yml@refs/heads/main"
ALLOWED_WORKFLOW_SHA = "e71fdab2ab088001f218765ecb5e3b7fabfee11a"
GITHUB_API_BASE = "https://api.github.com"
GITHUB_APP_SLUG = "noema"
NOEMA_RATE_LIMIT_PER_MINUTE = "60"
NOEMA_OIDC_JWKS_CACHE_TTL_SECONDS = "300"
NOEMA_INSTALLATION_CACHE_TTL_SECONDS = "600"

# Required secrets:
# wrangler secret put GITHUB_APP_ID
# wrangler secret put GITHUB_APP_PRIVATE_KEY_PEM
# Optional: restrict to a specific installation id instead of discovering by repo.
# wrangler secret put GITHUB_APP_INSTALLATION_ID
