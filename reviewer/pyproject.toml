[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noema-reviewer"
version = "0.1.0"
description = "Noema independent PydanticAI second reviewer for ContextualWisdomLab pull requests."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-ai-slim[openai]>=2.9.0,<3",
]

[project.scripts]
noema-reviewer = "noema_reviewer.cli:main"

# noema-core is not yet published as an immutable index dependency. Until that
# release exists, the reviewer wheel is built from the monorepo checkout and
# includes the shared module from its single canonical source path. This keeps a
# normal wheel install runnable without copying the module into reviewer/.
[tool.setuptools]
packages = ["noema_reviewer", "noema_core"]

[tool.setuptools.package-dir]
noema_reviewer = "noema_reviewer"
noema_core = "../packages/noema-core/src/noema_core"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "interrogate>=1.7.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "../packages/noema-core/src"]
addopts = "--cov=noema_reviewer --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["noema_reviewer"]
omit = ["tests/*", "noema_reviewer/__main__.py"]

[tool.coverage.report]
show_missing = true

[tool.interrogate]
fail-under = 100
exclude = ["tests"]
