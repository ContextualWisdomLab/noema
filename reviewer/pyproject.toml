[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noema-reviewer"
version = "0.1.0"
description = "Noema independent PydanticAI second reviewer for ContextualWisdomLab pull requests."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-ai-slim[openai]>=0.0.14",
    # noema-core is not yet published (see open risk #2 in
    # docs/adr/0012-shared-noema-core-package.md); it is provided via
    # PYTHONPATH ("../packages/noema-core/src") the same way this
    # repository already provides `noema_reviewer` itself in CI. Pin it
    # here as a normal dependency once it is published to an index.
]

[project.scripts]
noema-reviewer = "noema_reviewer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "interrogate>=1.7.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "../packages/noema-core/src"]
addopts = "--cov=noema_reviewer --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["noema_reviewer"]
omit = ["tests/*", "noema_reviewer/__main__.py"]

[tool.coverage.report]
show_missing = true

[tool.interrogate]
fail-under = 100
exclude = ["tests"]
