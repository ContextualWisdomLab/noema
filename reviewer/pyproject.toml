[build-system]
requires = ["setuptools>=68"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "noema-reviewer"
version = "0.1.0"
description = "Noema independent PydanticAI second reviewer for ContextualWisdomLab pull requests."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-ai-slim[openai]>=2.9.0,<3",
]

[project.scripts]
noema-reviewer = "noema_reviewer.cli:main"

# noema-core is not yet published as an immutable index dependency. The custom
# PEP 517 backend stages the exact canonical monorepo source into a build-only
# directory. That snapshot is embedded in an sdist, allowing its wheel to build
# without the original checkout while keeping repository source authority in
# packages/noema-core.
[tool.setuptools]
packages = ["noema_reviewer", "noema_core"]

[tool.setuptools.package-dir]
noema_reviewer = "noema_reviewer"
noema_core = "_build_include/noema_core"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "interrogate>=1.7.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "../packages/noema-core/src"]
addopts = "--cov=noema_reviewer --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["noema_reviewer"]
omit = ["tests/*", "noema_reviewer/__main__.py"]

[tool.coverage.report]
show_missing = true

[tool.interrogate]
fail-under = 100
exclude = ["tests"]
