[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noema-core"
version = "0.1.0"
description = "Shared PydanticAI Agent-construction wiring for Noema's per-context consumers (reviewer, naruon, and future consumers)."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pydantic-ai-slim[openai]>=0.0.14",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "interrogate>=1.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--cov=noema_core --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["noema_core"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true

[tool.interrogate]
fail-under = 100
exclude = ["tests"]
